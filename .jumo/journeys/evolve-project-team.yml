apiVersion: jumo.dev/v1
kind: AssistedJourney
metadata:
  id: evolve-project-team
  namespace: dev.jumo.core
  name: Faire évoluer l'équipe projet
spec:
  journeyId: evolve-project-team
  name: Faire évoluer l'équipe projet
  summaryI18nKey: evolveProjectTeamSummary
  description: Modifiez, ajoutez ou réorganisez les rôles et les groupes d'indépendance d'une équipe
    projet existante.
  category: teamsProjects
  icon: mdi-account-edit-outline
  interruptible: true
  concurrencyPolicy: MULTIPLE_ACTIVE_RUNS
  requiredCapabilities: [journey.run.start, journey.run.read, journey.run.abandon, journey.step.select, journey.step.submit, journey.proposal.submit, contract.change.propose]
  policySetRefs: [{kind: PolicySet, namespace: dev.jumo.core, id: security-baseline}]
  emitsCapability: contract.change.propose
  emissionBundle:
    # Fan-out first, TeamSpec last -- same rule build-project-team uses (team-and-operator-design-
    # journeys AC2): TeamSpec's own referenceChecks resolve a proposed roleRef only through the
    # same-bundle registry, which needs that RoleDefinition already rendered.
    - fanOutCollection: proposedMembers
      emission:
        targetKind: RoleDefinition
        identifier: {fromField: roleRef}
        pathTemplate: .jumo/roles/${id}.yml
        documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: role-definition}
        validations:
          - {field: roleRef, required: true, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'}
          - {field: role, required: true, minimumLength: 3}
          - {field: mission, required: true, minimumLength: 10}
    - fanOutCollection: proposedMembers
      emission:
        targetKind: AgentDefinition
        identifier: {fromField: roleRef}
        pathTemplate: .jumo/agents/${id}.yml
        documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: agent-definition}
        validations:
          - {field: responsibilities, minimumItems: 1}
          - {field: requestedCapabilities, minimumItems: 1}
    - fanOutCollection: proposedMembers
      emission:
        targetKind: WorkerRequirementProfile
        identifier: {fromField: roleRef}
        pathTemplate: .jumo/worker-requirements/${id}.yml
        documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: worker-requirement-profile}
        validations:
          - {field: taskClasses, minimumItems: 1}
          - {field: modalities, minimumItems: 1}
    - fanOutCollection: proposedMembers
      emission:
        targetKind: RoleAssignment
        identifier: {fromField: roleRef}
        pathTemplate: .jumo/role-assignments/${id}.yml
        documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: role-assignment}
        referenceChecks:
          - {field: roleRef, kind: RoleDefinition}
          - {field: roleRef, kind: AgentDefinition}
          - {field: roleRef, kind: WorkerRequirementProfile}
    - emission:
        targetKind: TeamSpec
        identifier: {fromField: teamId}
        pathTemplate: .jumo/teams/${id}.yml
        documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: team-spec}
        validations:
          - {field: teamId, required: true}
          - {field: purpose, required: true, minimumLength: 10}
          - {field: members, minimumItems: 2}
          # team-and-operator-design-journeys AC3: an explicit declared Project is required, and
          # also feeds the new RoutingEligibility emission below.
          - {field: projectRef, required: true}
        fieldDefaults:
          - {field: teamName, value: 'Evolved Team ${id}'}
        referenceChecks:
          - {field: members, kind: RoleDefinition, itemPath: roleRef}
          - {field: projectRef, kind: Project}
        collectionProjections:
          - field: members
            keys: [roleRef, role]
            optionalKeys: [independenceGroup]
            itemReferenceKind: RoleDefinition
            itemValidations:
              - {field: role, minimumLength: 3}
          - field: members
            sourceField: proposedMembers
            keys: [roleRef, role]
            optionalKeys: [independenceGroup]
            itemValidations:
              - {field: role, minimumLength: 3}
    # team-and-operator-design-journeys AC3, 2026-08-30 owner ruling: a team-composition change
    # emits a new RoutingEligibility record rather than updating one in place or leaving it
    # untouched, matching the append-only-projection convention WorkOrder evidence/ledger records
    # already use. suffix: RUN_PREFIX (AssistedJourneyIdentifierSuffix, already used by
    # the-onboarding-trip.yml) gives every run its own id/path, so this never collides with the
    # team's original RoutingEligibility from build-project-team or an earlier evolution.
    - emission:
        targetKind: RoutingEligibility
        identifier: {fromField: teamId, suffix: RUN_PREFIX}
        pathTemplate: .jumo/routing-eligibilities/${id}.yml
        documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: routing-eligibility}
        validations:
          - {field: teamId, required: true, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'}
          - {field: projectRef, required: true}
        fieldDefaults:
          - {field: teamName, value: 'Evolved Team ${teamId}'}
        referenceChecks:
          - {field: projectRef, kind: Project}
          - {field: teamId, kind: TeamSpec}
  steps:
    - id: analyze-evolution-need
      requiredObligations: []
      name: Analyse du besoin d'évolution
      description: Nestor examine le besoin d'évolution exprimé avant la sélection de l'équipe.
      personaNarration: Avant de faire évoluer une équipe, discutons de ce qui doit changer.
      stepKind: DIALOGUE_COLLECT
      requiredFields: []
      promptTemplateRef:
        kind: PromptTemplate
        namespace: dev.jumo.core
        id: nestor-deliberation
    - id: select-team
      requiredObligations: []
      name: Sélection de l'équipe
      description: Choisissez l'équipe à faire évoluer et précisez l'intention d'évolution.
      personaNarration: Quelle équipe souhaitez-vous réorganiser ou enrichir de nouveaux jumeaux ?
      requiredFields:
        - {field: teamId, i18nKey: journeyTeamIdField}
        - {field: purpose, i18nKey: journeyTeamEvolutionPurposeField}
        - {field: projectRef, i18nKey: journeyProjectRefField}
    - id: update-members
      requiredObligations: []
      name: Composition des membres
      description: Ajustez les assignations d'opérateurs et les groupes d'indépendance.
      personaNarration: Ajustons la composition des membres pour respecter l'indépendance de revue.
      stepKind: COLLECT
      requiredFields:
        - {field: members, i18nKey: journeySelectRoles}
      projectionSpecRef:
        kind: ProjectionSpec
        namespace: dev.jumo.core
        id: select-members
    - id: confirm-evolution
      requiredObligations: []
      name: Confirmation de l'évolution
      description: Vérifiez le diff contractuel avant d'enregistrer la proposition.
      personaNarration: Tout est prêt pour enregistrer la proposition de modification d'équipe.
      requiredFields:
        - {field: confirmed, i18nKey: journeyConfirmField}
  resourceBudgetRef:
    kind: ResourceBudget
    namespace: dev.jumo.core
    id: interactive
