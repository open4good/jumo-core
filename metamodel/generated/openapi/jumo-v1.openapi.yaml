        context:
          $ref: '#/components/schemas/WorkerContextRequirement'
        interaction:
          $ref: '#/components/schemas/WorkerInteractionRequirement'
        quality:
          $ref: '#/components/schemas/WorkerQualityRequirement'
        limits:
