      - infer_transitive_access
      - self_approve_privilege_change
      - modify_root_of_trust
      - act_as_super_administrator
      title: ProhibitedAuthority
      description: Explicit denials that no policy may override.
    CoordinationMechanism:
      type: string
      enum:
      - DIRECT_SUPERVISION
      - STANDARDIZED_PROCESS
      - STANDARDIZED_OUTPUT
      - STANDARDIZED_SKILL
      - MUTUAL_ADJUSTMENT
      - ADVERSARIAL_REVIEW
      - CONSENT
      title: CoordinationMechanism
    CoordinationProfileName:
      type: string
      enum:
      - FAST_LANE
      - VERTICAL_COMMAND
      - COOPERATIVE_ADAPTIVE
      - ASSURANCE_CELL
      title: CoordinationProfileName
    Reversibility:
      type: string
      enum:
      - REVERSIBLE
      - IRREVERSIBLE
      title: Reversibility
    BearerKind:
      type: string
      enum:
      - HUMAN
      - AGENT
      - FEDERATED_PEER
      title: BearerKind
    MethodologyComplianceLevel:
      type: string
      enum:
      - INSPIRED
      - MAPPED
      - CONFORMANT
      title: MethodologyComplianceLevel
    IntentKind:
      type: string
      enum:
      - QUESTION
      - RESEARCH
      - PROJECT_WORK
      - STATUS
      - COMMUNICATION
      - OTHER
      title: IntentKind
    DispositionOutcome:
      type: string
      enum:
      - HANDLE_DIRECTLY
      - ROUTE_TO_ROLE
      - ASK_FOR_INFORMATION
      - DEFER
      - DECLINE
      - ESCALATE
      title: DispositionOutcome
    OnExhaustionOutcome:
      type: string
      enum:
      - DEFER
      - DECLINE
      - ESCALATE
      title: OnExhaustionOutcome
    AcknowledgementTrigger:
