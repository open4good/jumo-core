    WorkOrder:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/WorkOrderSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: WorkOrder
      description: 'One unit of dispatched work, in Git. Renamed from WorkItem. Carries
        debtor, creditor, and condition (docs/concepts/positionnement-conceptuel.md#engagements-sociaux):
        an accepted order is not yet a social commitment without a named debtor, creditor,
        and discharge condition. The existing state enum (PROPOSED..FAILED) is retained
        as the closest Git-contract analogue of create/accept/discharge; the fuller
        create/discharge/release/cancel/assign operation set belongs to the runtime
        Matter/Episode this Git file is not -- this module models Git contracts only.'
    WorkOrderSpec:
      properties:
        purpose:
          type: string
          pattern: ^.{10,}$
        producerRoleDefinitionRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The individual accountable role. A team is never the final
            accountable addressee.
        teamSpecRef:
          $ref: '#/components/schemas/ContractReference'
        projectRef:
          $ref: '#/components/schemas/ContractReference'
        roadmapRef:
          type: string
          description: Groups durable work contracts into a generated roadmap projection.
        decisionRefs:
          items:
            type: string
          type: array
          description: Architecture decisions this work implements or expects.
        verifierRoleDefinitionRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The role that checks the result against the criteria below.
            May not be the producer; resolves through teamSpecRef to prove a different
            independence group (Rego).
        state:
          $ref: '#/components/schemas/WorkOrderState'
        declineReason:
          $ref: '#/components/schemas/WorkOrderDeclineReason'
        suspendedReason:
          type: string
          pattern: ^.{1,160}$
          description: Set when state is PROPOSED after having been ACCEPTED or IN_PROGRESS,
            to record why work paused rather than why it was declined. Distinct from
            declineReason, which is permanent.
        debtor:
          type: string
          description: The role or team that owes this work (commitment lifecycle
            addition, conceptual upgrades table). Defaults conceptually to producerRoleDefinitionRef/teamSpecRef;
            kept as an explicit field so a WorkOrder assigned onward carries an accountable
            debtor independent of who drafted it.
        creditor:
          type: string
          description: The role, team, or Project the work is owed to.
        condition:
          type: string
          description: The condition under which this commitment is discharged, in
            addition to (not instead of) acceptanceCriteria -- acceptanceCriteria
            is what is checked; condition is the commitment-theoretic statement of
            when the debt is considered settled.
        acceptanceCriteria:
          items:
            $ref: '#/components/schemas/AcceptanceCriterion'
          type: array
          description: What the result is checked against. Required from ACCEPTED
            onward (Rego, same as the source schema's conditional).
        specification:
          items:
            $ref: '#/components/schemas/WorkOrderSpecification'
          type: array
          description: Long-form design lots too large for purpose/condition/acceptanceCriteria
            -- Markdown body, no language restriction (WorkOrder specification prose
            is exempt from the English-only rule, AGENTS.md).
        pathScope:
          items:
            type: string
          type: array
          pattern: ^.{1,}$
          description: Glob patterns the work may touch.
        ring:
          allOf:
          - $ref: '#/components/schemas/Ring'
          description: 'The ring this work acts on. RING_0_ROOT_OF_TRUST exclusion
            (source schema''s `not: const`) moves to Rego.'
        dependsOnWorkOrderRefs:
          items:
            $ref: '#/components/schemas/ContractReference'
          type: array
          description: WorkOrders that must be COMPLETED before this one starts.
        parentWorkOrderRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The larger item this decomposes.
        sourceRefs:
          items:
            type: string
          type: array
          pattern: ^.{1,}$
        contractRevision:
          type: string
          pattern: ^.{7,}$
