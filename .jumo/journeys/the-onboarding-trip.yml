apiVersion: jumo.dev/v1
kind: AssistedJourney
metadata:
  id: the-onboarding-trip
  namespace: dev.jumo.core
  name: Le parcours d'accueil
spec:
  journeyId: the-onboarding-trip
  name: Le parcours d'accueil
  summaryI18nKey: onboardingSummary
  description: 'Le parcours d''accueil et d''initialisation de l''environnement Jumo : configuration d''identité, provisioning
    de la VM d''exécution, liaison du dépôt Git racine, appairage des clients IA, captation d''intention pour les connecteurs,
    mise en place de ces connecteurs via le sous-parcours dédié, et bilan d''activation.'
  category: workspace
  icon: mdi-compass-outline
  interruptible: false
  concurrencyPolicy: SINGLE_ACTIVE_RUN
  requiredCapabilities: [journey.run.start, journey.run.read, journey.run.abandon, journey.step.select, journey.step.submit, journey.proposal.submit, contract.change.propose]
  policySetRefs: [{kind: PolicySet, namespace: dev.jumo.core, id: security-baseline}]
  firstRunMandatory: true
  lifetimeUnique: true
  heroImage: /images/nestor-avatar.svg
  presentation: {surfaceMode: INLINE, stepperLayout: VERTICAL, maxWidth: 960}
  emitsCapability: contract.change.propose
  navigationMode: FREE
  emission:
    targetKind: WorkOrder
    identifier: {fromField: nickname, defaultValue: workspace, suffix: RUN_PREFIX}
    pathTemplate: .jumo/work/${id}.yml
    documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: onboarding-work-order}
  steps:
    - id: setup-identity
      requiredObligations: []
      name: Identité et Espace Yamaka
      description: Configuration du nickname (exposition yamaka.me/u/<nickname>). L’identité de machine reste interne à l’enrôlement mTLS.
      personaNarration: Bienvenue sur Jumo ! Je suis Nestor, votre coordinateur. Commençons par définir votre identité et
        préparer votre espace.
      descriptionI18nKey: journeyOnboardingSetupIdentityDescription
      narrationI18nKey: journeyOnboardingSetupIdentityNarration
      stepKind: COLLECT
      requiredFields:
        - {field: nickname, i18nKey: journeyNicknameField}
      projectionSpecRef:
        kind: ProjectionSpec
        namespace: dev.jumo.core
        id: setup-identity
    - id: provision-execution-cell
      requiredObligations: []
      name: Provisioning de la VM d'exécution
      description: En attente du démarrage de la VM et de la vérification du propriétaire.
      personaNarration: Votre machine virtuelle d'exécution se prépare. Nous attendons son initialisation et sa vérification.
      descriptionI18nKey: journeyOnboardingProvisionExecutionCellDescription
      narrationI18nKey: journeyOnboardingProvisionExecutionCellNarration
      stepKind: AWAIT
      dependsOn: [setup-identity]
      parallelizable: true
      requiredFields: []
      processSpecRef:
        kind: ProcessSpec
        namespace: dev.jumo.core
        id: execution-cell-provisioning--1-0-0
    - id: link-repository
      requiredObligations: []
      name: Dépôt Git Principal
      description: Liaison de votre dépôt Git racine garantissant la portabilité complète de votre espace.
      personaNarration: Votre dépôt Git est la source contractuelle de vérité de tout votre environnement. Renseignez votre
        dépôt racine.
      descriptionI18nKey: journeyOnboardingLinkRepositoryDescription
      narrationI18nKey: journeyOnboardingLinkRepositoryNarration
      stepKind: COLLECT
      dependsOn: [setup-identity]
      parallelizable: true
      requiredFields:
        - {field: gitRepoUrl, i18nKey: journeyGitRepoUrlField}
        - {field: gitBranch, i18nKey: journeyGitBranchField}
      projectionSpecRef:
        kind: ProjectionSpec
        namespace: dev.jumo.core
        id: link-repository-form
    - id: configure-api-accounts
      requiredObligations: []
      name: Configuration de vos API
      description: Activation des comptes API déclarés et qualification réelle des modèles accessibles, sans compte implicite.
      personaNarration: Sélectionnons les comptes déclarés, activons-les en toute sécurité et observons réellement leurs capacités.
      descriptionI18nKey: journeyOnboardingConfigureApiAccountsDescription
      narrationI18nKey: journeyOnboardingConfigureApiAccountsNarration
      stepKind: SUB_JOURNEY
      dependsOn: [setup-identity]
      parallelizable: true
      requiredFields: []
      presentationOverride: {subJourneyOpenMode: MODAL}
      subAssistedJourneyRef: {kind: AssistedJourney, namespace: dev.jumo.core, id: configure-api-accounts}
    - id: capture-connector-intent
      requiredObligations: []
      name: Découverte des Connecteurs
      description: Dialogue avec Nestor pour analyser vos outils et sélectionner les connecteurs appropriés.
      personaNarration: Discutons de votre quotidien de développeur pour déterminer quels connecteurs et MCP activer.
      descriptionI18nKey: journeyOnboardingCaptureConnectorIntentDescription
      narrationI18nKey: journeyOnboardingCaptureConnectorIntentNarration
      stepKind: DIALOGUE_COLLECT
      dependsOn: [setup-identity]
      parallelizable: true
      requiredFields:
        - {field: selectedConnectors, i18nKey: journeyConnectorsField}
      promptTemplateRef:
        kind: PromptTemplate
        namespace: dev.jumo.core
        id: connector-intent-capture
    - id: setup-connectors
      requiredObligations: []
      name: Mise en Place des Connecteurs
      description: Sélection puis confirmation des connecteurs à appairer, via le parcours réutilisable dédié.
      personaNarration: Passons à la mise en place concrète des connecteurs que nous venons de choisir ensemble.
      descriptionI18nKey: journeyOnboardingSetupConnectorsDescription
      narrationI18nKey: journeyOnboardingSetupConnectorsNarration
      stepKind: SUB_JOURNEY
      dependsOn: [setup-identity]
      parallelizable: true
      requiredFields: []
      subAssistedJourneyRef:
        kind: AssistedJourney
        namespace: dev.jumo.core
        id: setup-connector
    - id: summary-and-activate
      requiredObligations: []
      name: Bilan et Activation
      description: Récapitulatif de votre espace initialisé, émission de la proposition contractuelle et activation.
      personaNarration: Tout est prêt ! Vérifions ensemble le récapitulatif avant de sceller la configuration racine de votre
        espace.
      descriptionI18nKey: journeyOnboardingSummaryAndActivateDescription
      narrationI18nKey: journeyOnboardingSummaryAndActivateNarration
      stepKind: COLLECT
      dependsOn: [provision-execution-cell, link-repository, configure-api-accounts, capture-connector-intent, setup-connectors]
      requiredFields:
        - {field: roadmapRef, i18nKey: journeyRoadmapRefField}
        - {field: confirmed, i18nKey: journeyConfirmField}
      projectionSpecRef:
        kind: ProjectionSpec
        namespace: dev.jumo.core
        id: onboarding-summary-and-activate
  resourceBudgetRef:
    kind: ResourceBudget
    namespace: dev.jumo.core
    id: interactive
