      description: Whether the role may choose any dependency-ready step or must follow
        declaration order.
    AssistedJourneyConcurrencyPolicy:
      type: string
      enum:
      - SINGLE_ACTIVE_RUN
      - MULTIPLE_ACTIVE_RUNS
      title: AssistedJourneyConcurrencyPolicy
    AssistedJourneyCompletionMode:
      type: string
      enum:
      - PROPOSAL
      - OBSERVATION
      title: AssistedJourneyCompletionMode
      description: Whether a journey emits a governed proposal or only records an
        observation.
    JourneyVerificationTarget:
      type: string
      enum:
      - PROVIDER_ACCOUNT
      - CLI_SESSION
      - EXECUTION_CELL
      title: JourneyVerificationTarget
    JourneyVerificationCapability:
      type: string
      enum:
      - PROVIDER_SMOKE
      - PROVIDER_LADDER_QUALIFICATION
      - CLI_SMOKE
      - SESSION_PAIRING
      title: JourneyVerificationCapability
    WorkOrderDeclineReason:
      type: string
      enum:
      - OUT_OF_SCOPE
      - NO_CAPABILITY
      - OVER_BUDGET
      - CONFLICTING_COMMITMENT
      - AMBIGUOUS
      - SUPERSEDED
      title: WorkOrderDeclineReason
    RequiredOwners:
      type: string
      enum:
      - BOTH_WHEN_DIFFERENT
      - BOTH_ALWAYS
      - TARGET_ONLY
      title: RequiredOwners
    ForbiddenSolicitationReach:
      type: string
