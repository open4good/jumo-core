          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/PracticeSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: Practice
      description: 'A recurring governed invocation. Rather than owning its own cron/timezone/invokes
        fields, a Practice references a ProcessSpec (execution.yaml) whose START step
        is kind: TIMER -- the schedule lives once, on the process, not twice (once
        here and once conceptually on whatever the source schema''s separate WorkflowDeclaration
        would have needed). This removes the source schema''s `schedule` and `invokes`
        blocks entirely; `delivery`, `autonomy`, `budgetRef`, and `enabled` are unchanged.'
    PracticeSpec:
      properties:
