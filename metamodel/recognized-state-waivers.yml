# Tables that scripts/generate/recognized-state-coverage.py accepts as covered without a matching
# POSTGRES-authority metamodel class, because a human has confirmed the table does not warrant one
# (a join table, a denormalized projection, migration tooling). Empty for now: canonical decision 15
# ratchets recognized_state_uncovered_tables downward one class at a time; a table only belongs here
# once someone has actually looked at it, not as a shortcut to lower the count.
waivers:
  - table: lease_invocation_grant_binding
    reason: join table binding an ExecutionCellLease to a capability grant the trusted control
      plane already issued; it carries no independent recognized business state of its own.
  - table: mcp_discovery_snapshot
    reason: append-only observation log of one bounded MCP discovery negotiation outcome, machine-
      derived and never Git-governed -- same character as this corpus's own already-uncovered
      audit_event and mcp_registry_raw_payload tables, both plain observational logs rather than
      recognized business state. Reviewed now rather than left silently uncovered because this
      table is what newly pushed the ratchet past its ceiling (mcp-target-machine-discovery).
  - table: mcp_discovery_binding
    reason: owner-approved, single-use, max-TTL-PT2M DISCOVERY-binding runtime lease
      (mcp-target-machine-discovery AC3) -- deliberately not a Git-declared class, same owner
      ruling that already rejected SecretBinding as the wrong shape for this ephemeral credential.
      Every row is expected to expire and be superseded within minutes; a POSTGRES-authority class
      would document a shape with no lasting recognized business state to project.
  - table: oauth_authorization_states
    reason: server-side PKCE state for one in-flight OAuth authorization-code ceremony
      (generic-mcp-runtime-tools AC2) -- single-use (consumed via DELETE ... RETURNING on the
      callback that redeems it) and short-TTL (10 minutes), same "deliberately not a Git-declared
      class, no lasting recognized business state" character as this file's own mcp_discovery_binding
      entry. The code_verifier it holds must never reach Git by design (it is generated fresh per
      ceremony and only ever compared against the corresponding request, never persisted anywhere
      durable), ruling out a metamodel class on the same grounds that already excluded one here.
  - table: knowledge_corpus_grant
    reason: short-lived, server-derived narrowing of an already Git-declared KnowledgeCorpus set
      (knowledge-retrieval-access-and-cockpit AC1) -- same ephemeral-authorization character as
      invocation_capability_grant (jumo's own sibling table, itself still uncovered rather than
      waived only because no prior pass reviewed it under ratchet pressure). Reviewed now because
      this table is what newly pushed the ratchet past its ceiling. A grant documents no business
      state beyond what the KnowledgeCorpus contracts it narrows already declare.
  - table: knowledge_corpus_grant_event
    reason: append-only lifecycle log for knowledge_corpus_grant above -- same reasoning, and the
      same relationship mcp_discovery_snapshot's entry already draws to this corpus's plain
      observational logs.
  - table: event_ingress_receipt
    reason: sanitized, deduplicated receipt of one verified external event
      (event-ingress-admission-and-attention-runtime AC2) -- bounded and purged at the owning
      EventIngress's own retentionBoundary, documenting no business state beyond what the
      Git-declared EventIngress/ProcessSpec pairing already commits to. Same ephemeral,
      server-derived character as mcp_discovery_snapshot and knowledge_corpus_grant's own waiver
      entries; append-only, no audit trigger. Reviewed now, at the table's own creation, rather
      than left silently uncovered.
