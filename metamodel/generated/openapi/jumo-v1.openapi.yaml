      description: 'Naming, voice and visual presentation. Decorative and linguistic
        only: a theme carries no capability, policy, budget, assurance or workflow
        field, so renaming an agent cannot change what it may do. Open string-keyed
        maps in the source schema (terminology, roleOverrides, objectForms, rooms)
