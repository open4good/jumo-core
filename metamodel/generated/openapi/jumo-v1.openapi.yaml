    ConnectorIntentProposal:
      properties:
        selectedConnectorDefinitionRefs:
          items:
            $ref: '#/components/schemas/ContractReference'
          type: array
          description: ConnectorDefinition ids proposed, referencing the supplied
            catalog only.
        rationale:
          items:
            $ref: '#/components/schemas/ConnectorIntentRationale'
          type: array
          description: One entry per selectedConnectorRefs, explaining the match to
            the stated intent.
        openQuestion:
          type: string
          description: A clarifying question to continue the dialogue when intent
            is still ambiguous. Absent once the proposal is considered final for this
            turn.
      additionalProperties: false
      type: object
      title: ConnectorIntentProposal
      description: 'Structured output of a DIALOGUE_COLLECT step capturing what connectors
        the assistant proposes in response to the user''s stated intent (AssistedJourneyStep.promptRef,
        PromptOutput form: STRUCTURED). A proposal, never a grant or a configuration:
        selectedConnectorRefs must be drawn only from the realm''s declared ConnectorDefinition
        catalog supplied as the prompt''s RAG context (the same corpus ContractLoader
        loads for CapabilityGatewayService), never invented by the model. The user
        still confirms selection explicitly; this class only bounds what the model
        may say back.'
    ConnectorIntentRationale:
      properties:
        connectorDefinitionRef:
          $ref: '#/components/schemas/ContractReference'
        reason:
          type: string
          pattern: ^.{1,}$
      additionalProperties: false
      type: object
      required:
      - connectorDefinitionRef
      - reason
      title: ConnectorIntentRationale
    ConnectorAppraisal:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ConnectorAppraisalSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ConnectorAppraisal
      description: 'The reviewed judgement that lets an McpBundle leave DECLARED.
        Findings live here because they are a decision; the runs behind them stay
        recognized state and are cited by evidenceRefs. An appraisal grants no authority:
        it unlocks a lifecycle transition.'
    ConnectorAppraisalSpec:
      properties:
        ownerRealm:
          type: string
        mcpBundleRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The McpBundle this appraises. Refused across Realms (Rego).
        appraisedDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: The exact artifact that was looked at. When the bundle digest
            moves, this appraisal stops being accepted, so an upstream version bump
            cannot inherit the prior review.
        appraisedByRoleDefinitionRef:
          $ref: '#/components/schemas/ContractReference'
        verifiedByRoleDefinitionRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The role that checked it, which is not the one that performed
            it.
        appraisedAt:
          type: string
          format: date-time
        verdict:
          $ref: '#/components/schemas/AppraisalVerdict'
        conditions:
          items:
            type: string
          type: array
          pattern: ^.{10,}$
          description: Required and non-empty under ACCEPTED_WITH_CONDITIONS (Rego).
        dimensions:
          $ref: '#/components/schemas/AppraisalDimensions'
        upstreamInventory:
          items:
            $ref: '#/components/schemas/UpstreamToolEntry'
          type: array
          description: Every tool the upstream server offered when it was looked at,
            exposed or not -- enumerating what was held back is the point of the whole
            document.
        evidenceRefs:
          items:
            type: string
          type: array
          pattern: ^.{1,}$
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - mcpBundleRef
      - appraisedDigest
      - appraisedByRoleDefinitionRef
      - verifiedByRoleDefinitionRef
      - verdict
      - dimensions
      - upstreamInventory
      - evidenceRefs
      title: ConnectorAppraisalSpec
    AppraisalDimensions:
      properties:
        provenance:
          allOf:
          - $ref: '#/components/schemas/AppraisalDimension'
          description: Signature, digest, SBOM, licence and publisher.
        security:
          allOf:
          - $ref: '#/components/schemas/AppraisalDimension'
          description: Blast radius per operation, network egress, secret material
            held, and untrusted output.
        relevance:
          allOf:
          - $ref: '#/components/schemas/AppraisalDimension'
          description: Whether each exposed operation maps to a capability this Realm
            already declares.
        agentUsability:
          allOf:
          - $ref: '#/components/schemas/AppraisalDimension'
          description: Whether an agent can use it without guessing.
      additionalProperties: false
      type: object
      required:
      - provenance
      - security
      - relevance
      - agentUsability
      title: AppraisalDimensions
      description: 'Four questions asked of every submission, separate because they
        fail independently: a perfectly signed artifact can be unusable by an agent,
        and a well-described tool can have no business in this Realm.'
    AppraisalDimension:
      properties:
        outcome:
          $ref: '#/components/schemas/AppraisalDimensionOutcome'
        finding:
          type: string
          pattern: ^.{10,}$
      additionalProperties: false
      type: object
      required:
      - outcome
      - finding
      title: AppraisalDimension
    UpstreamToolEntry:
      properties:
        upstreamToolName:
          type: string
          pattern: ^.{1,}$
        disposition:
          $ref: '#/components/schemas/UpstreamToolDisposition'
        reason:
          type: string
          pattern: ^.{10,}$
      additionalProperties: false
      type: object
      required:
      - upstreamToolName
      - disposition
      title: UpstreamToolEntry
      description: 'Reason required when disposition is WITHHELD or QUARANTINED (Rego):
        exposing a tool is justified by the operation that maps it to a capability;
        holding one back has no such document, so the reason lives here or nowhere.'
    McpBundle:
