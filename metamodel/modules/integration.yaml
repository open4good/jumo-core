        required: true
      argumentsDigest:
        range: string
        required: true
      argumentsSize:
        range: integer
        required: true
      schemaDigest:
        range: string
        required: true
      policyRevision:
        range: string
        required: true
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: COMMAND
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpInvocationAuthorizationReceipt:
    description: Signed, short-lived authorization receipt bound to exactly one MCP invocation.
    attributes:
      invocationId:
        range: Identifier
        required: true
      grantId:
        range: Identifier
        required: true
      leaseId:
        range: Identifier
        required: true
      operationName:
        range: string
        required: true
      argumentsDigest:
        range: string
        required: true
      schemaDigest:
        range: string
        required: true
      expiresAt:
        range: string
        required: true
      signingKeyName:
        range: string
        required: true
      signature:
        range: string
        required: true
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: VALUE_OBJECT
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpInvocationDispatchRequest:
    description: Machine acknowledgement that a signed MCP invocation receipt is about to dispatch upstream.
    attributes:
      receipt:
        range: McpInvocationAuthorizationReceipt
        required: true
        inlined: true
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: COMMAND
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpInvocationOutcome:
    description: Sanitized terminal outcome for one dispatched MCP invocation.
    attributes:
      invocationId:
        range: Identifier
        required: true
      leaseId:
        range: Identifier
        required: true
      outcome:
        range: McpInvocationOutcomeType
        required: true
      resultDigest:
        range: string
      resultSize:
        range: integer
      reasonCode:
        range: string
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: EVENT
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ImportedSchemaCandidate:
    description: Candidate LinkML class proposal derived from an external MCP tool schema.
    attributes:
      candidateId:
        range: string
        required: true
      externalSchemaDigest:
        range: string
        required: true
      proposedLinkmlClass:
        range: string
        required: true
      transformationStrategy:
        range: string
        required: true
      justification:
        range: string
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ConnectorIntegration:
    description: Durable Git contract grouping related connectors (e.g. Google Workspace) into a coherent UX unit.
    attributes:
      apiVersion:
        range: string
        equals_string: jumo.dev/v1
        required: true
      kind:
        range: string
        equals_string: ConnectorIntegration
        required: true
      metadata:
        range: Metadata
        required: true
        inlined: true
      spec:
        range: ConnectorIntegrationSpec
        required: true
        inlined: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
      jumo.composition: ADDITIVE
  ConnectorIntegrationSpec:
    description: Specification for a ConnectorIntegration contract.
    attributes:
      ownerRealm:
        range: Identifier
        required: true
      category:
        range: string
        required: true
      memberConnectorRefs:
        range: ContractReference
        multivalued: true
        inlined_as_list: true
      description:
        range: string
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ConnectorPackage:
    description: Platform-only Git contract manifest defining a complete connector package under .jumo/connector-packages/<id>/.
      Publication in the Platform corpus is a technical-reuse fact and confers no Realm consent, secret or activation authority
      (ADR-0050 decision 8).
    attributes:
      apiVersion:
        range: string
        equals_string: jumo.dev/v1
        required: true
      kind:
        range: string
        equals_string: ConnectorPackage
        required: true
      metadata:
        range: Metadata
        required: true
        inlined: true
      spec:
        range: ConnectorPackageSpec
        required: true
        inlined: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: INTERNAL_WORKER
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
      jumo.composition: SEALED
  ConnectorPackageSpec:
    description: Specification for a ConnectorPackage manifest.
    attributes:
      connectorId:
        range: Identifier
        required: true
      version:
        range: string
        required: true
      packageDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
        description: >-
          SHA-256 of the package's content manifest. The manifest lists one line per content file,
          "<sha256 hex>  <path relative to the package directory>", sorted by path, newline
          terminated; packageDigest is sha256: followed by the SHA-256 of those bytes. Content files
          are exactly sourcePaths when declared, otherwise every file in the package directory
          except this manifest, which carries the digest and so cannot hash itself. Computed and
          checked by scripts/generate/compute-package-digests.py.
      supportedTransports:
        range: McpServerDescriptor
        multivalued: true
        inlined_as_list: true
        description: >-
          The MCP transports this package exposes. A ConnectorPackageCertification attests to
          exactly this set through supportedTransportDigests, one digest per descriptor.
      manifestPath:
        range: string
      contractsPath:
        range: string
      runtimeImageDigest:
        range: string
      sbomDigest:
        range: string
      provenanceDigest:
        range: string
      signatureDigest:
        range: string
      licenceDigest:
        range: string
      testDigest:
        range: string
      provenancePins:
        range: McpCatalogProvenancePin
        multivalued: true
        inlined_as_list: true
      sourcePaths:
        range: string
        multivalued: true
      contractPaths:
        range: string
        multivalued: true
      testPlanRefs:
        range: string
        multivalued: true
      buildRecipeRef:
        range: string
      requiresAdapter:
        range: boolean
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: INTERNAL_WORKER
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ConnectorPackageCertification:
    description: Platform-only technical certification of an exact ConnectorPackage build. Records CI-verified digests only
      (ADR-0050 decision 8); carries no Realm consent, activation or secret-authority field. Distinct from the Realm-scoped
      ConnectorAppraisal, which records human dual-consent appraisal.
    annotations:
      jumo.composition: SEALED
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: INTERNAL_WORKER
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion:
        range: string
        equals_string: jumo.dev/v1
        required: true
      kind:
        range: string
        equals_string: ConnectorPackageCertification
        required: true
      metadata:
        range: Metadata
        required: true
        inlined: true
      spec:
        range: ConnectorPackageCertificationSpec
        required: true
        inlined: true
  ConnectorPackageCertificationSpec:
    attributes:
      connectorPackageRef:
        range: ContractReference
        required: true
        inlined: true
      packageDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      imageDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      signatureDigest:
        range: string
        pattern: ^sha256:[0-9a-f]{64}$
      sbomDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      provenanceDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      licenceDigest:
        range: string
        pattern: ^sha256:[0-9a-f]{64}$
      testDigest:
        range: string
        pattern: ^sha256:[0-9a-f]{64}$
      supportedTransportDigests:
        range: string
        multivalued: true
        required: true
        minimum_cardinality: 1
        pattern: ^sha256:[0-9a-f]{64}$
        description: >-
          One digest per McpServerDescriptor in the certified package's supportedTransports, each
          sha256: followed by the SHA-256 of that descriptor's canonical JSON -- object keys sorted,
          no insignificant whitespace, absent fields omitted. Certifying a transport the package
          does not declare, or omitting one it does, is refused by
          corpus.certification.transport-consistency. Computed by
          scripts/generate/compute-package-digests.py.
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: INTERNAL_WORKER
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ConnectorCredentialRequirement:
    description: Declared credential requirements and delivery mode for a connector.
    attributes:
      credentialType:
        range: string
        required: true
      subject:
        range: string
        required: true
      requiredScopes:
        range: string
        multivalued: true
      deliveryMode:
        range: string
        required: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  OAuthClientBinding:
