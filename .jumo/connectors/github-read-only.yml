apiVersion: jumo.dev/v1
kind: ConnectorDefinition
metadata:
  id: github-read-only
  namespace: dev.jumo.core
  name: GitHub read-only repository connector
spec:
  ownerRealm: home
  lifecycle: ENABLED
  transport: MCP
  configurationRef: runtime.connectors.github-read-only
  placement: REMOTE
  operations:
    - id: read-repository
      bundleOperationRef: read-repository
      capabilityRef: repository.content.read
      description: Read the fixed public GitHub repository manifest without external effect.
  mcpBundleRef:
    kind: McpBundle
    namespace: dev.jumo.core
    id: github-read-only
