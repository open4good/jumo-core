    AgentCardTransport:
      type: string
      enum:
      - JSONRPC
      - GRPC
      - HTTP_JSON
      title: AgentCardTransport
    OrganizationRole:
      type: string
      enum:
      - OWNER
      - ADMIN
      - MEMBER
      - AUDITOR
      title: OrganizationRole
      description: 'Governance role in an Organization tenant. It is deliberately
        distinct from a RoleDefinition: organization membership coordinates contracts
        and audit only and never grants a Realm''s data, secret, execution-cell, or
        effect authority.'
    InteroperabilityAdapter:
      type: string
      enum:
      - jumo-profile-v1
      - bpmn-2.0-v1
      - a2a-v1-read-v1
      - acs-jumo-opa-v1
      title: InteroperabilityAdapter
      description: Sealed registry of authorized public interoperability adapters.
    AssistedJourneyIdentifierSuffix:
      type: string
      enum:
      - NONE
      - RUN_PREFIX
      title: AssistedJourneyIdentifierSuffix
      description: What is appended to a slugified identifier so two runs of the same
        journey do not collide.
    WorkOrderState:
