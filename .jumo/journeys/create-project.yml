apiVersion: jumo.dev/v1
kind: AssistedJourney
metadata:
  id: create-project
  namespace: dev.jumo.core
  name: Créer un projet
spec:
  journeyId: create-project
  name: Créer un projet
  summaryI18nKey: createProjectSummary
  description: Déclarez un nouveau projet gouverné, liez des dépôts GitHub externes, et mettez en
    place la documentation et les autorités d'état.
  category: teamsProjects
  icon: mdi-folder-plus-outline
  interruptible: true
  concurrencyPolicy: MULTIPLE_ACTIVE_RUNS
  requiredCapabilities: [journey.run.start, journey.run.read, journey.run.abandon, journey.step.select, journey.step.submit, journey.proposal.submit, contract.change.propose]
  policySetRefs: [{kind: PolicySet, namespace: dev.jumo.core, id: security-baseline}]
  emitsCapability: contract.change.propose
  emission:
    targetKind: Project
    identifier: {fromField: projectId}
    pathTemplate: .jumo/projects/${id}.yml
    documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: project}
    validations:
      - {field: projectId, required: true}
      - {field: purpose, required: true, minimumLength: 10}
      - {field: repository, required: true}
  steps:
    - id: define-project
      requiredObligations: []
      name: Identité du projet
      description: Renseignez l'identifiant technique et la finalité du projet.
      personaNarration: Donnons un nom et une mission claire à votre nouveau projet.
      stepKind: COLLECT
      requiredFields:
        - {field: projectId, i18nKey: journeyProjectIdField}
        - {field: purpose, i18nKey: journeyProjectPurposeField}
      projectionSpecRef:
        kind: ProjectionSpec
        namespace: dev.jumo.core
        id: create-project
    - id: bind-repository
      requiredObligations: []
      name: Dépôt Git externe
      description: Liez le dépôt GitHub cible qui recevra le code et les artefacts (ex. owner/repo).
      personaNarration: Renseignez les coordonnées de votre dépôt Git externe sous la forme owner/repo.
      stepKind: COLLECT
      requiredFields:
        - {field: repository, i18nKey: journeyGitRepoField}
      projectionSpecRef:
        kind: ProjectionSpec
        namespace: dev.jumo.core
        id: bind-repository-form
    - id: confirm-project
      requiredObligations: []
      name: Confirmation
      description: Validez la création du projet et l'émission du contrat associé.
      personaNarration: Vérifions le contrat de projet avant son scellement déclaratif.
      stepKind: COLLECT
      requiredFields:
        - {field: confirmed, i18nKey: journeyConfirmField}
      projectionSpecRef:
        kind: ProjectionSpec
        namespace: dev.jumo.core
        id: summary-and-activate
  resourceBudgetRef:
    kind: ResourceBudget
    namespace: dev.jumo.core
    id: interactive
