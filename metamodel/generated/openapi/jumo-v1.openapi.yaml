          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ConnectorPackageSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ConnectorPackage
      description: Platform-only Git contract manifest defining a complete connector
        package under .jumo/connector-packages/<id>/. Publication in the Platform
        corpus is a technical-reuse fact and confers no Realm consent, secret or activation
        authority (ADR-0050 decision 8).
    ConnectorPackageSpec:
      properties:
        connectorId:
          type: string
        version:
          type: string
        packageDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: 'SHA-256 of the package''s content manifest. The manifest lists
            one line per content file, "<sha256 hex>  <path relative to the package
            directory>", sorted by path, newline terminated; packageDigest is sha256:
            followed by the SHA-256 of those bytes. Content files are exactly sourcePaths
            when declared, otherwise every file in the package directory except this
            manifest, which carries the digest and so cannot hash itself. Computed
            and checked by scripts/generate/compute-package-digests.py.'
        supportedTransports:
          items:
            $ref: '#/components/schemas/McpServerDescriptor'
          type: array
          description: The MCP transports this package exposes. A ConnectorPackageCertification
            attests to exactly this set through supportedTransportDigests, one digest
            per descriptor.
        manifestPath:
          type: string
        contractsPath:
          type: string
        runtimeImageDigest:
          type: string
        sbomDigest:
          type: string
        provenanceDigest:
          type: string
        signatureDigest:
          type: string
        licenceDigest:
          type: string
        testDigest:
          type: string
        provenancePins:
          items:
            $ref: '#/components/schemas/McpCatalogProvenancePin'
          type: array
        sourcePaths:
          items:
            type: string
          type: array
        contractPaths:
          items:
            type: string
          type: array
        testPlanRefs:
          items:
            type: string
          type: array
        buildRecipeRef:
          type: string
        requiresAdapter:
          type: boolean
      additionalProperties: false
      type: object
      required:
      - connectorId
      - version
      - packageDigest
      title: ConnectorPackageSpec
      description: Specification for a ConnectorPackage manifest.
    ConnectorPackageCertification:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ConnectorPackageCertificationSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ConnectorPackageCertification
      description: Platform-only technical certification of an exact ConnectorPackage
        build. Records CI-verified digests only (ADR-0050 decision 8); carries no
        Realm consent, activation or secret-authority field. Distinct from the Realm-scoped
        ConnectorAppraisal, which records human dual-consent appraisal.
    ConnectorPackageCertificationSpec:
      properties:
        connectorPackageRef:
          $ref: '#/components/schemas/ContractReference'
        packageDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        imageDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        signatureDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        sbomDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        provenanceDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        licenceDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        testDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        supportedTransportDigests:
          items:
            type: string
          type: array
          pattern: ^sha256:[0-9a-f]{64}$
          description: 'One digest per McpServerDescriptor in the certified package''s
            supportedTransports, each sha256: followed by the SHA-256 of that descriptor''s
            canonical JSON -- object keys sorted, no insignificant whitespace, absent
            fields omitted. Certifying a transport the package does not declare, or
            omitting one it does, is refused by corpus.certification.transport-consistency.
            Computed by scripts/generate/compute-package-digests.py.'
      additionalProperties: false
      type: object
      required:
      - connectorPackageRef
      - packageDigest
      - imageDigest
      - sbomDigest
      - provenanceDigest
      - supportedTransportDigests
      title: ConnectorPackageCertificationSpec
