apiVersion: jumo.dev/v1
kind: ProcessSpec
metadata:
  id: attention-loop--1-1-0
  namespace: dev.jumo.core
  name: Timer-started attention loop 1.1.0
spec:
  ownerRealm: home
  projectRef:
    kind: Project
    namespace: dev.jumo.core
    id: jumo
  processId: attention-loop
  processVersion: 1.1.0
  inputType: AttentionItem
  outputType: AttentionItem
  startTrigger: TIMER
  timerDelay: PT24H
  steps:
    - id: start
      kind: START
    - id: authz
      kind: GATEWAY
      semanticStage: POLICY_EVALUATION
      gatewayMode: EXCLUSIVE
      gatewayRole: SPLIT
      pairedGatewayRef: authz-join
      opaEntrypoint: jumo.authz.decision
    - id: grant
      kind: SERVICE
      semanticStage: CAPABILITY_ACQUISITION
      capabilityRef: capability.grant.acquire
      ring: RING_1_CONTROL_PLANE
    - id: publish
      kind: SERVICE
      semanticStage: EFFECT_APPLICATION
      capabilityRef: attention.item.publish
      ring: RING_1_CONTROL_PLANE
      idempotencyKey: attention-loop-attention-item
    - id: authz-join
      kind: GATEWAY
      gatewayMode: EXCLUSIVE
      gatewayRole: JOIN
      pairedGatewayRef: authz
    - id: completed
      kind: END
      terminalState: COMPLETED
    - id: declined
      kind: END
      terminalState: DECLINED
  flows:
    - id: start-authz
      from: start
      to: authz
      payloadType: AttentionItem
    - id: authz-allow
      from: authz
      to: grant
      branchLabel: ALLOW
      payloadType: AttentionItem
    - id: authz-deny
      from: authz
      to: declined
      branchLabel: DENY
      payloadType: AttentionItem
    - id: grant-publish
      from: grant
      to: publish
      payloadType: AttentionItem
    - id: publish-join
      from: publish
      to: authz-join
      payloadType: AttentionItem
    - id: join-completed
      from: authz-join
      to: completed
      payloadType: AttentionItem
