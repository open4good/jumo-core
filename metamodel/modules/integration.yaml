      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ProviderSessionBinding:
    description: Recognized opaque binding between a holder provider session and one ExecutionMachine. It never contains a bearer
      token, refresh token, or provider credential.
    attributes:
      id:
        range: Identifier
        required: true
      ownerRealm:
        range: Identifier
        required: true
      executionMachineRef:
        range: ContractReference
        required: true
        inlined: true
      adapter:
        range: ModelAccessAdapter
        required: true
      providerAccountRef:
        range: ContractReference
        required: true
        inlined: true
      sessionFingerprint:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      status:
        range: string
        required: true
      expiresAt:
        range: datetime
        required: true
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  RoutingDecision:
    description: Immutable policy-authorized adapter and cell selection for one recognized turn.
    attributes:
      id:
        range: Identifier
        required: true
      ownerRealm:
        range: Identifier
        required: true
      conversationTurnRef:
        range: Identifier
        required: true
      executionCellRef:
        range: ContractReference
        required: true
        inlined: true
      adapter:
        range: ModelAccessAdapter
        required: true
      policyRevision:
        range: string
        required: true
      reasonCode:
        range: string
        required: true
      inputSha256:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      evaluatedAt:
        range: datetime
        required: true
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  WorkerInvocation:
    description: Ephemeral recognized binding of a turn, route, cell, grant and execution evidence.
    attributes:
      id:
        range: Identifier
        required: true
      ownerRealm:
        range: Identifier
        required: true
      routingDecisionRef:
        range: Identifier
        required: true
      executionCellRef:
        range: ContractReference
        required: true
        inlined: true
      capabilityGrantRef:
        range: Identifier
        required: true
      status:
        range: string
        required: true
      contextSha256:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      startedAt:
        range: datetime
        required: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  EvidenceRecord:
    description: Append-only sanitized execution observation linked to one WorkerInvocation.
    attributes:
      id:
        range: Identifier
        required: true
      ownerRealm:
        range: Identifier
        required: true
      workerInvocationRef:
        range: Identifier
        required: true
      eventKind:
        range: string
        required: true
      eventSha256:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      contentSanitized:
        range: boolean
        required: true
      capturedAt:
        range: datetime
        required: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: POLICY
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  InvocationAuthorizationReceipt:
    description: Signed, single-use MCP invocation authorization (ADR-0055). Bound to exactly one invocation id, lease, Realm,
      operation, argument digest and tools digest; carries no session or renewal field and therefore cannot represent renewable
      session authority. A lease gateway without this receipt cannot contact the upstream.
    attributes:
      invocationId:
        range: Identifier
        required: true
      executionCellLeaseRef:
        range: Identifier
        required: true
      ownerRealm:
        range: Identifier
        required: true
      operationRef:
        range: CapabilityName
        required: true
      argumentDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      toolsDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      expiresAt:
        range: datetime
        required: true
      signature:
        range: string
        required: true
        pattern: ^.{16,}$
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: POLICY
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  SecretBinding:
    description: A Git-declared reference to runtime secret material. Values are deliberately not representable here.
    annotations:
      jumo.composition: REALM_ONLY
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion:
        range: string
        equals_string: jumo.dev/v1
        required: true
      kind:
        range: string
        equals_string: SecretBinding
        required: true
      metadata:
        range: Metadata
        required: true
        inlined: true
      spec:
        range: SecretBindingSpec
        required: true
        inlined: true
  SecretBindingSpec:
    description: Allowed MCP bindings, non-MCP connectors, worker substrates and WorkOrders are explicit references checked by Rego.
    attributes:
      ownerRealm:
        range: Identifier
        required: true
      lifecycle:
        range: SecretBindingLifecycle
        required: true
      runtimeRef:
        range: OpenBaoRuntimeRef
        required: true
        description: Account- or connector-scoped OpenBao KV-v2 reference resolved by the per-Realm SecretBroker; not a secret value.
      allowedMcpServerBindingRefs:
        range: ContractReference
        multivalued: true
        inlined_as_list: true
      allowedConnectorDefinitionRefs:
        range: ContractReference
        multivalued: true
        inlined_as_list: true
      allowedOperationRefs:
        range: Identifier
        multivalued: true
      allowedWorkerSubstrateRefs:
        range: ContractReference
        multivalued: true
        inlined_as_list: true
      allowedWorkOrderRefs:
        range: ContractReference
        multivalued: true
        inlined_as_list: true
        description: WorkOrders authorized to request a delegated lease grant of this binding.
          Reciprocity with WorkOrderSpec.secretBindingRefs is required by policy
          (openbao-delegated-lease AC2).
      injection:
        range: SecretInjection
        required: true
        inlined: true
      rotation:
        range: SecretRotation
        inlined: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  SecretInjection:
    attributes:
      target:
        range: SecretInjectionTarget
        required: true
      environmentVariable:
        range: string
        pattern: ^[A-Z][A-Z0-9_]{1,127}$
      fileName:
        range: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: SECRET
      jumo.boundary_eligible: false
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  SecretRotation:
    attributes:
      required:
        range: boolean
      maximumAge:
        range: Duration
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: SECRET
      jumo.boundary_eligible: false
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  FederatedPeer:
    description: Desired bilateral Jumo peer configuration. Unavailable until recognized pairing evidence confirms both sides.
    annotations:
      jumo.composition: ADDITIVE
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion:
        range: string
        equals_string: jumo.dev/v1
        required: true
      kind:
        range: string
        equals_string: FederatedPeer
        required: true
      metadata:
        range: Metadata
        required: true
        inlined: true
      spec:
        range: FederatedPeerSpec
        required: true
        inlined: true
  FederatedPeerSpec:
    attributes:
      ownerRealm:
        range: Identifier
        required: true
      peerRealm:
        range: Identifier
        required: true
      endpoint:
        range: string
        required: true
        pattern: ^https://
      transport:
        range: string
        equals_string: HTTP_CLOUDEVENTS
        required: true
      mtls:
        range: FederatedPeerMtls
        required: true
        inlined: true
      signing:
        range: FederatedPeerSigning
        required: true
        inlined: true
      federationProfileRefs:
        range: ContractReference
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  FederatedPeerMtls:
    attributes:
      peerCertificateSha256:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      nextCertificateSha256:
        range: string
        pattern: ^sha256:[0-9a-f]{64}$
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  FederatedPeerSigning:
    attributes:
      peerKeyId:
        range: string
        required: true
        pattern: ^.{3,}$
      peerPublicKeySha256:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  FederationProfile:
    description: A negotiated, namespaced protocol profile. Describes messages only and cannot grant authority.
    annotations:
      jumo.composition: ADDITIVE
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: PERSONAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion:
        range: string
        equals_string: jumo.dev/v1
        required: true
      kind:
        range: string
        equals_string: FederationProfile
        required: true
      metadata:
        range: Metadata
        required: true
        inlined: true
      spec:
        range: FederationProfileSpec
        required: true
        inlined: true
  FederationProfileSpec:
    attributes:
      ownerRealm:
        range: Identifier
        required: true
      namespace:
        range: string
        required: true
        pattern: ^[a-z][a-z0-9.-]{2,63}$
      version:
        range: string
        required: true
        pattern: ^\d+\.\d+\.\d+$
      handlerModuleRef:
        range: Identifier
      messages:
        range: FederationMessage
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: PERSONAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  FederationMessage:
    attributes:
      type:
        range: string
        required: true
        pattern: ^[A-Za-z][A-Za-z0-9.:-]+$
      direction:
        range: FederationMessageDirection
        required: true
      schemaRef:
        range: string
        required: true
        pattern: ^.{3,}$
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ProviderAccount:
    description: One model or CLI account and the window its quota renews in. ResourceBudget bounds a single Episode; this
      bounds the account across Episodes (ADR-0013).
    annotations:
      jumo.composition: REALM_ONLY
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: PERSONAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion:
        range: string
        equals_string: jumo.dev/v1
        required: true
      kind:
        range: string
        equals_string: ProviderAccount
        required: true
      metadata:
        range: Metadata
        required: true
        inlined: true
      spec:
        range: ProviderAccountSpec
        required: true
        inlined: true
  ProviderAccountSpec:
    attributes:
      provider:
        range: string
        required: true
        pattern: ^.{2,}$
        description: Vendor and access path, such as anthropic-cli or openai-api. Two accounts on the same vendor are not
          independent of each other.
      routing:
        range: ProviderRouting
        required: true
        inlined: true
      secretBindingRef:
        range: ContractReference
        inlined: true
        description: The sole OpenBao binding that may hold this named account's credential; the value is never contractual state.
      quotaWindow:
        range: ProviderQuotaWindow
        required: true
        inlined: true
      observationProvenance:
        range: ProviderObservationProvenance
        required: true
      onExhaustion:
        range: ProviderOnExhaustion
        required: true
      independenceGroup:
        range: Identifier
        description: Accounts sharing a group are not independent. Falling back within the same group would let one account
          both produce and verify (docs/concepts/positionnement-conceptuel.md#diversite-des-pannes) -- a declared separation,
          not a proof of independence; a fault-diversity vector (provider, model, prompt, sources, tools, framing) would be
          the finer-grained signal, not yet modeled as its own field. Inherited from the referenced ProviderPlatform's
          independenceGroup when absent.
      entitlement:
        range: ProviderEntitlement
        required: true
        inlined: true
      alternativeProviderAccountRefs:
        range: ContractReference
        multivalued: true
        inlined_as_list: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: PERSONAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ProviderRouting:
    attributes:
      priority:
        range: integer
        minimum_value: 1
        description: Deterministic account selection order for a compatible worker requirement profile. Lower values are selected first.
      mode:
        range: AccessMode
        required: true
      gatewayRef:
        range: ConfigurationRef
        description: Required when mode is GATEWAY_ROUTED; forbidden when PLAN_DIRECT (Rego).
      platformRef:
        range: ContractReference
        inlined: true
        description: The ProviderPlatform catalog entry this account was opened against. Required when mode is
          GATEWAY_ROUTED; forbidden when PLAN_DIRECT, which has no upstream provider-egress traffic (Rego).
      upstreamHost:
        range: string
        description: Required exactly when the referenced ProviderPlatform declares hostDeclaredByAccount true
          (a generic platform such as an OpenAI-compatible aggregator); forbidden otherwise (Rego).
      effortLadder:
        range: EffortRungSpec
        multivalued: true
        inlined_as_list: true
        description: Overrides the platform's defaultEffortLadder rung for rung when declared. Absent by default,
          so a newly declared account inherits the platform's ladder and is routable immediately -- the fix for
          the N-times-M dead account problem a per-account requirementAliases list produced.
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ProviderPlatform:
    description: The declared catalog entry a ProviderAccount is opened against -- wire protocol, upstream host,
      credential header style, egress route, and the default effort ladder new accounts inherit. Adding an
      aggregator or OpenAI-compatible endpoint is a contract change against this catalog and a provider-egress
      regeneration, never a value typed directly into a ProviderAccount (ADR-0002 -- the worker cannot select a
      host).
    annotations:
      jumo.composition: ADDITIVE
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion:
        range: string
        equals_string: jumo.dev/v1
        required: true
      kind:
        range: string
        equals_string: ProviderPlatform
        required: true
      metadata:
        range: Metadata
        required: true
        inlined: true
      spec:
        range: ProviderPlatformSpec
        required: true
        inlined: true
  ProviderPlatformSpec:
    attributes:
      wireProtocol:
        range: WireProtocol
        required: true
      egressRouteId:
        range: Identifier
        required: true
        pattern: ^[a-z][a-z0-9-]{0,30}$
        description: Names the generated provider-egress nginx location this platform's traffic proxies through.
          Never a raw URL; the worker builds only /{egressRouteId}/... and cannot select an upstream itself.
      upstreamHost:
        range: string
        description: Fixed TLS upstream for an integrated platform. Forbidden when hostDeclaredByAccount is true
          (Rego); a generic platform's host is named per-account instead.
      completionPath:
        range: string
        required: true
      modelCatalogPath:
        range: string
        required: true
      credentialHeader:
        range: CredentialHeaderStyle
        required: true
      independenceGroup:
        range: Identifier
        required: true
        description: Default independenceGroup for an account opened against this platform when the account
          does not declare its own.
      hostDeclaredByAccount:
        range: boolean
        required: true
        description: True only for a generic platform (e.g. an OpenAI-compatible aggregator such as OpenRouter)
          whose upstream host is named per-account instead of fixed by this catalog entry.
      defaultEffortLadder:
        range: EffortRungSpec
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
        description: The rung-by-rung ladder every account opened against this platform inherits unless it
          declares its own ProviderRouting.effortLadder.
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  EffortRungSpec:
    attributes:
      rung:
        range: ReasoningEffort
        required: true
        description: Matches a WorkerRequirementProfile.spec.quality.reasoningEffort value one for one; the
          resolver picks the account's rung with the same name instead of a per-profile alias.
      modelAlias:
        range: Identifier
        required: true
      nativeEffort:
        range: ProviderNativeEffort
        inlined: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ProviderNativeEffort:
    description: Provider-native reasoning-effort parameters, applied verbatim by RequestShape for the rung's
      protocol -- OpenAI reasoning_effort, Anthropic thinking budget and max_tokens, Google thinkingConfig.
    attributes:
      reasoningEffort:
        range: string
        description: Provider-native effort token passed through verbatim (e.g. OpenAI's 'medium' or 'high').
      maxOutputTokens:
        range: integer
        minimum_value: 1
      thinkingBudgetTokens:
        range: integer
        minimum_value: 1
        description: Native thinking-token budget for a protocol that exposes one (Anthropic extended thinking,
          Google thinkingConfig).
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ProviderQuotaWindow:
    attributes:
      kind:
        range: ProviderQuotaWindowKind
        required: true
      duration:
        range: Duration
        description: Required when kind is ROLLING or CALENDAR; forbidden when METERED (Rego).
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
      jumo.composition: ADDITIVE
  ProviderEntitlement:
    attributes:
      holder:
        range: EntitlementHolder
        required: true
      holderRef:
        range: string
        required: true
        pattern: ^.{2,}$
      usePermissions:
        range: EntitlementUsePermissions
        required: true
        inlined: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  EntitlementUsePermissions:
    attributes:
      holderOperated:
        range: EntitlementUseContext
        required: true
        inlined: true
      jumoManaged:
        range: EntitlementUseContext
        required: true
        inlined: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  EntitlementUseContext:
    attributes:
      verdict:
        range: EntitlementVerdict
        required: true
      termsReview:
        range: TermsReview
        required: true
        inlined: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  TermsReview:
    attributes:
      sourceRef:
        range: string
        required: true
        pattern: ^.{3,}$
      reviewedAt:
        range: date
        required: true
      validUntil:
        range: date
        required: true
        description: The review's validity deadline; the window between reviewedAt and validUntil may not exceed 90 days (Rego).
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  WorkerSubstrate:
    description: 'Realm-owned declaration of a constrained worker runtime. A Git-reviewed security boundary: native CLI homes,
      repository mounts, database reach, open egress, container runtime sockets and built-in connector authority are absent
      so Jumo policy remains the only authority path.'
    annotations:
      jumo.composition: ADDITIVE
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion:
        range: string
        equals_string: jumo.dev/v1
        required: true
      kind:
        range: string
        equals_string: WorkerSubstrate
        required: true
      metadata:
        range: Metadata
        required: true
        inlined: true
      spec:
        range: WorkerSubstrateSpec
        required: true
        inlined: true
  WorkerSubstrateSpec:
    attributes:
      ownerRealm:
        range: Identifier
        required: true
      executionMachineRef:
        range: ContractReference
        inlined: true
        description: Durable execution machine selected for this CLI substrate; an ExecutionCellLease remains invocation-scoped.
      lifecycle:
        range: ConnectorLifecycle
        required: true
      substrate:
        range: WorkerSubstrateKind
        required: true
      cli:
        range: WorkerCli
      image:
        range: WorkerImage
        required: true
        inlined: true
      isolation:
        range: WorkerIsolation
        required: true
        inlined: true
      homeState:
        range: string
        equals_string: ISOLATED_PER_INVOCATION
        required: true
        description: A mounted CLI home carries native connectors, consent history and trusted folders; isolated per-invocation
          state removes that duplicated authority.
      modelAccess:
        range: WorkerModelAccess
        required: true
        inlined: true
      grantedOperationRefs:
        range: WorkerGrantedOperation
        multivalued: true
        inlined_as_list: true
        required: true
        description: The only external reach available to the substrate.
      nativeToolAuthority:
        range: string
        equals_string: DISABLED
        required: true
        description: CLI-native connectors and MCP servers are disabled so the fact is reviewable rather than hidden in an
          image. Unaffected by AGENTS.md's development-agent MCP directives -- those govern a human's own terminal
          session, not a dispatched worker.
      ambientToolAuthority:
        range: string
        equals_string: DISABLED
        required: true
        description: No CLI home, image, plugin, repository file, or provider default silently grants tool access.
      projectedToolAuthority:
        range: string
        equals_string: GRANT_ONLY
        required: true
        description: Tool capabilities are dynamically projected by the Jumo capability gateway via an invocation-scoped Streamable
          HTTP MCP endpoint based on explicit InvocationCapabilityGrants.
      usageContext:
        range: WorkerUsageContext
        required: true
        description: Licensing and entitlement fact only. Not a security boundary and not a sphere.
      accountUse:
        range: WorkerAccountUse
        required: true
        description: Which ProviderAccount use context this substrate is authorized to consume, explicit so a declared substrate
          never silently upgrades from holder-operated to Jumo-managed use.
      providedExecutionToolchainRefs:
        range: ContractReference
        multivalued: true
        inlined_as_list: true
        description: Non-AI build or language-tool environments this substrate's image provides
          (execution-toolchain-contract-foundations). Absent by default -- a CLI-only substrate
          provides none. Each must resolve to a same-Realm ExecutionToolchain.
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  WorkerImage:
    attributes:
      reference:
        range: string
        required: true
        pattern: ^.{3,}$
      digest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
        description: A tag is a moving target; evidence names the bytes that ran.
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  WorkerIsolation:
    attributes:
      network:
        range: WorkerNetworkIsolation
        required: true
        description: Open egress is absent because it would let a CLI re-acquire authority outside Jumo's grant.
      rootFilesystem:
        range: string
        equals_string: READ_ONLY
        required: true
      linuxCapabilities:
        range: string
        equals_string: DROP_ALL
        required: true
      privilegeEscalation:
        range: string
        equals_string: DENIED
        required: true
      containerRuntimeSocket:
        range: string
        equals_string: ABSENT
        required: true
        description: A runtime socket mount hands the container authority over its own sandbox.
      workspace:
        range: WorkerWorkspaceMode
        required: true
      limits:
        range: WorkerIsolationLimits
        required: true
        inlined: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  WorkerIsolationLimits:
    attributes:
      memory:
        range: string
        required: true
        pattern: ^[1-9][0-9]*(Mi|Gi)$
      cpus:
        range: float
        required: true
      pids:
        range: integer
        required: true
        minimum_value: 1
        maximum_value: 1024
      wallClock:
        range: Duration
        required: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  WorkerModelAccess:
    attributes:
      mode:
        range: AccessMode
        required: true
      providerAccountRef:
        range: ContractReference
        required: true
        inlined: true
      credentialSource:
        range: CredentialSource
        required: true
        description: MODEL_WORKER_PROCESS may consume only an OpenBao-rendered file bound to this substrate; no environment
          value, repository mount, or ambient credential is permitted.
      gatewayRef:
        range: ConfigurationRef
      secretBindingRef:
        range: ContractReference
        inlined: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  WorkerGrantedOperation:
    attributes:
      connectorDefinitionRef:
        range: ContractReference
        required: true
        inlined: true
      operationRef:
        range: Identifier
        required: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpProtocolProfile:
    description: Supported MCP protocol capabilities and versions.
    attributes:
      protocolVersion:
        range: string
        required: true
      supportedTransports:
        range: string
        multivalued: true
      capabilities:
        range: string
        multivalued: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: PERSONAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpToolDescriptor:
    description: Tool schema and metadata captured during MCP discovery.
    attributes:
      name:
        range: string
        required: true
      description:
        range: string
      inputSchema:
        range: SchemaBoundPayload
        inlined: true
      outputSchema:
        range: SchemaBoundPayload
        inlined: true
      annotations:
        range: string
        multivalued: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpInventorySnapshot:
    description: PostgreSQL event recording an MCP inventory discovered under an exact Realm lease; it is not a Git contract.
    attributes:
      serverId:
        range: string
        required: true
      ownerRealm:
        range: Identifier
      workOrderRef:
        range: ContractReference
        inlined: true
      executionCellLeaseRef:
        range: Identifier
      executionMachineRef:
        range: ContractReference
        inlined: true
      contractRevision:
        range: string
      artifactOrEndpoint:
        range: string
      serverName:
        range: string
      serverVersion:
        range: string
      protocolVersion:
        range: string
      capabilities:
        range: string
        multivalued: true
      tools:
        range: McpToolDescriptor
        multivalued: true
        inlined: true
      inventoryDigest:
        range: string
        required: true
      discoveredAt:
        range: string
        required: true
      pagesObserved:
        range: integer
      bytesObserved:
        range: integer
      networkIsolationMode:
        range: string
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: EVENT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  PlannedOperation:
    description: One operation exposed by a signed MCP gateway session plan, resolved from a validated
      InvocationCapabilityGrant (mcp-gateway-session-plan-signing AC2). Mirrors
      dev.jumo.mcpgateway.plan.PlannedOperation on the gateway side.
    attributes:
      grantId:
        range: Identifier
        required: true
      exposedName:
        range: string
        required: true
      upstreamToolName:
        range: string
        required: true
      description:
        range: string
      inputSchema:
        range: string
        required: true
      outputSchema:
        range: string
      producesExternalEffect:
        range: boolean
        required: true
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: VALUE_OBJECT
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  PlannedResource:
    description: One resource or resource template exposed by a signed MCP gateway session plan,
      resolved from an appraised, enabled McpServerBinding's recipe without any
      InvocationCapabilityGrant (ADR-0063 decision 9's asymmetry -- tools need a per-call grant,
      resources need only to be appraised and bounded; generic-mcp-full-protocol AC1, 2026-09-01
      owner ruling). Mirrors dev.jumo.mcpgateway.plan.PlannedResource on the gateway side. Size,
      pagination and subscription bounds are enforced by the resources protocol methods this
      order's own AC1 has not yet built, not by a per-resource field here.
    attributes:
      exposedName:
        range: string
        required: true
      upstreamUri:
        range: string
        required: true
      description:
        range: string
      isTemplate:
        range: boolean
        required: true
      allowedMimeTypes:
        range: string
        multivalued: true
      resourceUriPatterns:
        range: string
        multivalued: true
      staticContentDigest:
        range: string
        pattern: '^sha256:[0-9a-f]{64}$'
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: VALUE_OBJECT
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  PlannedPrompt:
    description: One static prompt exposed by a signed MCP gateway session plan, resolved from an
      appraised, enabled McpServerBinding's recipe without any InvocationCapabilityGrant -- the
      same asymmetry PlannedResource documents (ADR-0063 decision 9 -- a prompt needs only to be
      appraised and bounded, not a per-call grant; generic-mcp-full-protocol AC2). Mirrors
      dev.jumo.mcpgateway.plan.PlannedPrompt on the gateway side. taskInstructionsAllowed is
      copied from the McpPrimitiveExposure that produced this entry; only a prompt whose
      staticContentDigest is both declared and verified against the fetched content may ever form
      bounded task instructions -- that consuming half (MCP Tasks, create/read/notify/cancel) is
      not built by this order's own AC2 pass, since the pinned MCP SDK carries no Task primitive
      support at all (verified -- no io.modelcontextprotocol.spec.McpSchema$Task* class exists in
      mcp-core 2.0.1, the latest published SDK version).
    attributes:
      exposedName:
        range: string
        required: true
      upstreamName:
        range: string
        required: true
      description:
        range: string
      staticContentDigest:
        range: string
        pattern: '^sha256:[0-9a-f]{64}$'
      taskInstructionsAllowed:
        range: boolean
        required: true
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: VALUE_OBJECT
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  PlannedSampling:
    description: One SAMPLING exposure's bounds carried in a signed MCP gateway session plan --
      opt-in per ADR-0063 decision 9 -- a plan with zero PlannedSampling entries refuses every
      sampling/createMessage request outright, a plan with one bounds every request against it
      (allowedModels, maxCalls, maxTokens, allowedDataClasses, maxCostEur -- resolved eagerly from
      the exposure's resourceBudgetRef at plan-issuance time, not carried as a live reference, the
      same way staticContentDigest resolves eagerly rather than pointing at a live document).
      Mirrors dev.jumo.mcpgateway.plan.PlannedSampling on the gateway side. Like resources and
      prompts, sampling carries no InvocationCapabilityGrant -- there is no per-call receipt to
      authorize or consume, only a post-callback audit record (generic-mcp-full-protocol AC3).
    attributes:
      exposedName:
        range: string
        required: true
      allowedModels:
        range: string
        multivalued: true
      maxCalls:
        range: integer
      maxTokens:
        range: integer
      allowedDataClasses:
        range: string
        multivalued: true
      maxCostEur:
        range: float
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: VALUE_OBJECT
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  PlannedElicitation:
    description: One ELICITATION exposure's bounds carried in a signed MCP gateway session plan --
      opt-in per ADR-0063 decision 9, mirroring PlannedSampling's own asymmetry -- a plan with zero
      PlannedElicitation entries refuses every elicitation/create request outright, a plan with one
      bounds every request against it (elicitationSensitiveAllowed, allowedOrigins, both carried
      verbatim from the declared McpPrimitiveExposure rather than resolved eagerly, since neither
      names a live reference the way resourceBudgetRef or staticContentDigest do). Mirrors
      dev.jumo.mcpgateway.plan.PlannedElicitation on the gateway side. Like resources, prompts and
      sampling, elicitation carries no InvocationCapabilityGrant -- there is no per-call receipt to
      authorize or consume (generic-mcp-full-protocol AC4).
    attributes:
      exposedName:
        range: string
        required: true
      elicitationSensitiveAllowed:
        range: boolean
      allowedOrigins:
        range: string
        multivalued: true
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: VALUE_OBJECT
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  SessionPlanRequest:
    description: Request to issue a signed MCP gateway session plan for one ExecutionCellLease
      (mcp-gateway-session-plan-signing AC2).
    attributes:
      leaseId:
        range: Identifier
        required: true
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: COMMAND
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  SessionPlan:
    description: Signed MCP gateway session plan scoped to one ExecutionCellLease. It is the only
      executable MCP form and carries every exact contract and supply digest used by the gateway.
    attributes:
      planId:
        range: Identifier
        required: true
      realmId:
        range: Identifier
        required: true
      leaseId:
        range: Identifier
        required: true
      contractSetDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      recipeDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      bindingDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      appraisalDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      supplyDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      negotiatedVersion:
        range: string
        required: true
      negotiatedTransport:
        range: McpTransportType
        required: true
      upstreamToolsDigest:
        description: Digest of the complete discovered tool inventory of the one upstream connector
          accepted for this plan, using mcp-tools-jcs-v1. Signed with the plan so a gateway can
          refuse a later upstream inventory change before dispatch.
        range: string
        required: true
      operations:
        range: PlannedOperation
        multivalued: true
        inlined_as_list: true
      resources:
        range: PlannedResource
        multivalued: true
        inlined_as_list: true
      prompts:
        range: PlannedPrompt
        multivalued: true
        inlined_as_list: true
      sampling:
        range: PlannedSampling
        multivalued: true
        inlined_as_list: true
      elicitation:
        range: PlannedElicitation
        multivalued: true
        inlined_as_list: true
      planExpiresAt:
        range: string
        required: true
      signingKeyName:
        range: string
        required: true
      planSignature:
        range: string
        required: true
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: COMMAND
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpInvocationAuthorizationRequest:
    description: Machine-authenticated request to authorize one planned MCP operation without persisting arguments.
    attributes:
      invocationId:
        range: Identifier
        required: true
      grantId:
        range: Identifier
        required: true
      leaseId:
        range: Identifier
        required: true
      contractSetDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      operationName:
        range: string
        required: true
      argumentsDigest:
        range: string
        required: true
      argumentsSize:
        range: integer
        required: true
      schemaDigest:
        range: string
        required: true
      policyRevision:
        range: string
        required: true
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: COMMAND
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpInvocationAuthorizationReceipt:
    description: Signed, short-lived authorization receipt bound to exactly one MCP invocation.
    attributes:
      invocationId:
        range: Identifier
        required: true
      grantId:
        range: Identifier
        required: true
      leaseId:
        range: Identifier
        required: true
      contractSetDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      operationName:
        range: string
        required: true
      argumentsDigest:
        range: string
        required: true
      schemaDigest:
        range: string
        required: true
      expiresAt:
        range: string
        required: true
      signingKeyName:
        range: string
        required: true
      signature:
        range: string
        required: true
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: VALUE_OBJECT
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpInvocationDispatchRequest:
    description: Machine acknowledgement that a signed MCP invocation receipt is about to dispatch upstream.
    attributes:
      receipt:
        range: McpInvocationAuthorizationReceipt
        required: true
        inlined: true
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: COMMAND
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpInvocationOutcome:
    description: Sanitized terminal outcome for one dispatched MCP invocation.
    attributes:
      invocationId:
        range: Identifier
        required: true
      leaseId:
        range: Identifier
        required: true
      contractSetDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      outcome:
        range: McpInvocationOutcomeType
        required: true
      resultDigest:
        range: string
      resultSize:
        range: integer
      reasonCode:
        range: string
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: EVENT
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpResourceReadAudit:
    description: Sanitized audit record for one MCP resource read that reached the upstream fetch attempt. Unlike
      McpInvocationOutcome, carries no grantId -- a resource read has no InvocationCapabilityGrant to reference
      (ADR-0063 decision 9's asymmetry -- a resource needs only to be appraised and bounded, not a per-call grant),
      so there is no receipt to authorize or consume beforehand; this is a single post-attempt record, not a
      three-step authorize/dispatch/outcome ledger (generic-mcp-full-protocol AC1). A read the plan itself refuses
      before ever reaching upstream produces no record here, mirroring how a PEP-refused tool call never reaches
      McpInvocationAuthorizationRequest either.
    attributes:
      invocationId:
        range: Identifier
        required: true
      leaseId:
        range: Identifier
        required: true
      contractSetDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      resourceUri:
        range: string
        required: true
      outcome:
        range: McpInvocationOutcomeType
        required: true
      contentDigest:
        range: string
      contentSize:
        range: integer
      reasonCode:
        range: string
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: EVENT
      jumo.audience: MACHINE_MTLS
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ImportedSchemaCandidate:
    description: Candidate LinkML class proposal derived from an external MCP tool schema.
    attributes:
      candidateId:
        range: string
        required: true
      externalSchemaDigest:
        range: string
        required: true
      proposedLinkmlClass:
        range: string
        required: true
      transformationStrategy:
        range: string
        required: true
      justification:
        range: string
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ConnectorCredentialRequirement:
    description: Declared credential requirements and delivery mode for a connector.
    attributes:
      credentialType:
        range: string
        required: true
      subject:
        range: string
        required: true
      requiredScopes:
        range: string
        multivalued: true
      deliveryMode:
        range: string
        required: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  OAuthClientBinding:
    description: Durable Git contract binding an OAuth client registration to a Realm.
    attributes:
      apiVersion:
        range: string
        equals_string: jumo.dev/v1
        required: true
      kind:
        range: string
        equals_string: OAuthClientBinding
        required: true
      metadata:
        range: Metadata
        required: true
        inlined: true
      spec:
        range: OAuthClientBindingSpec
        required: true
        inlined: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
      jumo.composition: ADDITIVE
  OAuthClientBindingSpec:
    description: Specification for an OAuthClientBinding contract.
    attributes:
      ownerRealm:
        range: Identifier
        required: true
      ownership:
        range: string
        required: true
      clientId:
        range: string
        required: true
      authEndpoint:
        range: string
        required: true
      tokenEndpoint:
        range: string
        required: true
      vaultSecretPath:
        range: string
        required: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ConnectorSessionBinding:
    description: Active OAuth or API session binding for a Principal/Realm and target machine.
    attributes:
      sessionId:
        range: Identifier
        required: true
      connectorRef:
        range: ContractReference
        required: true
        inlined: true
      principalRef:
        range: ContractReference
        inlined: true
      realmRef:
        range: string
        required: true
      machineRef:
        range: ContractReference
        inlined: true
      secretBindingRef:
        range: ContractReference
        inlined: true
      grantedScopes:
        range: string
        multivalued: true
      status:
        range: string
        required: true
      expiresAt:
        range: string
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ConnectorTestCase:
    description: A single test case in a connector verification plan.
    attributes:
      testCaseId:
        range: string
        required: true
      operationId:
        range: string
        required: true
      effectClass:
        range: string
        required: true
      inputPayload:
        range: SchemaBoundPayload
        inlined: true
      expectedOutputDigest:
        range: string
      rollbackPayload:
        range: SchemaBoundPayload
        inlined: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ConnectorTestPlan:
    description: Deterministic test plan for verifying connector operations on a target machine.
    attributes:
      planId:
        range: Identifier
        required: true
      connectorRef:
        range: ContractReference
        required: true
        inlined: true
      targetMachineRef:
        range: ContractReference
        inlined: true
      testCases:
        range: ConnectorTestCase
        multivalued: true
        inlined: true
      planDigest:
        range: string
        required: true
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ConnectorTestResult:
    description: Observed result and evidence of a connector test case execution.
    attributes:
      planId:
        range: Identifier
        required: true
      testCaseId:
        range: string
        required: true
      status:
        range: string
        required: true
      actualOutputDigest:
        range: string
      executionTimeMs:
        range: integer
      sanitizedEvidence:
        range: string
      executedAt:
        range: string
        required: true
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: EVENT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  EffectTestAuthorization:
    description: Dual-consent authorization record for executing irreversible effect tests.
    attributes:
      authorizationId:
        range: Identifier
        required: true
      planDigest:
        range: string
        required: true
      inputDigest:
        range: string
        required: true
      targetDigest:
        range: string
        required: true
      approverPrincipalRefs:
        range: ContractReference
        multivalued: true
        inlined_as_list: true
      authorizedAt:
        range: string
        required: true
      expiresAt:
        range: string
        required: true
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ActionRun:
    description: A resumable, catalog-pinned unit composing typed connector reads, owner
      selections and an owner-approved EffectBatch (connector-action-runs-and-effect-batches AC1,
      generalizing the single NestorTurnProposal.ActionCandidate and effect_proposal row).
    attributes:
      runId:
        range: Identifier
        required: true
      realmId:
        range: Identifier
        required: true
      conversationId:
        range: Identifier
      turnId:
        range: Identifier
      actionCatalogRevision:
        range: string
        required: true
        description: The ActionCatalog.contractRevision this run is pinned to. An ActionStep
          proposed against any other revision is refused as stale.
      status:
        range: ActionRunStatus
        required: true
      createdAt:
        range: string
        required: true
      updatedAt:
        range: string
        required: true
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: COMMAND
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ActionStep:
    description: A single typed action within an ActionRun -- a connector read, an owner
      selection, or the step that opens an EffectBatch. Pins the exact catalog operation and input
      schema its arguments were validated against; never carries an upstream MCP primitive name
      (McpPrimitiveExposure.upstreamName never leaves its recipe, ADR-0019 and ADR-0063).
    attributes:
      stepId:
        range: Identifier
        required: true
      runId:
        range: Identifier
        required: true
      stepIndex:
        range: integer
        required: true
      connectorId:
        range: Identifier
        required: true
      operationRef:
        range: string
        required: true
        description: The ActionCatalogItem.actionId this step invokes -- the connector's own
          semantic operation id, never a raw upstream tool name.
      operationSchemaRef:
        range: string
        required: true
        description: The ConnectorOperation.inputSchemaRef this step's arguments were validated
          against; PackageOperationSchemaResolver verifies schema $id-equality before it is trusted.
      argumentsJson:
        range: string
        required: true
      argumentsDigest:
        range: string
        required: true
      status:
        range: ActionStepStatus
        required: true
      resultJson:
        range: string
        description: Transit-encrypted ciphertext of a read-only step's result (connector-action-runs-and-effect-batches
          AC2's "sensitive read results" half). Absent for a step that opened an EffectBatch instead --
          that step's own outcome is a digest only, same discipline as EffectBatchLine.resultDigest.
      resultDigest:
        range: string
        description: Digest of resultJson's plaintext, computed before encryption so it stays a stable
          fingerprint regardless of Transit's own per-call nonce.
      createdAt:
        range: string
        required: true
      updatedAt:
        range: string
        required: true
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: COMMAND
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  EffectBatchLine:
    description: One typed, schema-pinned external-effect line inside an EffectBatch's canonical
      display projection. Never carries an upstream MCP tool name, same discipline as ActionStep.
    attributes:
      lineIndex:
        range: integer
        required: true
      connectorId:
        range: Identifier
        required: true
      operationRef:
        range: string
        required: true
      operationSchemaRef:
        range: string
        required: true
      argumentsJson:
        range: string
        required: true
      argumentsDigest:
        range: string
        required: true
      idempotencyKey:
        range: string
        required: true
      reconciliation:
        range: OperationReconciliation
        required: true
      status:
        range: EffectBatchLineStatus
        required: true
      resultDigest:
        range: string
    annotations:
      jumo.state_authority: NONE
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  EffectBatch:
    description: The approval and recovery unit for owner-approved external-effect lines opened by
      an ActionStep (connector-action-runs-and-effect-batches). AC1 covers only its typed,
      recognized-state shape; the trusted reconciled applier that dispatches its lines is AC3, and
      stays blocked on CapabilityGatewayService's applier-reconciliation refusal until that
      applier exists.
    attributes:
      batchId:
        range: Identifier
        required: true
      runId:
        range: Identifier
        required: true
      stepId:
        range: Identifier
        required: true
      actionCatalogRevision:
        range: string
        required: true
      lines:
        range: EffectBatchLine
        required: true
        multivalued: true
        inlined_as_list: true
      linesDigest:
        range: string
        required: true
        description: Digest of the complete canonical lines projection. One owner approval binds
          to this exact digest and to nothing else (AC3).
      status:
        range: EffectBatchStatus
        required: true
      approverRef:
        range: ContractReference
        inlined: true
      approvedAt:
        range: string
      createdAt:
        range: string
        required: true
      updatedAt:
        range: string
        required: true
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: COMMAND
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  MonetaryReservation:
    description: Postgres-only recognized reservation of capacity against one MonetaryRiskPolicy's
      declared window for one EffectBatch (action-run-monetary-risk-enforcement AC1) -- never
      authored in Git, unlike MonetaryRiskPolicy itself, which declares limits only. windowStart
      and windowEnd are fixed, epoch-aligned bucket boundaries derived from the policy's declared
      window Duration, not a rolling window -- two reservations minutes apart can land in
      different windows if a bucket edge falls between them.
    attributes:
      reservationId:
        range: Identifier
        required: true
      realmId:
        range: Identifier
        required: true
      batchId:
        range: Identifier
        required: true
      policyId:
        range: Identifier
        required: true
      policyRevision:
        range: string
        required: true
        description: The ContractLoader revision the MonetaryRiskPolicy was resolved at when this
          reservation was made. AC2 refuses approval if a fresh resolution no longer agrees.
      currency:
        range: string
        required: true
        pattern: '^[A-Z]{3}$'
      amount:
        range: float
        required: true
        minimum_value: 0
      windowStart:
        range: string
        required: true
      windowEnd:
        range: string
        required: true
      payloadDigest:
        range: string
        required: true
      status:
        range: MonetaryReservationStatus
        required: true
      reasonCode:
        range: string
        description: Set when status becomes RELEASED without ever reaching CONSUMED (e.g. a
          verified dispatch failure). Never set for a RESERVED or CONSUMED reservation.
      createdAt:
        range: string
        required: true
      updatedAt:
        range: string
        required: true
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: COMMAND
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  ConnectorActivationDecision:
    description: Owner approval and activation decision activating a connector package.
    attributes:
      connectorRef:
        range: ContractReference
        required: true
        inlined: true
      decision:
        range: string
        required: true
      appraiserRef:
        range: ContractReference
        required: true
        inlined: true
      ownerApproverRef:
        range: ContractReference
        required: true
        inlined: true
      appraisalDigest:
        range: string
        required: true
      inventoryDigest:
        range: string
        required: true
      decidedAt:
        range: string
        required: true
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  MonetaryRiskPolicy:
    description: Realm-scoped monetary limits for declared external operations. The contract declares limits only; recognized reservations and reconciled consumption remain outside Git.
    annotations:
      jumo.composition: REALM_ONLY
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion: {range: string, equals_string: jumo.dev/v1, required: true}
      kind: {range: string, equals_string: MonetaryRiskPolicy, required: true}
      metadata: {range: Metadata, required: true, inlined: true}
      spec: {range: MonetaryRiskPolicySpec, required: true, inlined: true}
  MonetaryRiskPolicySpec:
    attributes:
      ownerRealm: {range: Identifier, required: true}
      scope: {range: MonetaryRiskPolicyScope, required: true}
      currency: {range: string, required: true, pattern: '^[A-Z]{3}$'}
      window: {range: Duration, required: true}
      perEffectLimit: {range: float, required: true, minimum_value: 0}
      cumulativeLimit: {range: float, required: true, minimum_value: 0}
      lifecycle: {range: MonetaryRiskPolicyLifecycle, required: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  KnowledgeCorpus:
    description: Realm-owned, grant-governed set of retrievable sources. Its index is derived recognized state and grants no authority.
    annotations:
      jumo.composition: REALM_ONLY
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion: {range: string, equals_string: jumo.dev/v1, required: true}
      kind: {range: string, equals_string: KnowledgeCorpus, required: true}
      metadata: {range: Metadata, required: true, inlined: true}
      spec: {range: KnowledgeCorpusSpec, required: true, inlined: true}
  KnowledgeCorpusSpec:
    attributes:
      ownerRealm: {range: Identifier, required: true}
      scope: {range: KnowledgeCorpusScope, required: true}
      projectRef: {range: ContractReference, inlined: true}
      dataScopeCeiling: {range: DataScope, required: true}
      knowledgeSourceRefs: {range: ContractReference, multivalued: true, inlined_as_list: true, required: true, minimum_cardinality: 1}
      knowledgeIndexProfileRef: {range: ContractReference, required: true, inlined: true}
      maximumStaleness: {range: Duration, required: true}
      lifecycle: {range: KnowledgeCorpusLifecycle, required: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  KnowledgeSource:
    description: Realm-owned source binding. A connector transports a snapshot only; it never becomes retrieval authority.
    annotations:
      jumo.composition: REALM_ONLY
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion: {range: string, equals_string: jumo.dev/v1, required: true}
      kind: {range: string, equals_string: KnowledgeSource, required: true}
      metadata: {range: Metadata, required: true, inlined: true}
      spec: {range: KnowledgeSourceSpec, required: true, inlined: true}
  KnowledgeSourceSpec:
    attributes:
      ownerRealm: {range: Identifier, required: true}
      knowledgeCorpusRef: {range: ContractReference, required: true, inlined: true}
      sourceKind: {range: KnowledgeSourceKind, required: true}
      projectRef: {range: ContractReference, inlined: true}
      composedRealm: {range: Identifier}
      connectorDefinitionRef: {range: ContractReference, inlined: true}
      readOperationRefs: {range: Identifier, multivalued: true}
      roots: {range: string, multivalued: true, required: true, minimum_cardinality: 1}
      includePatterns: {range: string, multivalued: true}
      excludePatterns: {range: string, multivalued: true}
      allowedMimeTypes: {range: string, multivalued: true, required: true, minimum_cardinality: 1}
      maximumDocumentBytes: {range: integer, required: true, minimum_value: 1}
      syncMode: {range: KnowledgeSyncMode, required: true}
      reconciliationCadence: {range: Duration, required: true}
      withdrawalPolicy: {range: KnowledgeWithdrawalPolicy, required: true}
      audience: {range: DataScope, required: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  KnowledgeIndexProfile:
    description: Additive, non-authoritative local retrieval profile. It pins a model artifact and never permits runtime download or a remote embedding endpoint.
    annotations:
      jumo.composition: ADDITIVE
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion: {range: string, equals_string: jumo.dev/v1, required: true}
      kind: {range: string, equals_string: KnowledgeIndexProfile, required: true}
      metadata: {range: Metadata, required: true, inlined: true}
      spec: {range: KnowledgeIndexProfileSpec, required: true, inlined: true}
  KnowledgeIndexProfileSpec:
    attributes:
      mode: {range: KnowledgeIndexMode, required: true}
      chunkMaximumTokens: {range: integer, required: true, minimum_value: 1}
      chunkOverlapTokens: {range: integer, required: true, minimum_value: 0}
      maximumResults: {range: integer, required: true, minimum_value: 1}
      lexicalWeight: {range: float, required: true, minimum_value: 0}
      vectorWeight: {range: float, required: true, minimum_value: 0}
      # Not metamodel-required: a LEXICAL-mode profile has no embedding to pin, and inventing one
      # would fabricate a digest for a model the profile never loads. HYBRID requires it -- Rego
      # rule corpus.knowledge.index-embedding-required in knowledge-retrieval.rego, not this schema.
      embedding: {range: LocalEmbeddingArtifact, inlined: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  LocalEmbeddingArtifact:
    attributes:
      executionMode: {range: EmbeddingExecutionMode, required: true}
      modelName: {range: string, required: true}
      dimensions: {range: integer, required: true, minimum_value: 1}
      license: {range: string, required: true}
      buildUri: {range: string, required: true}
      modelDigest: {range: string, required: true, pattern: '^sha256:[a-f0-9]{64}$'}
      tokenizerDigest: {range: string, required: true, pattern: '^sha256:[a-f0-9]{64}$'}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  KnowledgeDocument:
    description: Reconstructible recognized-state projection of one source document admitted into a
      KnowledgeCorpus (knowledge-retrieval-git-vertical AC1). Content is replaced atomically by the
      sync run that observes a new sourceRevision; a purge clears content and chunks in the same
      transaction and leaves this row as a content-free tombstone.
    attributes:
      realmId: {range: Identifier, required: true}
      projectId: {range: Identifier}
      corpusId: {range: Identifier, required: true}
      sourceId: {range: Identifier, required: true}
      sourceKind: {range: KnowledgeSourceKind, required: true}
      sourceDocumentId: {range: string, required: true}
      locator: {range: string, required: true}
      title: {range: string}
      mimeType: {range: string, required: true}
      language: {range: string}
      sourceOwners: {range: string, multivalued: true}
      sourceRevision: {range: string, required: true}
      contentHash: {range: string, required: true, pattern: '^sha256:[a-f0-9]{64}$'}
      sourceUpdatedAt: {range: string}
      observedAt: {range: string, required: true}
      indexedAt: {range: string}
      audience: {range: DataScope, required: true}
      classification: {range: InformationClassification, required: true}
      normative: {range: boolean, required: true}
      lifecycle: {range: string, required: true}
      exclusionReason: {range: string}
      content: {range: string}
      lastSyncRunId: {range: Identifier}
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: PROJECTION
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  KnowledgeChunk:
    description: One retrievable fragment of a KnowledgeDocument's normalized content, carrying the
      lexical and vector index terms scored by knowledge.search. Purged and replaced wholesale with
      its owning document; never partially updated.
    attributes:
      documentId: {range: Identifier, required: true}
      fragmentId: {range: string, required: true}
      chunkIndex: {range: integer, required: true, minimum_value: 0}
      fragmentText: {range: string, required: true}
      tokenCount: {range: integer, required: true, minimum_value: 0}
      contentHash: {range: string, required: true, pattern: '^sha256:[a-f0-9]{64}$'}
      normative: {range: boolean, required: true}
      embeddingModelDigest: {range: string, pattern: '^sha256:[a-f0-9]{64}$'}
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: PROJECTION
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  KnowledgeSyncCursor:
    description: Restart-safe watermark for one KnowledgeSource's incremental refresh -- the last Git
      revision or connector change token observed, without any credential.
    attributes:
      corpusId: {range: Identifier, required: true}
      sourceId: {range: Identifier, required: true}
      cursorKind: {range: string, required: true}
      cursorValue: {range: string, required: true}
      updatedAt: {range: string, required: true}
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: PROJECTION
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  KnowledgeSyncRun:
    description: Sanitized evidence of one incremental refresh or reconciliation pass over a
      KnowledgeSource -- counters, status and reason codes, never source text.
    attributes:
      corpusId: {range: Identifier, required: true}
      sourceId: {range: Identifier, required: true}
      trigger: {range: string, required: true}
      status: {range: string, required: true}
      startedAt: {range: string, required: true}
      completedAt: {range: string}
      documentsScanned: {range: integer, minimum_value: 0}
      documentsUpdated: {range: integer, minimum_value: 0}
      documentsDeleted: {range: integer, minimum_value: 0}
      documentsExcluded: {range: integer, minimum_value: 0}
      reasonCode: {range: string}
      errorSummary: {range: string}
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: EVENT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  EventIngress:
    description: Generic, Realm-owned Git contract declaring that an untrusted external event may
      start an exact ProcessSpec (event-ingress-contract-foundations). Carries a schema reference,
      a verification binding, a bounded replay window and a retention boundary. Names no provider,
      channel, Realm instance or use case -- the concrete transport (a webhook, an email inbox, a
      device signal) is declared only by an instance; this schema stays generic. Grants no
      connector authority, custodies no credential, and creates no grant, approval or connector
      activation by itself -- Rego (execution.rego) additionally requires the target ProcessSpec's
      own startTrigger to be EVENT and its first effect to be an observation or an attention
      publication.
    annotations:
      jumo.composition: REALM_ONLY
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion:
        range: string
        equals_string: jumo.dev/v1
        required: true
      kind:
        range: string
        equals_string: EventIngress
        required: true
      metadata:
        range: Metadata
        required: true
        inlined: true
      spec:
        range: EventIngressSpec
        required: true
        inlined: true
  EventIngressSpec:
    attributes:
      ownerRealm:
        range: Identifier
        required: true
      active:
        range: boolean
        required: true
      schemaBinding:
        range: SchemaBinding
        required: true
        inlined: true
        description: Identifies the exact LinkML class and pinned schema digest the admitted event
          payload must validate against.
      verificationSecretBindingRef:
        range: ContractReference
        required: true
        inlined: true
        description: Same-Realm SecretBinding custodying the key material used to verify the
          event's authenticity; this contract names no verification method or transport.
      replayWindow:
        range: Duration
        required: true
        description: Bound on how long a deduplicated event ID must be recognized and a repeat
          refused as a replay.
      retentionBoundary:
        range: Duration
        required: true
        description: Bound on how long the admitted event's signed receipt is retained before
          purge.
      processSpecRef:
        range: ContractReference
        required: true
        inlined: true
        description: The exact ProcessSpec this ingress starts; must resolve to a same-Realm
          ProcessSpec whose own startTrigger is EVENT (Rego).
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
