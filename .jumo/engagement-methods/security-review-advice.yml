apiVersion: jumo.dev/v1
kind: EngagementMethod
metadata:
  id: security-review-advice
  namespace: dev.jumo.core
  name: Security review advice engagement
spec:
  agentDefinitionRef:
    kind: AgentDefinition
    namespace: dev.jumo.core
    id: qa-security-reviewer
  workerRequirementProfileRef:
    kind: WorkerRequirementProfile
    namespace: dev.jumo.core
    id: security-review-draft
  resourceBudgetRef:
    kind: ResourceBudget
    namespace: dev.jumo.core
    id: interactive
  assurance: OBSERVED
  stages:
    - id: dialogue
      promptTemplateRef:
        kind: PromptTemplate
        namespace: dev.jumo.core
        id: security-review-advisor-dialogue
      gate: NONE
      deliverable: Bounded security and verification assessment
  termination:
    maximumDuration: PT10M
    allowEarlyTermination: true
