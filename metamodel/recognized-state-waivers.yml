# Tables that scripts/generate/recognized-state-coverage.py accepts as covered without a matching
# POSTGRES-authority metamodel class, because a human has confirmed the table does not warrant one
# (a join table, a denormalized projection, migration tooling). Empty for now: canonical decision 15
# ratchets recognized_state_uncovered_tables downward one class at a time; a table only belongs here
# once someone has actually looked at it, not as a shortcut to lower the count.
waivers:
  - table: lease_invocation_grant_binding
    reason: join table binding an ExecutionCellLease to a capability grant the trusted control
      plane already issued; it carries no independent recognized business state of its own.
  - table: mcp_discovery_snapshot
    reason: append-only observation log of one bounded MCP discovery negotiation outcome, machine-
      derived and never Git-governed -- same character as this corpus's own already-uncovered
      audit_event and mcp_registry_raw_payload tables, both plain observational logs rather than
      recognized business state. Reviewed now rather than left silently uncovered because this
      table is what newly pushed the ratchet past its ceiling (mcp-target-machine-discovery).
