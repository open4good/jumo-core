apiVersion: jumo.dev/v1
kind: ProcessSpec
metadata:
  id: connector-admission--1-0-0
  namespace: dev.jumo.core
  name: Connector admission 1.0.0
spec:
  ownerRealm: home
  projectRef:
    kind: Project
    namespace: dev.jumo.core
    id: jumo
  processId: connector-admission
  processVersion: 1.0.0
  inputType: ConnectorAppraisal
  outputType: ConnectorAppraisal
  startTrigger: MANUAL
  steps:
    - id: start
      kind: START
    - id: record-appraisal
      kind: SERVICE
      capabilityRef: connector.appraisal.record
      ring: RING_1_CONTROL_PLANE
    - id: review
      kind: USER
      signalType: ApprovalSignal
    - id: admitted
      kind: END
      terminalState: COMPLETED
    - id: declined
      kind: END
      terminalState: DECLINED
  flows:
    - id: start-appraisal
      from: start
      to: record-appraisal
      payloadType: ConnectorAppraisal
    - id: appraisal-review
      from: record-appraisal
      to: review
      payloadType: ConnectorAppraisal
    - id: review-admit
      from: review
      to: admitted
      payloadType: ConnectorAppraisal
    - id: review-decline
      from: review
      to: declined
      payloadType: ConnectorAppraisal
