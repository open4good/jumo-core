        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/KitLockSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: KitLock
      description: Rendered provenance for one admitted Jumo Kit. Records bytes and
        evidence; does not authorize execution.
    KitLockSpec:
      properties:
        ownerRealm:
          type: string
        kitBindingRef:
          $ref: '#/components/schemas/ContractReference'
        repository:
          type: string
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
        commit:
          type: string
          pattern: ^[0-9a-f]{40}$
        manifestDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        kitReleaseCertificationRef:
          $ref: '#/components/schemas/ContractReference'
        rendered:
          items:
            $ref: '#/components/schemas/RenderedKitFile'
          type: array
        renderedAssets:
          items:
            $ref: '#/components/schemas/RenderedKitAsset'
          type: array
          description: Provenance for assetExports (JumoKitSpec) admitted by this
            release, if any.
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - kitBindingRef
      - repository
      - commit
      - manifestDigest
      - kitReleaseCertificationRef
      - rendered
      title: KitLockSpec
    RenderedKitFile:
      properties:
        sourcePath:
          type: string
          pattern: ^\.jumo/[A-Za-z0-9._/-]+\.yml$
        targetPath:
          type: string
          pattern: ^\.jumo/kits/[a-z][a-z0-9-]*/[A-Za-z0-9._/-]+\.yml$
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      additionalProperties: false
      type: object
      required:
      - sourcePath
      - targetPath
      - digest
      title: RenderedKitFile
    RenderedKitAsset:
      properties:
        sourcePath:
          type: string
          pattern: ^\.jumo/assets/[A-Za-z0-9._/-]+\.(png|jpg|jpeg|svg|webp|json)$
        targetPath:
          type: string
          pattern: ^\.jumo/kits/[a-z][a-z0-9-]*/assets/[A-Za-z0-9._/-]+\.(png|jpg|jpeg|svg|webp|json)$
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      additionalProperties: false
      type: object
      required:
      - sourcePath
      - targetPath
      - digest
      title: RenderedKitAsset
      description: Provenance for one rendered binary asset or i18n bundle -- same
        digest-provenance shape as RenderedKitFile, kept a separate class because
        the source/target patterns admit assetExports' file types instead of `.yml`.
    KitReleaseCertification:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/KitReleaseCertificationSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: KitReleaseCertification
      description: Portable independent review of an exact Jumo Kit release and its
        executable modules or connector artifacts. signedBy != verifiedBy (source
        schema's $data cross-field check) moves to Rego -- no actor certifies its
        own release.
    KitReleaseCertificationSpec:
      properties:
        publisher:
          type: string
          pattern: ^.{2,}$
        repository:
          type: string
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
        commit:
          type: string
          pattern: ^[0-9a-f]{40}$
        manifestDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        signedBy:
          type: string
          pattern: ^.{2,}$
        verifiedBy:
          type: string
          pattern: ^.{2,}$
        evidenceRefs:
          items:
            type: string
          type: array
          pattern: ^.{3,}$
        moduleDigests:
          items:
            $ref: '#/components/schemas/ModuleDigestEntry'
          type: array
      additionalProperties: false
      type: object
      required:
      - publisher
      - repository
      - commit
      - manifestDigest
      - signedBy
      - verifiedBy
      - evidenceRefs
      title: KitReleaseCertificationSpec
    ModuleDigestEntry:
      properties:
        moduleId:
          type: string
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      additionalProperties: false
      type: object
      required:
      - moduleId
      - digest
      title: ModuleDigestEntry
    OfferingSpec:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/OfferingSpecBody'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: OfferingSpec
      description: 'Hypothesis-level managed-service offer for a client-owned Solo
        deployment. Records the commercial assumption separately from the durable
        control-plane decisions that will survive or outlive the experiment. Renamed
        from ManagedServiceOffer: the vehicle for offering packaging. Numeric const
        values in the source schema (fixed prices, fixed durations) are kept as plain
        typed fields with an ifabsent default carrying the source''s pinned value,
        rather than encoded as JSON-Schema-style constants LinkML has no direct equivalent
        for -- several of these are expected to become genuinely configurable, so
        a plain field is the more honest fidelity choice here.'
    OfferingSpecBody:
      properties:
        state:
          $ref: '#/components/schemas/OfferingState'
        audience:
          type: string
        subscriptionAudience:
          type: string
        pricing:
          $ref: '#/components/schemas/OfferingPricing'
        onboarding:
          $ref: '#/components/schemas/OfferingOnboarding'
        topology:
          $ref: '#/components/schemas/OfferingTopology'
        aiUsage:
          $ref: '#/components/schemas/OfferingAiUsage'
        support:
          $ref: '#/components/schemas/OfferingSupport'
        kits:
          $ref: '#/components/schemas/OfferingKits'
        export:
          $ref: '#/components/schemas/OfferingExport'
        validation:
          $ref: '#/components/schemas/OfferingValidation'
      additionalProperties: false
      type: object
      required:
      - state
      - audience
      - subscriptionAudience
      - pricing
      - onboarding
      - topology
      - aiUsage
      - support
      - kits
      - export
      - validation
      title: OfferingSpecBody
    OfferingPricing:
      properties:
        monthlyFeeExVatEur:
          type: number
          format: float
        setupFeeExVatEur:
          type: number
          format: float
        billingCadence:
          $ref: '#/components/schemas/BillingCadence'
        minimumTermMonths:
          type: integer
        vatTreatment:
          $ref: '#/components/schemas/VatTreatment'
      additionalProperties: false
      type: object
      required:
