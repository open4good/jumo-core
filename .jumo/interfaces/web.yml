apiVersion: jumo.dev/v1
kind: InterfaceSurface
metadata:
  id: web
  namespace: dev.jumo.core
  name: Pilot cockpit
spec:
  ownerRealm: home
  facets:
    - entity: Realm
      list: true
      detail: true
      create: NONE
      modify: NONE
      retire: NONE
      commands: []
    - entity: Agent
      list: true
      detail: true
      create: NONE
      modify: NONE
      retire: NONE
      commands: []
    - entity: ChangeProposal
      list: true
      detail: true
      create: LIFECYCLE_COMMAND
      modify: NONE
      retire: NONE
      commands:
        - AUTHORIZE_FORGE_EFFECT
        - PROPOSE
    - entity: ForgeProjection
      list: true
      detail: true
      create: LIFECYCLE_COMMAND
      modify: NONE
      retire: NONE
      commands:
        - PROJECT
    - entity: Evidence
      list: true
      detail: true
      create: NONE
      modify: NONE
      retire: NONE
      commands: []
    - entity: AttentionItem
      list: true
      detail: true
      create: NONE
      modify: NONE
      retire: NONE
      commands: []
    - entity: Team
      list: true
      detail: true
      create: NONE
      modify: NONE
      retire: NONE
      commands: []
    - entity: WorkOrder
      list: true
      detail: true
      create: NONE
      modify: NONE
      retire: NONE
      commands: []
  surfaces:
    - id: home
      purpose: Orient the authenticated owner in the Home Realm and show the pilot roles.
      audience: REALM_PRIVATE
      presenceRef: ecosystemView
      reads:
        - INTERFACE_MANIFEST
        - AGENT_ROLES
        - CONVERSATION
        - JOURNEYS
        - JOURNEY_RUN
        - CONNECTOR_CATALOG
        - ATTENTION_ITEMS
        - THEME_PACK
        - CONTEXT_GRAPH
        - EFFECT_BATCH
      proposes:
        - interface.manifest.read
        - execution.cell.pair.confirm
        - conversation.turn.submit
        - journey.run.start
        - journey.run.read
        - journey.run.abandon
        - journey.step.select
        - journey.step.submit
        - journey.proposal.submit
        - provider.account.observe
        - provider.account.qualify
        - cli.session.pair
        - cli.session.pair.observe
        - cli.session.smoke
        - cli.session.smoke.observe
        - contract.change.propose
        - attention.item.read
        - notification.email.send
        - notification.push.send
        - context.graph.read
        - effect.batch.read
        - effect.batch.approve
        - effect.batch.apply
        - mcp.oauth.initiate
        - mcp.oauth.complete
      writePaths:
        - pathGlob: .jumo/agents/**
          ring: RING_1_CONTROL_PLANE
          capabilityRef: contract.change.propose
          editor: STRUCTURED_YAML
          requiredObligations:
            - RETAIN_PROVENANCE
            - STEP_UP_AUTHENTICATION
        - pathGlob: .jumo/teams/**
          ring: RING_1_CONTROL_PLANE
          capabilityRef: contract.change.propose
          editor: STRUCTURED_YAML
          requiredObligations:
            - RETAIN_PROVENANCE
            - STEP_UP_AUTHENTICATION
        - pathGlob: .jumo/projects/**
          ring: RING_1_CONTROL_PLANE
          capabilityRef: contract.change.propose
          editor: STRUCTURED_YAML
          requiredObligations:
            - RETAIN_PROVENANCE
            - STEP_UP_AUTHENTICATION
        - pathGlob: .jumo/providers/**
          ring: RING_1_CONTROL_PLANE
          capabilityRef: contract.change.propose
          editor: STRUCTURED_YAML
          requiredObligations:
            - RETAIN_PROVENANCE
            - STEP_UP_AUTHENTICATION
        - pathGlob: .jumo/provider-platforms/**
          ring: RING_1_CONTROL_PLANE
          capabilityRef: contract.change.propose
          editor: STRUCTURED_YAML
          requiredObligations:
            - RETAIN_PROVENANCE
            - STEP_UP_AUTHENTICATION
        - pathGlob: .jumo/secret-bindings/**
          ring: RING_1_CONTROL_PLANE
          capabilityRef: contract.change.propose
          editor: STRUCTURED_YAML
          requiredObligations:
            - RETAIN_PROVENANCE
            - STEP_UP_AUTHENTICATION
        - pathGlob: .jumo/work/**
          ring: RING_1_CONTROL_PLANE
          capabilityRef: contract.change.propose
          editor: STRUCTURED_YAML
          requiredObligations:
            - RETAIN_PROVENANCE
            - STEP_UP_AUTHENTICATION
        - pathGlob: .jumo/kits/**
          ring: RING_1_CONTROL_PLANE
          capabilityRef: contract.change.propose
          editor: STRUCTURED_YAML
          requiredObligations:
            - RETAIN_PROVENANCE
            - STEP_UP_AUTHENTICATION
        - pathGlob: .jumo/kit-bindings/**
          ring: RING_1_CONTROL_PLANE
          capabilityRef: contract.change.propose
          editor: STRUCTURED_YAML
          requiredObligations:
            - RETAIN_PROVENANCE
            - STEP_UP_AUTHENTICATION
        - pathGlob: .jumo/kit-locks/**
          ring: RING_1_CONTROL_PLANE
          capabilityRef: contract.change.propose
          editor: STRUCTURED_YAML
          requiredObligations:
            - RETAIN_PROVENANCE
            - STEP_UP_AUTHENTICATION
    - id: proposals
      purpose: Show hash-bound proposals and their GitHub pull-request projections.
      audience: REALM_PRIVATE
      reads:
        - CHANGE_PROPOSALS
        - FORGE_PROJECTIONS
        - EVIDENCE
        - CONTEXT_GRAPH
      proposes:
        - change.status.read
        - repository.content.read
        - context.graph.read
    - id: team
      purpose: Show the collective, Advisors, explicit coordination relations, teams, and separated connector and grant views.
      audience: REALM_PRIVATE
      reads:
        - TEAM_ROSTER
        - TEAM_HUB
        - CONTEXT_GRAPH
      proposes:
        - team.roster.read
        - team.hub.read
        - conversation.turn.respond
        - conversation.coordinate.read
        - capability.grant.read
        - context.graph.read
    - id: work
      purpose: Show work orders, execution rings, and acceptance criteria.
      audience: REALM_PRIVATE
      reads:
        - WORK_ORDERS
        - CONTEXT_GRAPH
      proposes:
        - work.order.read
        - context.graph.read
    - id: documents
      purpose: Read pilot documents and draft a bounded documentation proposal.
      audience: PROJECT_SCOPED
      reads:
        - DOCUMENT_TREE
        - DOCUMENT_CONTENT
        - KNOWLEDGE_CORPUS_OVERVIEW
      proposes:
        - document.content.read
        - model.document.draft
        - document.change.propose
        - change.review
        - knowledge.corpus.read
      writePaths:
        - pathGlob: docs/architecture/**/*.md
          ring: RING_3_GOVERNED_PROJECT
          capabilityRef: document.change.propose
          editor: WYSIWYG_MARKDOWN
          requiredObligations:
            - RETAIN_PROVENANCE
        - pathGlob: docs/functional/**/*.md
          ring: RING_3_GOVERNED_PROJECT
          capabilityRef: document.change.propose
          editor: WYSIWYG_MARKDOWN
          requiredObligations:
            - RETAIN_PROVENANCE
        - pathGlob: docs/security/**/*.md
          ring: RING_3_GOVERNED_PROJECT
          capabilityRef: document.change.propose
          editor: WYSIWYG_MARKDOWN
          requiredObligations:
            - RETAIN_PROVENANCE
        - pathGlob: docs/testing/**/*.md
          ring: RING_3_GOVERNED_PROJECT
          capabilityRef: document.change.propose
          editor: WYSIWYG_MARKDOWN
          requiredObligations:
            - RETAIN_PROVENANCE
    - id: account
      purpose: Read and update the signed-in principal's own account profile, self-service account
        deletion, and a governed proposal for the signed-in principal's own theme preference.
      audience: REALM_PRIVATE
      reads:
        - ACCOUNT_PROFILE
      proposes:
        - account.profile.read
        - account.profile.update
        - account.delete
        - account.theme.preference.propose
      writePaths:
        - pathGlob: .jumo/preferences/**
          ring: RING_3_GOVERNED_PROJECT
          capabilityRef: account.theme.preference.propose
          editor: STRUCTURED_YAML
          requiredObligations:
            - RETAIN_PROVENANCE
    - id: machines
      purpose: Monitor and manage execution machines, CLI runtimes, quota observations, and connectors.
      audience: REALM_PRIVATE
      reads:
        - EXECUTION_MACHINES
        - MACHINE_OBSERVATIONS
        - CLI_TOOLS
        - PROVIDER_QUOTAS
        - CONNECTOR_INTEGRATIONS
        - CONNECTOR_CATALOG
        - MCP_CATALOG
        - MCP_ELICITATION_CONSENTS
        - CONTEXT_GRAPH
      proposes:
        - machine.read
        - machine.administer
        - machine.drain
        - machine.revoke
        - cli.read
        - quota.read
        - connector.read
        - connector.test
        - mcp.catalog.read
        - mcp.elicitation.consent.read
        - mcp.elicitation.consent.resolve
        - contract.change.propose
        - context.graph.read
      writePaths:
        - pathGlob: .jumo/execution-machines/**
          ring: RING_1_CONTROL_PLANE
          capabilityRef: contract.change.propose
          editor: STRUCTURED_YAML
          requiredObligations:
            - RETAIN_PROVENANCE
            - STEP_UP_AUTHENTICATION
        - pathGlob: .jumo/cli-tools/**
          ring: RING_1_CONTROL_PLANE
          capabilityRef: contract.change.propose
          editor: STRUCTURED_YAML
          requiredObligations:
            - RETAIN_PROVENANCE
            - STEP_UP_AUTHENTICATION
        - pathGlob: .jumo/connector-packages/**
          ring: RING_1_CONTROL_PLANE
          capabilityRef: contract.change.propose
          editor: STRUCTURED_YAML
          requiredObligations:
            - RETAIN_PROVENANCE
            - STEP_UP_AUTHENTICATION
    - id: organization-governance
      purpose: Read an admitted Organization's governance boundary and submit bounded Git proposals or Realm provisioning
        requests without transitive Realm access.
      audience: ORGANIZATION_ONLY
      reads:
        - SESSION
        - ORGANIZATIONS
        - ORGANIZATION_GOVERNANCE
        - ORGANIZATION_MEMBERS
        - ORGANIZATION_COMPOSITION
        - ORGANIZATION_RETENTION
        - ORGANIZATION_RETENTION_HOLDS
        - ORGANIZATION_AUDIT_HISTORY
        - ORGANIZATION_ONBOARDING
        - AUDIT_HISTORY
      proposes:
        - organization.governance.read
        - audit.history.read
        - organization.governance.propose
        - organization.realm.provision.request
  defaultThemePackRef: {kind: ThemePack, namespace: dev.jumo.core, id: default}
