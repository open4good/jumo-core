        temporal:
          $ref: '#/components/schemas/TopologyPlacement'
        keycloak:
          $ref: '#/components/schemas/TopologyPlacement'
        openBao:
          $ref: '#/components/schemas/TopologyPlacement'
        hostname:
          $ref: '#/components/schemas/HostnameInclusion'
        canonicalDomain:
          $ref: '#/components/schemas/HostnameInclusion'
        clientRepository:
          $ref: '#/components/schemas/OfferingClientRepository'
      additionalProperties: false
      type: object
      required:
      - realmCell
      - controlPlane
      - postgresql
      - temporal
      - keycloak
      - openBao
      - hostname
      - canonicalDomain
      - clientRepository
      title: OfferingTopology
    OfferingClientRepository:
      properties:
