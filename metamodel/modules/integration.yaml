id: https://jumo.dev/schemas/integration
name: jumo_integration
description: Connectors, MCP bundles, remote services, execution cells, secrets, provider accounts, worker substrates, routing,
  recognized execution records, and federation.
license: https://www.apache.org/licenses/LICENSE-2.0
prefixes:
  linkml: https://w3id.org/linkml/
  jumo: https://jumo.dev/schemas/integration/
default_prefix: jumo
default_range: string
imports:
  - linkml:types
  - core
  - work
enums:
  # Knowledge retrieval is contract-only at this boundary. The index is a derived local projection;
  # neither these contracts nor their profile name a Realm instance in PLATFORM code.
  ConnectorLifecycle:
    permissible_values:
      DECLARED: {}
      ENABLED: {}
      SUSPENDED: {}
      RETIRED: {}
  ConnectorTransport:
    permissible_values:
      HTTP: {}
      LOCAL_PROCESS: {}
      FORGE: {}
      CHANNEL: {}
  ConnectorPlacement:
    permissible_values:
      CONTROL_PLANE: {}
      CLIENT_CELL: {}
      EXECUTION_CELL: {}
      REMOTE: {}
  OperationIdempotency:
    permissible_values:
      REQUIRED: {}
      NOT_APPLICABLE: {}
  OperationReconciliation:
    permissible_values:
      REQUIRED: {}
      NOT_REQUIRED: {}
  AppraisalVerdict:
    description: REFUSED is kept rather than deleted so a second submission of the same artifact meets the reasoning that
      rejected the first.
    permissible_values:
      ACCEPTED: {}
      ACCEPTED_WITH_CONDITIONS: {}
      REFUSED: {}
  AppraisalDimensionOutcome:
    description: CONCERN sits between PASS and FAIL so a reviewer can record something that did not block promotion without
      calling it clean.
    permissible_values:
      PASS: {}
      CONCERN: {}
      FAIL: {}
      UNKNOWN: {}
  OperationEffect:
    description: SYSTEM_EFFECT is the recovery-gated root system-effect branch (ADR-0056); an ENABLED bundle operation with
      this effect requires recoveryPlanDigest and killSwitchRef -- enforced in Rego, not schema.
    permissible_values:
      READ_ONLY: {}
      EXTERNAL_EFFECT: {}
      SYSTEM_EFFECT: {}
  MonetaryRiskPolicyLifecycle:
    permissible_values:
      DECLARED: {}
      ENABLED: {}
      SUSPENDED: {}
      RETIRED: {}
  MonetaryRiskPolicyScope:
    description: Monetary limits are scoped to their declaring Realm only; no broader scope is available in v1.
    permissible_values:
      REALM_ONLY: {}
  MonetaryReservationStatus:
    description: RESERVED counts toward its window's cumulative total and blocks dispatch of
      anything that would exceed it. CONSUMED is terminal and still counts (the money was spent).
      RELEASED is terminal and no longer counts (the reservation was never spent).
    permissible_values:
      RESERVED: {}
      CONSUMED: {}
      RELEASED: {}
  ExecutionCellPlacement:
    permissible_values:
      PLATFORM: {}
      HOSTED_VM: {}
      DESKTOP: {}
      ANDROID: {}
  ModelAccessAdapter:
    permissible_values:
      SPRING_AI_API: {}
      CODEX_CLI: {}
      GEMINI_CLI: {}
      COPILOT_CLI: {}
  ExecutionCellLifecycle:
    permissible_values:
      PAIRED: {}
      ENABLED: {}
      SUSPENDED: {}
      QUARANTINED: {}
      RETIRED: {}
  ExecutionCellPairingMethod:
    permissible_values:
      WEBAUTHN_STEP_UP: {}
      OWNER_PAIRING_CODE: {}
      OUT_OF_BAND_CERTIFICATE: {}
  ExecutionCellLocalProtocol:
    permissible_values:
      STDIO: {}
      STREAMABLE_HTTP: {}
  ExecutionCellCredentialCustody:
    description: Where an ExecutionCell's mTLS client key lives after the certificate ceremony. LOCAL_CELL_SEALED
      is the only custody corpus.cell.credential-custody (execution.rego) permits; JUMO_STORED names the real, deliberately-refused
      alternative (the control plane holding the guest's private key), so the enum stays a genuine choice and the Rego rule
      stays the authority rather than the schema silently making it unreachable.
    permissible_values:
      LOCAL_CELL_SEALED: {}
      JUMO_STORED: {}
  SecretBindingLifecycle:
    permissible_values:
      DECLARED: {}
      ENABLED: {}
      SUSPENDED: {}
      RETIRED: {}
  SecretInjectionTarget:
    permissible_values:
      MCP_PROCESS_ONLY: {}
      FORGE_APPLIER_PROCESS_ONLY: {}
      MODEL_WORKER_PROCESS_ONLY: {}
      REGISTRY_WORKER_PROCESS_ONLY: {}
  FederationMessageDirection:
    permissible_values:
      INBOUND: {}
      OUTBOUND: {}
      BIDIRECTIONAL: {}
  ProviderQuotaWindowKind:
    permissible_values:
      ROLLING: {}
      CALENDAR: {}
      METERED: {}
  ProviderObservationProvenance:
    permissible_values:
      DIRECT_PROVIDER_API: {}
      STRUCTURED_CLI_OUTPUT: {}
      RESPONSE_HEADER: {}
      OBSERVED_ERROR: {}
      PARSED_HUMAN_OUTPUT: {}
      MANUAL_DECLARATION: {}
      ESTIMATE: {}
  ProviderOnExhaustion:
    permissible_values:
      WAIT_FOR_RECOVERY: {}
      USE_AUTHORIZED_ALTERNATIVE: {}
      REQUEST_HUMAN_DECISION: {}
      STOP_CLEANLY: {}
  EntitlementHolder:
    permissible_values:
      PRINCIPAL: {}
      ORGANIZATION: {}
  EntitlementVerdict:
    permissible_values:
      PERMITTED: {}
      PROHIBITED: {}
      UNVERIFIED: {}
  AccessMode:
    permissible_values:
      PLAN_DIRECT: {}
      GATEWAY_ROUTED: {}
  WireProtocol:
    description: The upstream request/response shape a ProviderPlatform speaks (provider-platform-catalog lot).
      Named after the wire shape, never a vendor account, so an aggregator can share a protocol with the
      platform it fronts.
    permissible_values:
      ANTHROPIC_MESSAGES: {}
      OPENAI_RESPONSES: {}
      GOOGLE_GENAI: {}
  CredentialHeaderStyle:
    description: How a ProviderAccount's activated credential is carried on an outbound request through
      provider-egress. Matches RequestShape's per-protocol header choice one for one.
    permissible_values:
      AUTHORIZATION_BEARER: {}
      X_API_KEY: {}
      X_GOOG_API_KEY: {}
  WorkerNetworkIsolation:
    permissible_values:
      NONE: {}
      MODEL_ENDPOINT_ONLY: {}
  WorkerWorkspaceMode:
    permissible_values:
      ABSENT: {}
      READ_ONLY: {}
      WRITABLE: {}
  CredentialSource:
    permissible_values:
      GATEWAY_TOKEN_ONLY: {}
      PLAN_SESSION_ONLY: {}
      OPENBAO_RENDERED_FILE: {}
  WorkerSubstrateKind:
    permissible_values:
      LOCAL_CLI_CONTAINER: {}
      MODEL_WORKER_PROCESS: {}
  WorkerUsageContext:
    permissible_values:
      PERSONAL: {}
      COMMERCIAL: {}
  WorkerAccountUse:
    permissible_values:
      HOLDER_OPERATED: {}
      JUMO_MANAGED: {}
  McpTransportType:
    permissible_values:
      STREAMABLE_HTTP: {}
      STDIO: {}
      LEGACY_HTTP_SSE: {}
  McpSupplyKind:
    permissible_values:
      REMOTE_STREAMABLE_HTTP: {}
      OCI_STDIO: {}
      NPM_STDIO: {}
      PYTHON_UV_STDIO: {}
      NATIVE_STDIO: {}
  McpBindingLifecycle:
    permissible_values:
      DECLARED: {}
      ENABLED: {}
      SUSPENDED: {}
  McpParameterType:
    permissible_values:
      STRING: {}
      INTEGER: {}
      BOOLEAN: {}
      ENUM: {}
      ORIGIN: {}
  McpArgumentValueKind:
    permissible_values:
      LITERAL: {}
      PARAMETER: {}
      CREDENTIAL: {}
  McpPrimitiveKind:
    permissible_values:
      TOOL: {}
      RESOURCE: {}
      RESOURCE_TEMPLATE: {}
      PROMPT: {}
      TASK: {}
      SAMPLING: {}
      ELICITATION: {}
  McpAuthMode:
    permissible_values:
      NONE: {}
      STATIC_HEADERS: {}
      OAUTH_2_1: {}
  McpOAuthClientMode:
    permissible_values:
      PREREGISTERED: {}
      CIMD: {}
      DCR: {}
  McpQualificationOutcome:
    permissible_values:
      QUALIFIED: {}
      REFUSED: {}
      DRIFTED: {}
  McpQuarantineReason:
    permissible_values:
      SUPPLY_DRIFT: {}
      INVENTORY_DRIFT: {}
      SCHEMA_DRIFT: {}
      PROMPT_DRIFT: {}
      PRIMITIVE_DRIFT: {}
      POLICY_REFUSAL: {}
  McpRegistrySourceType:
    permissible_values:
      OFFICIAL_REGISTRY: {}
      GITHUB_ENRICHMENT: {}
      GLAMA: {}
      SMITHERY: {}
      PULSE_MCP: {}
  McpRegistrySourceLifecycle:
    permissible_values:
      ENABLED: {}
      DISABLED: {}
      BLOCKED: {}
  McpRegistrySyncMode:
    permissible_values:
      FULL_THEN_INCREMENTAL: {}
      ENRICHMENT_ONLY: {}
  McpCatalogInstallability:
    permissible_values:
      REMOTE_READY: {}
      OCI_READY: {}
      FACTORY_REQUIRED: {}
      UNSUPPORTED: {}
      BLOCKED: {}
      WITHDRAWN: {}
  McpCatalogAssessmentOutcome:
    permissible_values:
      PASS: {}
      CONCERN: {}
      FAIL: {}
      UNKNOWN: {}
  McpReconciliationDecisionType:
    permissible_values:
      AUTO_MERGE: {}
      APPROVED_MERGE: {}
      APPROVED_SPLIT: {}
      REJECTED: {}
  McpInvocationOutcomeType:
    permissible_values:
      SUCCEEDED: {}
      FAILED: {}
  ActionRunStatus:
    description: Recognized-state lifecycle of a resumable ActionRun (connector-action-runs-and-effect-batches AC1).
    permissible_values:
      PROPOSED: {}
      IN_PROGRESS: {}
      AWAITING_APPROVAL: {}
      PAUSED:
        description: At least one ActionStep resolved UNKNOWN; the run is paused pending
          reconciliation or an owner decision, never a blind retry (connector-action-runs-and-effect-batches AC3, not yet built).
      COMPLETED: {}
      FAILED: {}
      CANCELLED: {}
  ActionStepStatus:
    description: Recognized-state lifecycle of a single typed action inside an ActionRun.
    permissible_values:
      PROPOSED: {}
      EXECUTING: {}
      SUCCEEDED: {}
      FAILED: {}
      UNKNOWN:
        description: A dispatched step whose terminal outcome was never observed. Automatic retry
          is prohibited; only reconciliation or a recorded owner decision may move a step out of
          this state (same discipline as WorkloadCommandStatus.UNKNOWN).
  EffectBatchStatus:
    description: Recognized-state lifecycle of an EffectBatch, the approval and recovery unit for
      owner-approved external-effect lines.
    permissible_values:
      DRAFT: {}
      AWAITING_APPROVAL: {}
      APPROVED: {}
      DISPATCHING: {}
      COMPLETED: {}
      PAUSED: {}
      CANCELLED: {}
  EffectBatchLineStatus:
    description: Per-line dispatch outcome. Recognized now so AC1's typed contract does not need
      revisiting when connector-action-runs-and-effect-batches AC3 builds the trusted applier.
    permissible_values:
      PENDING: {}
      SUCCESS: {}
      FAILED: {}
      UNKNOWN:
        description: The applier's dispatch of this line had no observed terminal outcome. Never
          retried blindly (connector-action-runs-and-effect-batches AC3).
classes:
  McpServerRecipe:
    description: Immutable Realm-imported recipe for one MCP server. It describes mechanism and exposure but grants no authority.
    annotations:
      jumo.composition: REALM_ONLY
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion: {range: string, equals_string: jumo.dev/v1, required: true}
      kind: {range: string, equals_string: McpServerRecipe, required: true}
      metadata: {range: Metadata, required: true, inlined: true}
      spec: {range: McpServerRecipeSpec, required: true, inlined: true}
  McpServerRecipeSpec:
    attributes:
      ownerRealm: {range: Identifier, required: true}
      importedSourceDigest:
        range: string
        required: true
        pattern: ^sha256:[0-9a-f]{64}$
      supply: {range: McpServerSupply, required: true, inlined: true}
      protocol: {range: McpRecipeProtocol, required: true, inlined: true}
      parameters: {range: McpRecipeParameter, multivalued: true, inlined_as_list: true}
      credentialSlots: {range: McpCredentialSlot, multivalued: true, inlined_as_list: true}
      argv: {range: McpArgumentValue, multivalued: true, inlined_as_list: true}
      env: {range: McpNamedValue, multivalued: true, inlined_as_list: true}
      headers: {range: McpNamedValue, multivalued: true, inlined_as_list: true}
      egressOrigins: {range: string, multivalued: true, pattern: '^https://[^/?#]+(?::[0-9]+)?$'}
      limits: {range: McpRuntimeLimits, required: true, inlined: true}
      auth: {range: McpRecipeAuth, required: true, inlined: true}
      exposures: {range: McpPrimitiveExposure, multivalued: true, inlined_as_list: true, required: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpServerSupply:
    attributes:
      supplyKind: {range: McpSupplyKind, required: true}
      endpointOrigin: {range: string, pattern: '^https://[^/?#]+(?::[0-9]+)?$'}
      endpointPath: {range: string, pattern: '^/[^?#]*$'}
      ociReference: {range: string}
      packageName: {range: string}
      exactVersion: {range: string}
      sourceOrigin: {range: string, pattern: '^https://[^?#]+$'}
      architecture: {range: string}
      artifactDigest: {range: string, pattern: '^sha256:[0-9a-f]{64}$'}
      signatureDigest: {range: string, pattern: '^sha256:[0-9a-f]{64}$'}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpRecipeProtocol:
    attributes:
      minVersion: {range: string, required: true}
      maxVersion: {range: string, required: true}
      transports: {range: McpTransportType, multivalued: true, required: true, minimum_cardinality: 1}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpRecipeParameter:
    attributes:
      name: {range: Identifier, required: true}
      type: {range: McpParameterType, required: true}
      required: {range: boolean, required: true}
      allowedValues: {range: string, multivalued: true}
      pattern: {range: string}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpCredentialSlot:
    attributes:
      name: {range: Identifier, required: true}
      injectionTarget: {range: string, required: true}
      required: {range: boolean, required: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpArgumentValue:
    attributes:
      valueKind: {range: McpArgumentValueKind, required: true}
      literal: {range: string}
      parameterRef: {range: Identifier}
      credentialSlotRef: {range: Identifier}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpNamedValue:
    attributes:
      name: {range: string, required: true}
      value: {range: McpArgumentValue, required: true, inlined: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpRuntimeLimits:
    attributes:
      maxMemoryBytes: {range: integer, required: true}
      maxCpuMillis: {range: integer, required: true}
      maxPayloadBytes: {range: integer, required: true}
      timeoutMillis: {range: integer, required: true}
      maxCallsPerMinute: {range: integer, required: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpRecipeAuth:
    attributes:
      mode: {range: McpAuthMode, required: true}
      oauthClientMode: {range: McpOAuthClientMode}
      metadataOrigin: {range: string, pattern: '^https://[^/?#]+(?::[0-9]+)?$'}
      resourceIndicator: {range: string, pattern: '^https://[^?#]+$'}
      scopes: {range: string, multivalued: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpPrimitiveExposure:
    attributes:
      primitiveKind: {range: McpPrimitiveKind, required: true}
      upstreamName: {range: string, required: true}
      exposedName: {range: string, required: true}
      description: {range: string, required: true, pattern: '^.{10,}$'}
      capabilityRef: {range: CapabilityName}
      inputSchemaDigest: {range: string, pattern: '^sha256:[0-9a-f]{64}$'}
      outputSchemaDigest: {range: string, pattern: '^sha256:[0-9a-f]{64}$'}
      opaqueOutput: {range: boolean, required: true}
      allowedMimeTypes: {range: string, multivalued: true}
      resourceUriPatterns: {range: string, multivalued: true}
      staticContentDigest: {range: string, pattern: '^sha256:[0-9a-f]{64}$'}
      taskInstructionsAllowed: {range: boolean, required: true}
      maxSamplingCalls: {range: integer}
      maxSamplingTokens: {range: integer}
      allowedModels:
        range: string
        multivalued: true
        description: ADR-0063 decision 9's "bounded by model" clause -- exact model identifiers a
          SAMPLING exposure may complete against. Empty/absent refuses every sampling/createMessage
          request for this exposure rather than defaulting to unbounded (generic-mcp-full-protocol
          AC3).
      resourceBudgetRef:
        range: ContractReference
        inlined: true
        description: ADR-0063 decision 9's "bounded by ... budget" clause for a SAMPLING exposure --
          the same ResourceBudget contract kind an Episode already uses, reused rather than
          duplicated (canonical decision 15); BudgetLimits.estimatedCostEur is the field this bound
          actually reads, since modelCalls/tokens are already covered per-exposure by
          maxSamplingCalls/maxSamplingTokens above (generic-mcp-full-protocol AC3).
      allowedDataClasses: {range: string, multivalued: true}
      elicitationSensitiveAllowed: {range: boolean}
      allowedOrigins: {range: string, multivalued: true, pattern: '^https://[^/?#]+(?::[0-9]+)?$'}
      fixedArguments: {range: McpNamedValue, multivalued: true, inlined_as_list: true}
      hiddenArguments: {range: Identifier, multivalued: true}
      jsonProjection: {range: string, multivalued: true}
      jsonRedaction: {range: string, multivalued: true}
      effect: {range: OperationEffect, required: true}
      requiresGrant: {range: boolean, required: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpServerBinding:
    description: Realm contract assigning non-secret recipe values and SecretBinding references to one target machine.
    annotations:
      jumo.composition: REALM_ONLY
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion: {range: string, equals_string: jumo.dev/v1, required: true}
      kind: {range: string, equals_string: McpServerBinding, required: true}
      metadata: {range: Metadata, required: true, inlined: true}
      spec: {range: McpServerBindingSpec, required: true, inlined: true}
  McpServerBindingSpec:
    attributes:
      ownerRealm: {range: Identifier, required: true}
      recipeRef: {range: ContractReference, required: true, inlined: true}
      executionMachineRef: {range: ContractReference, required: true, inlined: true}
      lifecycle: {range: McpBindingLifecycle, required: true}
      appraisalRef: {range: ContractReference, inlined: true}
      parameterValues: {range: McpBindingParameter, multivalued: true, inlined_as_list: true}
      credentialBindings: {range: McpCredentialBinding, multivalued: true, inlined_as_list: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpBindingParameter:
    attributes:
      parameterRef: {range: Identifier, required: true}
      value: {range: string, required: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpCredentialBinding:
    attributes:
      credentialSlotRef: {range: Identifier, required: true}
      secretBindingRef: {range: ContractReference, required: true, inlined: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  McpServerAppraisal:
    description: Independent Realm decision bound to exact recipe, supply, inventory and binding digests; it grants no authority.
    annotations:
      jumo.composition: REALM_ONLY
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion: {range: string, equals_string: jumo.dev/v1, required: true}
      kind: {range: string, equals_string: McpServerAppraisal, required: true}
      metadata: {range: Metadata, required: true, inlined: true}
      spec: {range: McpServerAppraisalSpec, required: true, inlined: true}
  McpServerAppraisalSpec:
    attributes:
      ownerRealm: {range: Identifier, required: true}
      recipeRef: {range: ContractReference, required: true, inlined: true}
      bindingRef: {range: ContractReference, required: true, inlined: true}
      recipeDigest: {range: string, required: true, pattern: '^sha256:[0-9a-f]{64}$'}
      supplyDigest: {range: string, required: true, pattern: '^sha256:[0-9a-f]{64}$'}
      inventoryDigest: {range: string, required: true, pattern: '^sha256:[0-9a-f]{64}$'}
      bindingDigest: {range: string, required: true, pattern: '^sha256:[0-9a-f]{64}$'}
      appraisedByRoleDefinitionRef: {range: ContractReference, required: true, inlined: true}
