apiVersion: jumo.dev/v1
kind: AssistedJourney
metadata:
  id: declare-provider-account
  namespace: dev.jumo.core
  name: Déclarer un compte fournisseur
spec:
  journeyId: declare-provider-account
  name: Déclarer un compte fournisseur
  description: Déclarez un compte fournisseur externe de modèle ou de CLI, configurez les alias de
    routage, et établissez les bornes d'habilitation sans jamais accepter de jeton secret en clair.
  category: integrations
  icon: mdi-cloud-outline
  interruptible: true
  concurrencyPolicy: MULTIPLE_ACTIVE_RUNS
  emitsCapability: contract.change.propose
  emission:
    targetKind: ProviderAccount
    identifier: {fromField: providerId}
    pathTemplate: .jumo/providers/${id}.yml
    documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: provider-account}
    validations:
      - {field: providerId, required: true}
    fieldDefaults:
      - {field: independenceGroup, value: '${provider}'}
    fieldConditions:
      - {field: gatewayRef, whenField: routingMode, equalsValue: GATEWAY_ROUTED}
    booleanFields: [permitted]
  steps:
    - id: define-provider
      name: Identité du fournisseur
      description: Indiquez l'identifiant du compte, son nom, et la famille de fournisseur (par ex.
        anthropic, openai, google).
      personaNarration: Nommons et catégorisons ce compte fournisseur.
      requiredFields:
        - {field: providerId, i18nKey: journeyProviderIdField}
        - {field: providerName, i18nKey: journeyProviderNameField}
        - {field: provider, i18nKey: journeyProviderFamilyField}
    - id: configure-routing
      name: Configuration du routage
      description: Configurez le mode de routage, la référence de passerelle et les alias requis.
      personaNarration: Définissons comment le trafic modèle est routé vers ce fournisseur.
      requiredFields:
        - {field: routingMode, i18nKey: journeyRoutingModeField}
        - {field: gatewayRef, i18nKey: journeyGatewayRefField}
    - id: configure-entitlement
      name: Habilitations et quotas
      description: Précisez le statut d'habilitation et les bornes de la fenêtre de quota.
      personaNarration: Configurons les permissions d'usage et les seuils budgétaires.
      requiredFields:
        - {field: permitted, i18nKey: journeyPermittedField}
    - id: confirm-declaration
      name: Confirmation
      description: Vérifiez la déclaration structurée du ProviderAccount avant de proposer le
        changement.
      personaNarration: Relisons le contrat fournisseur avant soumission.
      requiredFields:
        - {field: confirmed, i18nKey: journeyConfirmField}
  resourceBudgetRef:
    kind: ResourceBudget
    namespace: dev.jumo.core
    id: interactive
