        ifabsent: 'true'
      exitWindowDays:
        range: integer
        required: true
        ifabsent: '30'
      backupRetentionDays:
        range: integer
        required: true
        ifabsent: '90'
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: PUBLIC
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  OfferingValidation:
    attributes:
      minimumPayingCustomers:
        range: integer
        required: true
        ifabsent: '5'
      minimumCycles:
        range: integer
        required: true
        ifabsent: '3'
      minimumRenewals:
        range: integer
        required: true
        ifabsent: '4'
      minimumDirectMarginPercent:
        range: integer
        required: true
        ifabsent: '60'
      maximumMedianSupportMinutesPerCustomerMonth:
        range: integer
        required: true
        ifabsent: '30'
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: PUBLIC
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
