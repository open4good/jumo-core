    OrganizationSpec:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/OrganizationSpecBody'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: OrganizationSpec
      description: 'A named organization of roles for a recurring mission (docs/concepts/positionnement-conceptuel.md#organisation-moise),
        referencing RoleDefinition, TeamSpec, RoleAssignment, and OrganizationTemplate
        without replacing or absorbing any of them -- those classes stay independently
        declarable, which is what "renamed without absorption" means at the composite-class
        boundary too. The software-delivery example: a chief-of-staff role, an implementer,
        a reviewer, a human owner, plus incompatibility and independence constraints
        between them.'
    OrganizationSpecBody:
      properties:
        ownerRealm:
          type: string
        mission:
          type: string
          pattern: ^.{10,}$
        roleRefs:
          items:
            $ref: '#/components/schemas/OrganizationRoleBinding'
          type: array
          description: References RoleDefinition entries this organization uses, each
            bound to a named seat.
        organizationTemplateRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: Optional OrganizationTemplate this organization was instantiated
            from.
        incompatibleSeatPairs:
          items:
            $ref: '#/components/schemas/SeatIncompatibility'
          type: array
          description: Seats that may never be filled by the same RoleAssignment bearer
            (e.g. implementer and reviewer). Enforced in Rego, not here.
        independentSeatGroups:
          items:
            $ref: '#/components/schemas/SeatIndependenceGroup'
          type: array
          description: Seats whose bearers must sit in different independence groups
            (e.g. reviewer needs a distinct provider group from implementer). Enforced
            in Rego.
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - mission
      - roleRefs
      title: OrganizationSpecBody
    OrganizationRoleBinding:
      properties:
        seatId:
          type: string
          description: A named seat in this organization, e.g. "chief-of-staff", "implementer",
            "reviewer", "owner".
        roleDefinitionRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The RoleDefinition this seat is bound to.
        humanSeat:
          type: boolean
          description: True for the human-owner seat, which is never filled by an
            AgentDefinition bearer.
      additionalProperties: false
      type: object
      required:
      - seatId
      - roleDefinitionRef
      title: OrganizationRoleBinding
    SeatIncompatibility:
      properties:
        seatIds:
          items:
            type: string
          type: array
      additionalProperties: false
      type: object
      required:
      - seatIds
      title: SeatIncompatibility
    SeatIndependenceGroup:
