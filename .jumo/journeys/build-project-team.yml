apiVersion: jumo.dev/v1
kind: AssistedJourney
metadata:
  id: build-project-team
  namespace: dev.jumo.core
  name: Constituer une équipe projet
spec:
  journeyId: build-project-team
  name: Constituer une équipe projet
  summaryI18nKey: buildProjectTeamSummary
  description: Composez et configurez une équipe projet gouvernée avec des rôles responsables, des
    mécanismes de coordination et des groupes de vérification indépendants.
  category: teamsProjects
  icon: mdi-account-group-outline
  interruptible: true
  concurrencyPolicy: MULTIPLE_ACTIVE_RUNS
  requiredCapabilities: [journey.run.start, journey.run.read, journey.run.abandon, journey.step.select, journey.step.submit, journey.proposal.submit, contract.change.propose]
  policySetRefs: [{kind: PolicySet, namespace: dev.jumo.core, id: security-baseline}]
  emitsCapability: contract.change.propose
  emissionBundle:
    # The four fan-out items render before TeamSpec/RoutingEligibility (not declaration order by
    # accident): TeamSpec's own members projection now folds proposedMembers in (team-and-operator-
    # design-journeys AC2), and its referenceChecks resolve each proposed roleRef only through the
    # same-bundle registry (registerBundleEmission) -- so the RoleDefinition a proposed member names
    # must already have rendered by the time TeamSpec's reference check runs.
    - fanOutCollection: proposedMembers
      emission:
        targetKind: RoleDefinition
        identifier: {fromField: roleRef}
        pathTemplate: .jumo/roles/${id}.yml
        documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: role-definition}
        validations:
          - {field: roleRef, required: true, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'}
          - {field: role, required: true, minimumLength: 3}
          - {field: mission, required: true, minimumLength: 10}
    - fanOutCollection: proposedMembers
      emission:
        targetKind: AgentDefinition
        identifier: {fromField: roleRef}
        pathTemplate: .jumo/agents/${id}.yml
        documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: agent-definition}
        validations:
          - {field: responsibilities, minimumItems: 1}
          - {field: requestedCapabilities, minimumItems: 1}
    - fanOutCollection: proposedMembers
      emission:
        targetKind: WorkerRequirementProfile
        identifier: {fromField: roleRef}
        pathTemplate: .jumo/worker-requirements/${id}.yml
        documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: worker-requirement-profile}
        validations:
          - {field: taskClasses, minimumItems: 1}
          - {field: modalities, minimumItems: 1}
    - fanOutCollection: proposedMembers
      emission:
        targetKind: RoleAssignment
        identifier: {fromField: roleRef}
        pathTemplate: .jumo/role-assignments/${id}.yml
        documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: role-assignment}
        referenceChecks:
          - {field: roleRef, kind: RoleDefinition}
          - {field: roleRef, kind: AgentDefinition}
          - {field: roleRef, kind: WorkerRequirementProfile}
    - emission:
        targetKind: TeamSpec
        identifier: {fromField: teamId}
        pathTemplate: .jumo/teams/${id}.yml
        documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: team-spec}
        validations:
          - {field: teamId, required: true, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'}
          - {field: teamName, required: true}
          - {field: projectPurpose, required: true, minimumLength: 10}
          - {field: members, minimumItems: 2}
        fieldDefaults:
          - {field: purpose, value: '${projectPurpose}'}
        referenceChecks:
          - {field: members, kind: RoleDefinition, itemPath: roleRef}
        collectionProjections:
          - field: members
            keys: [roleRef, role]
            optionalKeys: [independenceGroup]
            itemReferenceKind: RoleDefinition
            itemValidations:
              - {field: role, minimumLength: 3}
          - field: members
            sourceField: proposedMembers
            keys: [roleRef, role]
            optionalKeys: [independenceGroup]
            itemValidations:
              - {field: role, minimumLength: 3}
    - emission:
        targetKind: RoutingEligibility
        identifier: {fromField: teamId}
        pathTemplate: .jumo/routing-eligibilities/${id}.yml
        documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: routing-eligibility}
        validations:
          - {field: teamId, required: true, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'}
          - {field: projectRef, required: true}
        referenceChecks:
          - {field: projectRef, kind: Project}
          - {field: teamId, kind: TeamSpec}
          # itemPath: id, not roleRef -- this checks the already-rendered ContractReference shape
          # asContractReferences produces below, not the raw collected item.
          - {field: eligibleRoleDefinitionRefs, kind: RoleDefinition, itemPath: id}
        # team-and-operator-design-journeys AC3: binds the same roster TeamSpec.spec.members
        # renders (existing selections plus newly proposed ones) into typed role references, not
        # just the team.
        collectionProjections:
          - field: eligibleRoleDefinitionRefs
            sourceField: members
            keys: [roleRef]
            itemReferenceKind: RoleDefinition
            asContractReferences: true
          - field: eligibleRoleDefinitionRefs
            sourceField: proposedMembers
            keys: [roleRef]
            itemReferenceKind: RoleDefinition
            asContractReferences: true
            itemIdKey: roleRef
  steps:
    - id: analyze-team-need
      requiredObligations: []
      name: Analyse du besoin
      description: Nestor examine le besoin exprimé pour ce projet avant la composition de l'équipe.
      personaNarration: Avant de composer l'équipe, discutons du besoin réel de ce projet.
      stepKind: DIALOGUE_COLLECT
      requiredFields: []
      promptTemplateRef:
        kind: PromptTemplate
        namespace: dev.jumo.core
        id: team-analysis
    - id: define-team-scope
      requiredObligations: []
      name: Définition de l'équipe
      description: Renseignez le nom de l'équipe et la mission du projet gouverné.
      personaNarration: Définissons ensemble les objectifs de cette nouvelle équipe projet et son champ d'action.
      stepKind: COLLECT
      requiredFields:
        - {field: teamId, i18nKey: journeyTeamIdField}
        - {field: teamName, i18nKey: journeyTeamNameField}
        - {field: projectRef, i18nKey: journeyProjectRefField}
        - {field: projectPurpose, i18nKey: journeyProjectPurposeField}
      projectionSpecRef:
        kind: ProjectionSpec
        namespace: dev.jumo.core
        id: build-project-team
    - id: select-members
      requiredObligations: []
      name: Sélection des membres
      description: Choisissez les opérateurs et définissez leurs rôles et groupes d'indépendance.
      personaNarration: Structurons les membres de l'équipe en veillant à la séparation des responsabilités de production
        et de revue.
      stepKind: COLLECT
      requiredFields:
        - {field: members, i18nKey: journeySelectRoles}
      projectionSpecRef:
        kind: ProjectionSpec
        namespace: dev.jumo.core
        id: select-members
    - id: recommend-connectors
      requiredObligations: []
      name: Recommandation de connecteurs
      description: Nestor distingue les connecteurs déjà déclarés, les candidats du catalogue MCP et les besoins
        d'accès non couverts, sans en créer, installer ni activer aucun.
      personaNarration: Voyons quels accès cette équipe pourrait utiliser -- ce que vous avez déjà, ce qui existe
        dans le catalogue, et ce qui reste à clarifier.
      stepKind: DIALOGUE_COLLECT
      dependsOn: [select-members]
      requiredFields: []
      promptTemplateRef:
        kind: PromptTemplate
        namespace: dev.jumo.core
        id: connector-recommendation
    - id: confirm-team
      requiredObligations: []
      name: Validation de l'équipe
      description: Vérifiez le récapitulatif de l'équipe avant émission de la proposition contractuelle.
      personaNarration: Tout est en ordre. Validons la création de cette équipe dans votre Realm.
      stepKind: COLLECT
      requiredFields:
        - {field: confirmed, i18nKey: journeyConfirmField}
      projectionSpecRef:
        kind: ProjectionSpec
        namespace: dev.jumo.core
        id: summary-and-activate
  resourceBudgetRef:
    kind: ResourceBudget
    namespace: dev.jumo.core
    id: interactive
