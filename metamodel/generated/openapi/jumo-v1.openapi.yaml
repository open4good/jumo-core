          pattern: ^sha256:[0-9a-f]{64}$
        publisher:
          type: string
          pattern: ^.{2,}$
        signatureRef:
          type: string
          pattern: ^.{3,}$
        sbomRef:
          type: string
          pattern: ^.{3,}$
        license:
          type: string
          pattern: ^.{2,}$
      additionalProperties: false
      type: object
      required:
      - format
      - reference
      - digest
      - publisher
      - signatureRef
      - sbomRef
      - license
      title: McpBundleArtifact
    McpBundleRuntime:
      properties:
        transport:
          type: string
        upstreamKind:
          type: string
          description: Not schema-required -- the pinned jumo-core sibling source
            only gains this field at its own pace; enforced unconditionally in Rego
            instead (corpus.bundle.upstream-kind-required), which reads the live composed
            corpus rather than a stale lock.
        placement:
          allOf:
          - $ref: '#/components/schemas/McpBundlePlacement'
          description: v2 admits only EXECUTION_CELL; CLIENT_CELL and REMOTE remain
            declarable at the schema level but are refused by corpus.bundle.execution-cell-only-placement
            (Rego, not schema) for the same reason.
        entrypoint:
          type: string
          pattern: ^.{1,}$
      additionalProperties: false
      type: object
      required:
      - transport
      - placement
      title: McpBundleRuntime
      description: An McpBundle's single upstream branch is always OCI_STDIO with
        a pinned artifact (McpBundleSpec.artifact); the STREAMABLE_HTTP branch has
        no bundle and is reached only through ConnectorDefinitionSpec.remoteMcpServiceRef
        and RemoteMcpServiceSpec.transport MCP_STREAMABLE_HTTP (ADR-0050 decisions
        6-7).
    McpBundleSemanticProfile:
      properties:
        purpose:
          type: string
          pattern: ^.{10,}$
        dataScope:
          $ref: '#/components/schemas/DataScope'
        operations:
          items:
            $ref: '#/components/schemas/McpBundleOperation'
          type: array
      additionalProperties: false
      type: object
      required:
      - purpose
      - dataScope
      - operations
      title: McpBundleSemanticProfile
    McpBundleOperation:
      properties:
        id:
          type: string
        exposedName:
          type: string
          pattern: ^.{3,}$
        upstreamToolName:
          type: string
          pattern: ^.{1,}$
          description: The raw MCP tool this semantic operation wraps. Never leaves
            this document -- there is no generic connector.invoke (ADR-0019, decision
            161).
        untrustedOutput:
          type: boolean
          description: Whether this operation returns content originating outside
            the trust boundary.
        agentGuidance:
          type: string
          pattern: ^.{10,}$
          description: When to reach for this operation and when not to, written for
            the choosing agent.
        capabilityRef:
          type: string
        description:
          type: string
          pattern: ^.{10,}$
        effect:
          $ref: '#/components/schemas/OperationEffect'
        idempotency:
          $ref: '#/components/schemas/OperationIdempotency'
        reconciliation:
          $ref: '#/components/schemas/OperationReconciliation'
        inputSchemaRef:
          type: string
          pattern: ^.{3,}$
        outputSchemaRef:
          type: string
          pattern: ^.{3,}$
        secretBindingRefs:
          items:
            type: string
          type: array
        recoveryPlanDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: Required in Rego when effect is SYSTEM_EFFECT and the bundle
            is ENABLED (ADR-0056 decision 3).
        killSwitchRef:
          type: string
          pattern: ^.{3,}$
          description: Required in Rego when effect is SYSTEM_EFFECT and the bundle
            is ENABLED (ADR-0056 decision 4).
      additionalProperties: false
      type: object
      required:
      - id
      - exposedName
      - upstreamToolName
      - untrustedOutput
      - capabilityRef
      - description
      - effect
      - idempotency
      - reconciliation
      title: McpBundleOperation
    RemoteMcpService:
