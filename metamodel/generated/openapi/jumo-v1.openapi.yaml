          $ref: '#/components/schemas/ApiSurfaceSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ApiSurface
      description: Governed API surface contract mapping routes, verbs, and audiences
