      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: PromptTemplate
      description: 'A prompt is Ring 2 material: reviewable, versioned agent behavior
        (ADR-0008). Belongs to exactly one AgentDefinition; the capabilities its output
        may propose are constrained to a subset of what that definition requests.'
    PromptTemplateSpec:
      properties:
        agentDefinitionRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The owning AgentDefinition.
        purpose:
          type: string
          pattern: ^.{10,}$
        template:
          $ref: '#/components/schemas/PromptBody'
        variables:
          items:
            $ref: '#/components/schemas/PromptVariable'
          type: array
        output:
          $ref: '#/components/schemas/PromptOutput'
        mayProposeCapabilities:
          items:
            type: string
          type: array
          description: 'Enforced as a subset of the owning AgentDefinition''s requestedCapabilities
            (Rego). Proposing is still not granting: policy decides.'
        workerRequirementProfileRef:
          $ref: '#/components/schemas/ContractReference'
        resourceBudgetRef:
          $ref: '#/components/schemas/ContractReference'
        minimumAssurance:
          $ref: '#/components/schemas/AssuranceLevel'
        ring:
          $ref: '#/components/schemas/Ring'
        conversationTask:
          allOf:
          - $ref: '#/components/schemas/ConversationTask'
          description: The ConversationService task this prompt serves. Optional --
            most PromptTemplate documents are referenced by a journey step, not by
            a conversation task, and leave this unset.
      additionalProperties: false
      type: object
      required:
      - agentDefinitionRef
      - purpose
      - template
      - output
      title: PromptTemplateSpec
    PromptBody:
      properties:
        engine:
          $ref: '#/components/schemas/PromptEngine'
        system:
          type: string
        user:
          type: string
          pattern: ^.{1,}$
        path:
          type: string
          description: Optional path to the body, for prompts too long to inline.
      additionalProperties: false
      type: object
      required:
      - engine
      - user
      title: PromptBody
    PromptVariable:
      properties:
        name:
          type: string
          pattern: ^[a-z][a-zA-Z0-9_]*$
        description:
          type: string
        trust:
          $ref: '#/components/schemas/VariableTrust'
        required:
          type: boolean
      additionalProperties: false
      type: object
      required:
      - name
      - trust
      title: PromptVariable
    PromptOutput:
      properties:
        form:
          $ref: '#/components/schemas/PromptOutputForm'
        javaType:
          type: string
          description: Fully qualified target type for STRUCTURED output.
        schemaRef:
          type: string
      additionalProperties: false
      type: object
      required:
      - form
      title: PromptOutput
    ResourceBudget:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ResourceBudgetSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ResourceBudget
      description: Per-Episode frugality limits. Assurance may never degrade silently
        to stay within budget.
    ResourceBudgetSpec:
      properties:
        limits:
          $ref: '#/components/schemas/BudgetLimits'
        minimumAssurance:
          allOf:
          - $ref: '#/components/schemas/AssuranceLevel'
          description: A floor. Exhaustion may never push the Episode below it without
            explicit policy and approval.
        onExhaustion:
          $ref: '#/components/schemas/BudgetOnExhaustion'
        preferDeterministicRouting:
          type: boolean
      additionalProperties: false
      type: object
      required:
      - limits
      - onExhaustion
      title: ResourceBudgetSpec
    BudgetLimits:
      properties:
        tokens:
          type: integer
          minimum: 1
        estimatedCostEur:
          type: number
          minimum: 0
          format: float
        wallClock:
          type: string
        modelCalls:
          type: integer
          minimum: 1
        toolCalls:
          type: integer
          minimum: 1
      additionalProperties: false
      type: object
      title: BudgetLimits
    AssistedJourney:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/AssistedJourneySpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: AssistedJourney
      description: Declaration of a multi-turn governed assisted onboarding journey.
    JourneyVerificationSpec:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        targetType:
          $ref: '#/components/schemas/JourneyVerificationTarget'
        capability:
          $ref: '#/components/schemas/JourneyVerificationCapability'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - targetType
      - capability
      title: JourneyVerificationSpec
      description: Secret-free declaration of an explicit real observation a journey
        step may request.
    AssistedJourneySpec:
      properties:
        journeyId:
          type: string
          pattern: ^[a-z][a-z0-9-]*$
        name:
          type: string
        description:
          type: string
        category:
          type: string
          description: Catalog category for this journey.
        icon:
          type: string
          description: Display icon for this journey.
        interruptible:
          type: boolean
        concurrencyPolicy:
          $ref: '#/components/schemas/AssistedJourneyConcurrencyPolicy'
        firstRunMandatory:
          type: boolean
        lifetimeUnique:
          type: boolean
        heroImage:
          type: string
        resourceBudgetRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: Names the ResourceBudget whose modelCalls limit bounds the
            clarification-turn ceiling (AC1). The journey does not declare its own
            ceiling.
        emitsCapability:
          type: string
          description: The single capability a proposal journey may invoke. Observation
            journeys leave this absent.
        completionMode:
          $ref: '#/components/schemas/AssistedJourneyCompletionMode'
        navigationMode:
          allOf:
          - $ref: '#/components/schemas/AssistedJourneyNavigationMode'
          description: FREE permits navigation among dependency-ready steps; dependencies
            remain mandatory server-side.
        emission:
          allOf:
          - $ref: '#/components/schemas/AssistedJourneyEmission'
          description: 'What a PROPOSAL journey emits when its run completes: the
            contract kind, where it is written, the template that renders it, and
            the checks the collected fields must pass. Rego requires it of every PROPOSAL
            journey (canonical decision 15) -- without it the platform would have
            to recognise the journey by name to know what it produces, which is the
            dispatch this slot exists to remove.'
        steps:
          items:
            $ref: '#/components/schemas/AssistedJourneyStep'
          type: array
      additionalProperties: false
      type: object
      required:
      - journeyId
      - name
      - resourceBudgetRef
      - steps
      title: AssistedJourneySpec
    AssistedJourneyEmission:
      properties:
        targetKind:
          type: string
          description: The contract kind the emitted document declares. Must name
            a declared kind (Rego).
        identifier:
          $ref: '#/components/schemas/AssistedJourneyEmittedIdentifier'
        pathTemplate:
          type: string
          description: Where the document is written, with ${id} standing for the
            resolved identifier, e.g. `.jumo/teams/${id}.yml`.
        documentTemplateRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The DocumentTemplate that renders the document. Must resolve
            to a declared template rendering the same kind (Rego). Absent while a
            journey emits a document this vocabulary cannot yet describe -- the renderer
            refuses such an emission rather than guessing, and the journey keeps a
            named branch until a template can replace it, which is exactly what the
            boundary allowlist records.
        validations:
          items:
            $ref: '#/components/schemas/AssistedJourneyFieldValidation'
          type: array
          description: Field-level checks the collected payload must pass before anything
            is written.
        referenceChecks:
          items:
            $ref: '#/components/schemas/AssistedJourneyReferenceCheck'
          type: array
          description: Checks that a collected value names a contract that exists,
            so a journey never proposes a document pointing at nothing.
        fieldDefaults:
          items:
            $ref: '#/components/schemas/AssistedJourneyFieldDefault'
          type: array
          description: Values used when a field was not collected, so a template needs
            no conditional of its own.
        fieldConditions:
          items:
            $ref: '#/components/schemas/AssistedJourneyFieldCondition'
          type: array
          description: Fields the emitted document carries only under a declared condition.
            A template drops a key whose lone placeholder resolves to nothing, so
            a conditional key needs no template conditional of its own -- the condition
            removes the value and the existing absence rule removes the key. Applied
            after fieldDefaults, so a default never resurrects a field the condition
            has removed.
        collectionProjections:
          items:
            $ref: '#/components/schemas/AssistedJourneyCollectionProjection'
          type: array
          description: What a multivalued field contributes to the emitted document.
            A collected item may carry more than the contract needs, so the emitted
            item is a projection of it -- declared here rather than decided by the
            renderer, which is what keeps the emitted shape a contract fact.
        routingEligibilityCheck:
          allOf:
          - $ref: '#/components/schemas/AssistedJourneyRoutingEligibilityCheck'
          description: Refuses a proposal that would route work to a team the project
            did not declare eligible. A project with no declared eligibility constrains
            nothing, as RoutingEligibility itself is additive.
        booleanFields:
          items:
            type: string
          type: array
          description: 'Field names whose collected "true"/"false" string is coerced
            to a real YAML boolean before rendering. The platform compensates here
            rather than in the renderer: the generic step form has no boolean-aware
            widget yet (projection-field-options-resolution), so a BOOLEAN_FLAG-shaped
            value still arrives as free text.'
      additionalProperties: false
      type: object
      required:
      - targetKind
      - identifier
      - pathTemplate
      title: AssistedJourneyEmission
      description: 'The declarative replacement for a per-journey emission branch.
        Everything here is read by one generic renderer: nothing in it names a journey,
        and nothing outside it decides what a journey emits.'
    AssistedJourneyEmittedIdentifier:
      properties:
        fromField:
          type: string
        defaultValue:
          type: string
          description: Used when the field was not collected.
        suffix:
          $ref: '#/components/schemas/AssistedJourneyIdentifierSuffix'
      additionalProperties: false
      type: object
      required:
      - fromField
      title: AssistedJourneyEmittedIdentifier
      description: How the emitted document's identifier is derived from the run,
        always by slugifying one collected field rather than by a rule the platform
        keeps per journey.
    AssistedJourneyFieldValidation:
      properties:
        field:
          type: string
        required:
          type: boolean
        minimumLength:
          type: integer
          minimum: 1
        pattern:
          type: string
        minimumItems:
          type: integer
          minimum: 1
      additionalProperties: false
      type: object
      required:
      - field
      title: AssistedJourneyFieldValidation
    AssistedJourneyFieldCondition:
      properties:
        field:
          type: string
        whenField:
          type: string
          description: The collected or derived value the presence of `field` depends
            on.
        equalsValue:
          type: string
          description: '`field` is kept when `whenField` equals this value, and removed
            otherwise.'
      additionalProperties: false
      type: object
      required:
      - field
      - whenField
      - equalsValue
      title: AssistedJourneyFieldCondition
      description: One field of the emitted document and the collected value that
        decides whether it is present at all.
    AssistedJourneyReferenceCheck:
      properties:
        field:
          type: string
        kind:
          type: string
          description: The contract kind the value must name. Must be a declared kind
            (Rego).
        itemPath:
          type: string
          description: For a multivalued field, the key inside each item that carries
            the reference.
      additionalProperties: false
      type: object
      required:
      - field
      - kind
      title: AssistedJourneyReferenceCheck
    AssistedJourneyCollectionProjection:
      properties:
        field:
          type: string
        keys:
          items:
            type: string
          type: array
          description: The keys each emitted item carries, in the order the document
            declares them.
        optionalKeys:
          items:
            type: string
          type: array
          description: Keys carried only when the collected item supplies a non-blank
            value.
        itemValidations:
          items:
            $ref: '#/components/schemas/AssistedJourneyFieldValidation'
          type: array
          description: Checks applied to each item, naming a key of the item rather
            than a field of the payload.
        itemReferenceKind:
          type: string
          description: When the collected item is a plain reference id rather than
            an object (an ENTITY_COLLECTION field submits ids), the declared contract
            kind it names. Must be a declared kind (Rego). The resolved document supplies
            each declared key not already carried by the submission itself -- keys
            read spec.<key>, falling back to metadata.name -- so the emitted item
            never trusts a client-submitted facet the contract can resolve authoritatively
            instead.
      additionalProperties: false
      type: object
      required:
      - field
      - keys
      title: AssistedJourneyCollectionProjection
    AssistedJourneyRoutingEligibilityCheck:
      properties:
        projectField:
          type: string
        teamField:
          type: string
      additionalProperties: false
      type: object
      required:
      - projectField
      - teamField
      title: AssistedJourneyRoutingEligibilityCheck
    AssistedJourneyFieldDefault:
      properties:
        field:
          type: string
        value:
          type: string
          description: May itself interpolate ${id} or another collected field.
      additionalProperties: false
      type: object
      required:
      - field
      - value
      title: AssistedJourneyFieldDefault
    DocumentTemplate:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/DocumentTemplateBody'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: DocumentTemplate
      description: A YAML document with ${placeholder} scalars, rendered into the
        contract a journey proposes. The body is one string rather than a typed nesting
        because the shape it renders is the shape of whichever kind the journey emits
        -- the same reason a step payload with no generated class declares payloadSchemaRef
        against a raw JSON Schema (projection.yaml). Substitution happens after the
        body is parsed, so a placeholder standing alone as a value may be filled by
        a list or a mapping, not only by a scalar.
    DocumentTemplateBody:
      properties:
        renders:
          type: string
          description: The contract kind this template produces, checked against the
            emission that names it (Rego).
        body:
          type: string
          description: The YAML document, with ${placeholder} where a collected or
            derived value goes.
      additionalProperties: false
      type: object
      required:
      - renders
      - body
      title: DocumentTemplateBody
    AssistedJourneyStep:
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        personaNarration:
          type: string
        stepKind:
          allOf:
          - $ref: '#/components/schemas/AssistedJourneyStepKind'
          description: Required from the model-driven renderer onward (Rego).
        projectionSpecRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The ProjectionSpec this step renders. Its `of:` class is the
            step payload type, so the shape is derived rather than declared twice.
            Required on COLLECT and CONFIRM once stepKind is set (Rego).
        processSpecRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The ProcessSpec whose run an AWAIT step observes. Required
            on AWAIT once stepKind is set (Rego).
        promptTemplateRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The PromptTemplate this step uses when stepKind is DIALOGUE_COLLECT.
        subAssistedJourneyRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The AssistedJourney this step delegates to when stepKind is
            SUB_JOURNEY.
        verificationSpecRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: Generic real observation required before this step can advance.
        dependsOn:
          items:
            type: string
          type: array
          description: Step IDs that must be completed before this step becomes available.
        parallelizable:
          type: boolean
          description: Marks a dependency-ready step as part of a parallelizable work
            group in the renderer.
        image:
          type: string
          description: Step-level hero image, overriding the journey's heroImage for
            this step only. Falls back to AssistedJourneySpec.heroImage when absent.
            Not validated by the schema (same convention as heroImage) -- a kit-distributed
            asset once JumoKit exports binary assets (portability.yaml).
        descriptionI18nKey:
          type: string
          description: i18n key resolving this step's user-facing description. When
            present, takes precedence over the literal description string, which remains
            the fallback for journeys that have not been translated.
        narrationI18nKey:
          type: string
          description: i18n key resolving this step's personaNarration ("Nestor's
            voice"). Same fallback convention as descriptionI18nKey.
        requiredFields:
          items:
            type: string
          type: array
      additionalProperties: false
      type: object
      required:
      - id
      - name
      title: AssistedJourneyStep
      description: 'stepKind/projectionRef/processRef are additive: the model-driven
        rendering engine that consumes them does not exist yet, so requiredFields
        stays required and load-bearing -- JourneyService (control-plane) reads it
        server-side and apps/web/components/journey/JourneyRunner.vue reads it client-side.
        requiredFields is retired once every AssistedJourney step declares projectionRef/processRef
        and the renderer that replaces JourneyRunner.vue exists; until then both describe
        the same steps.'
    ActionCapabilitySet:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ActionCapabilitySetSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ActionCapabilitySet
      description: The security kernel. Capabilities are requested by an agent, authorized
        by policy and granted to a specific run or worker (canonical decisions 34-35).
        A capability not declared here cannot be requested, granted or used. Renamed
        from CapabilityDefinition.
    ActionCapabilitySetSpec:
      properties:
        capabilities:
          items:
            $ref: '#/components/schemas/ActionCapability'
          type: array
      additionalProperties: false
      type: object
      required:
      - capabilities
      title: ActionCapabilitySetSpec
    ActionCapability:
      properties:
        name:
          type: string
        description:
          type: string
          pattern: ^.{10,}$
        riskTier:
          $ref: '#/components/schemas/RiskTier'
        reversible:
          type: boolean
          description: Whether the effect can be inspected, corrected and undone.
            Kept alongside the newer EffectRecoveryKind (core.yaml) rather than replaced
            -- this boolean is the coarse policy-facing gate (irreversible needs stronger
            obligations); EffectRecoveryKind is the finer-grained recovery mechanism
            used where a specific capability's recovery path is modeled.
        producesExternalEffect:
          type: boolean
        maximumGrantDuration:
          type: string
        requiredObligations:
          items:
            $ref: '#/components/schemas/Obligation'
          type: array
        minimumAssurance:
          $ref: '#/components/schemas/AssuranceLevel'
        ringCeiling:
          allOf:
          - $ref: '#/components/schemas/Ring'
          description: Highest-blast-radius ring this capability may ever act on.
            Absent means the capability is bounded by policy and obligations alone.
        appliedBy:
          type: string
          description: The trusted component that applies the effect. Must not be
            the component that proposes it -- the prompt-injection boundary.
      additionalProperties: false
      type: object
      required:
      - name
      - description
      - riskTier
      - reversible
      title: ActionCapability
    PolicySet:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/PolicySetSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: PolicySet
      description: Executable authorization. Only policies allow, deny or impose obligations.
        Every action named here must resolve against the capability registry.
    PolicySetSpec:
      properties:
        scope:
          allOf:
          - $ref: '#/components/schemas/PolicyScope'
          description: A lower scope may restrict but never silently expand a higher
            one (canonical decision 65).
        rules:
          items:
            $ref: '#/components/schemas/PolicyRule'
          type: array
      additionalProperties: false
      type: object
      required:
      - rules
      title: PolicySetSpec
    PolicyRule:
      properties:
        id:
          type: string
        effect:
          $ref: '#/components/schemas/Effect'
        when:
          type: string
          description: Named structural condition evaluated by the policy engine.
            Free text is not permitted at evaluation time.
        actions:
          items:
            type: string
          type: array
        obligations:
          items:
            $ref: '#/components/schemas/Obligation'
          type: array
        reasonCode:
          type: string
          description: Sanitized code safe to expose across a Realm boundary (canonical
            decision 66).
      additionalProperties: false
      type: object
      required:
      - id
      - effect
      title: PolicyRule
      description: Conditional requiredness (ALLOW_WITH_OBLIGATIONS / REQUIRE_APPROVAL
        require obligations) moves to Rego.
    ImprovementLoop:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ImprovementLoopSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ImprovementLoop
      description: How a Project learns from its own finished work. Declares what
        is measured, which rhythm synthesizes the measurements, which corpus paths
        a recommendation may name, and how many may be open at once.
    ImprovementLoopSpec:
      properties:
        ownerRealm:
          type: string
        projectRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: One loop never reaches across Projects; that would be a delegation,
            not a rhythm.
        purpose:
          type: string
          pattern: ^.{10,}$
        measures:
          items:
            $ref: '#/components/schemas/ImprovementMeasure'
          type: array
        synthesisPracticeRef:
          $ref: '#/components/schemas/ContractReference'
        assessmentProcessSpecRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: Optional explicit ProcessSpec (execution.yaml).
        targets:
          items:
            $ref: '#/components/schemas/ImprovementTarget'
          type: array
        ceilings:
          $ref: '#/components/schemas/ImprovementCeilings'
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - projectRef
      - purpose
      - measures
      - synthesisPracticeRef
      - targets
      - ceilings
      title: ImprovementLoopSpec
    ImprovementTarget:
      properties:
        pathGlob:
          type: string
          pattern: ^[A-Za-z0-9._*-]+(/[A-Za-z0-9._*-]+)*$
          description: 'Path-traversal exclusion (`not: pattern ..\/`) moves to Rego.'
        ring:
          allOf:
          - $ref: '#/components/schemas/Ring'
          description: RING_0_ROOT_OF_TRUST exclusion moves to Rego.
        capabilityRef:
          type: string
        autonomy:
          $ref: '#/components/schemas/AutonomyLevel'
        mergeCapabilityRef:
          type: string
          description: Required when autonomy is BOUNDED_AUTONOMOUS (Rego).
        requiredObligations:
          items:
            $ref: '#/components/schemas/Obligation'
          type: array
      additionalProperties: false
      type: object
      required:
      - pathGlob
      - ring
      - capabilityRef
      - autonomy
      - requiredObligations
      title: ImprovementTarget
    ImprovementCeilings:
      properties:
        maximumOpenRecommendations:
          type: integer
          maximum: 50
          minimum: 1
        recommendationExpiry:
          type: string
        mayRaiseCorpusCeiling:
          type: boolean
      additionalProperties: false
      type: object
      required:
      - maximumOpenRecommendations
      - recommendationExpiry
      - mayRaiseCorpusCeiling
      title: ImprovementCeilings
    ImprovementRecommendation:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ImprovementRecommendationSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ImprovementRecommendation
      description: One actionable finding against a Project's corpus, in Git. Carries
        no authority of its own; reaches the corpus through the same proposal capabilities
        as any other change. Reclassified as runtime-only, alongside WorkOrder and
        AttentionItem, once a runtime store exists to demote into.
    ImprovementRecommendationSpec:
      properties:
        improvementLoopRef:
          $ref: '#/components/schemas/ContractReference'
        finding:
          type: string
          pattern: ^.{20,}$
        observedFrom:
          items:
            $ref: '#/components/schemas/ImprovementObservation'
          type: array
        targetPath:
          type: string
          pattern: ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$
        direction:
          $ref: '#/components/schemas/ImprovementDirection'
        state:
          $ref: '#/components/schemas/ImprovementState'
        rejectReason:
          $ref: '#/components/schemas/ImprovementRejectReason'
        changeProposalRef:
          type: string
          pattern: ^.{1,}$
        raisedAt:
          type: string
          format: date-time
        supersededBy:
          type: string
      additionalProperties: false
      type: object
      required:
      - improvementLoopRef
      - finding
      - observedFrom
      - targetPath
      - direction
      - state
      - raisedAt
      title: ImprovementRecommendationSpec
    ImprovementObservation:
      properties:
        measure:
          type: string
        value:
          type: string
          pattern: ^.{1,}$
        evidenceRef:
          type: string
          pattern: ^.{1,}$
      additionalProperties: false
      type: object
      required:
      - measure
      - evidenceRef
      title: ImprovementObservation
    AttentionItem:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/AttentionItemSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: AttentionItem
      description: The human-facing routing projection of something that wants a person.
        It is PostgreSQL recognized state (canonical decision 21), never a Git proposal
        or effect authority.
    AttentionItemSpec:
      properties:
        type:
          $ref: '#/components/schemas/AttentionType'
        source:
          $ref: '#/components/schemas/AttentionSource'
        target:
          $ref: '#/components/schemas/AttentionTarget'
        decisionRef:
          type: string
          pattern: ^.{1,}$
        decisionOptions:
          items:
            $ref: '#/components/schemas/AttentionDecisionOption'
          type: array
        classification:
          allOf:
          - $ref: '#/components/schemas/DataScope'
          description: Same enumeration as capability data access, retrieval and rendering
            (canonical decision 98).
        urgency:
          $ref: '#/components/schemas/AttentionUrgency'
        interruptibility:
          $ref: '#/components/schemas/AttentionInterruptibility'
        requestedResponse:
          $ref: '#/components/schemas/AttentionRequestedResponse'
        deliveryMode:
          $ref: '#/components/schemas/DeliveryMode'
        confidence:
          type: number
          maximum: 1
          minimum: 0
          format: float
          description: Confidence of the interpretation behind this item, not of the
            outcome it reports.
        admissionReason:
          allOf:
          - $ref: '#/components/schemas/AttentionAdmissionReason'
          description: Required on ADMISSION_REFUSED (Rego).
        relatedCommitments:
          items:
            type: string
          type: array
          pattern: ^.{1,}$
        evidenceRefs:
          items:
            type: string
          type: array
          pattern: ^.{1,}$
        occurredAt:
          type: string
          format: date-time
      additionalProperties: false
      type: object
      required:
      - type
      - source
      - target
      - classification
      - urgency
      - interruptibility
      - occurredAt
      title: AttentionItemSpec
    AttentionSource:
      properties:
        realmId:
          type: string
        projectId:
          type: string
        roleId:
          type: string
          description: The individual acting role this came from, never a team (ADR-0017).
            Absent on ADMISSION_REFUSED.
        episodeId:
          type: string
          pattern: ^.{1,}$
        journeyRunId:
          type: string
          pattern: ^.{1,}$
      additionalProperties: false
      type: object
      required:
      - realmId
      title: AttentionSource
    AttentionTarget:
      properties:
        realmRef:
          type: string
        subjectKind:
          $ref: '#/components/schemas/AttentionTargetSubjectKind'
        subjectRef:
          type: string
      additionalProperties: false
      type: object
      required:
      - realmRef
      - subjectKind
      - subjectRef
      title: AttentionTarget
    AttentionDecisionOption:
      properties:
        id:
          type: string
        label:
          type: string
          pattern: ^.{1,}$
        capabilityRef:
          type: string
      additionalProperties: false
      type: object
      required:
      - id
      - label
      title: AttentionDecisionOption
    ControlCatalog:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ControlCatalogSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ControlCatalog
      description: Internal controls, reusable across ComplianceProfiles (docs/concepts/positionnement-conceptuel.md#conformite-et-auditabilite-par-construction).
        Split out of the source GovernanceOverlay's inline `controls[]` array, so
        a control is declared once and mapped from many profiles rather than copy-pasted
        per referential.
    ControlCatalogSpec:
      properties:
        ownerRealm:
          type: string
        controls:
          items:
            $ref: '#/components/schemas/Control'
          type: array
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - controls
      title: ControlCatalogSpec
    Control:
      properties:
        controlId:
          type: string
          pattern: ^.{2,}$
        title:
          type: string
          pattern: ^.{3,}$
        category:
          type: string
          pattern: ^.{2,}$
        mandatoryObligations:
          items:
            $ref: '#/components/schemas/Obligation'
          type: array
      additionalProperties: false
      type: object
      required:
      - controlId
      - title
      - category
      title: Control
    ComplianceProfile:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ComplianceProfileSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ComplianceProfile
      description: 'A named referential (edition, official URI) and its mappings to
        a ControlCatalog (docs/concepts/positionnement-conceptuel.md#conformite-et-auditabilite-par-construction).
        Split out of GovernanceOverlay. Never recopies referential text -- identifiers,
        edition, and URI only. Carries the RGPD art. 30 processing register: a compliance
        profile scoped to data protection references the processing activities it
        covers, rather than inventing a separate kind for a register most Realms will
        attach to exactly one profile.'
    ComplianceProfileSpec:
      properties:
        ownerRealm:
          type: string
        frameworkName:
          type: string
          pattern: ^.{3,}$
        edition:
          type: string
          description: e.g. "2023", "2022" -- the referential's published edition,
            never its text.
        officialUri:
          type: string
          description: Stable URI to the official referential. No copyrighted text
            is stored here.
        status:
          $ref: '#/components/schemas/ComplianceStatus'
        controlCatalogRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The ControlCatalog this profile maps against.
        mappings:
          items:
            $ref: '#/components/schemas/ComplianceMapping'
          type: array
        processingRegister:
          items:
            $ref: '#/components/schemas/ProcessingRegisterEntry'
          type: array
          description: RGPD art. 30 register of processing activities this profile
            covers. Empty for non-privacy referentials.
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - frameworkName
      - status
      title: ComplianceProfileSpec
    ComplianceMapping:
      properties:
        controlRef:
          type: string
          description: References a Control.controlId in the linked ControlCatalog.
        referentialArticle:
          type: string
          description: e.g. an AI Act article number, an ISO clause number.
        draft:
          type: boolean
      additionalProperties: false
      type: object
      required:
      - controlRef
      title: ComplianceMapping
      description: Example mappings are marked DRAFT; no MAPPED or EVIDENCED status
        may be displayed as a certification claim (enforced in Rego, not here).
    ProcessingRegisterEntry:
      properties:
        activity:
          type: string
          pattern: ^.{5,}$
        purpose:
          type: string
          pattern: ^.{5,}$
        dataCategories:
          items:
            type: string
          type: array
        retention:
          type: string
        dpiaEvidenceProfileRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: References an EvidenceProfile carrying the DPIA (art. 35),
            when required.
      additionalProperties: false
      type: object
      required:
      - activity
      - purpose
      title: ProcessingRegisterEntry
      description: RGPD art. 30 register entry.
    EvidenceProfile:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/EvidenceProfileSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: EvidenceProfile
      description: The type, source, freshness, independence, and retention an assessment's
        evidence must meet. Split out of GovernanceOverlay. Carries the DPIA (RGPD
        art. 35) alongside the pre-existing evidence-quality fields -- an impact assessment
        is itself a form of evidence about the system, not a separate concept.
    EvidenceProfileSpec:
      properties:
        ownerRealm:
          type: string
        evidenceType:
          type: string
          pattern: ^.{2,}$
        source:
          type: string
          pattern: ^.{2,}$
        requiredFreshness:
          type: string
        requiredIndependence:
          $ref: '#/components/schemas/AssuranceLevel'
        retention:
          type: string
          description: How long this evidence must be kept, explicit rather than left
            implicit.
        claimCoverage:
          type: string
          description: 'What claim this evidence class actually supports: provenance
            volume alone is not proof (docs/concepts/positionnement-conceptuel.md#preuve-et-assurance).'
        method:
          type: string
        sourceDependence:
          type: string
        defeaters:
          items:
            type: string
          type: array
          description: Known conditions that would invalidate this evidence class.
        dpia:
          allOf:
          - $ref: '#/components/schemas/DataProtectionImpactAssessment'
          description: RGPD art. 35 impact assessment, when this evidence profile
            concerns personal data processing.
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - evidenceType
      - source
      title: EvidenceProfileSpec
    DataProtectionImpactAssessment:
      properties:
        necessityAndProportionality:
          type: string
          pattern: ^.{10,}$
        risksToDataSubjects:
          items:
            type: string
          type: array
        mitigations:
          items:
            type: string
          type: array
        assessedAt:
          type: string
          format: date
        reviewer:
          type: string
      additionalProperties: false
      type: object
      title: DataProtectionImpactAssessment
    ControlAssessment:
      properties:
        controlRef:
          type: string
        complianceProfileRef:
          type: string
        status:
          $ref: '#/components/schemas/ComplianceStatus'
        evidenceRefs:
          items:
            type: string
          type: array
        attestation:
          allOf:
          - $ref: '#/components/schemas/ExternalAttestation'
          description: Required when status is EXTERNALLY_ATTESTED (Rego).
        assessedAt:
          type: string
          format: date-time
      additionalProperties: false
      type: object
      required:
      - controlRef
      - complianceProfileRef
      - status
      title: ControlAssessment
      description: Recognized result of assessing a Control against a ComplianceProfile,
        with observed evidence. Runtime-only (PostgreSQL), not a Git contract kind
        -- no apiVersion/kind wrapper. No CERTIFIED or CONFORMANT status without external
        attestation, evaluator identity, and a validity period (enforced in Rego).
    ExternalAttestation:
      properties:
        evaluatorIdentity:
          type: string
        validFrom:
          type: string
          format: date
        validUntil:
          type: string
          format: date
        attestationRef:
          type: string
      additionalProperties: false
      type: object
      required:
      - evaluatorIdentity
      - validFrom
      - validUntil
      title: ExternalAttestation
    ProcessSpec:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ProcessSpecBody'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ProcessSpec
      description: 'A durable process: a graph of typed steps and flows, compiled
        to a Temporal Workflow and projected to BPMN 2.0 XML for audit and rendering.
        A Temporal Workflow normally corresponds to an Episode (canonical decision
        39, unchanged by this redesign).'
    ProcessSpecBody:
      properties:
        ownerRealm:
          type: string
        projectRef:
          $ref: '#/components/schemas/ContractReference'
        processId:
          type: string
        processVersion:
          type: string
          pattern: ^\d+\.\d+\.\d+$
        inputType:
          type: string
        outputType:
          type: string
        startTrigger:
          $ref: '#/components/schemas/ProcessStartTrigger'
        timerDelay:
          type: string
          description: Required only for TIMER starts; ISO-8601 duration rather than
            cron.
        steps:
          items:
            $ref: '#/components/schemas/ProcessStep'
          type: array
          description: Must include exactly one START and at least one END (Rego).
        flows:
          items:
            $ref: '#/components/schemas/ProcessFlow'
          type: array
        durability:
          $ref: '#/components/schemas/ProcessDurability'
        stageWorkerRequirementRef:
          items:
            $ref: '#/components/schemas/ProcessStageWorkerRequirement'
          type: array
          description: Task requirements per model-using step (source schema's open
            string-keyed map, modeled as key/value pairs -- see ThemePack for the
            same pattern). Every key must name a declared step and every value resolves
            to a WorkerRequirementProfile (Rego).
        resourceBudgetRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: ResourceBudget governing this process.
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - projectRef
      - processId
      - processVersion
      - inputType
      - outputType
      - startTrigger
      - steps
      - flows
      title: ProcessSpecBody
    ProcessStep:
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/ProcessStepKind'
        semanticStage:
          allOf:
          - $ref: '#/components/schemas/ProcessStepSemanticStage'
          description: The WorkflowDeclaration-era stage this step corresponds to,
            where applicable.
        capabilityRef:
          type: string
          description: Required on a SERVICE step (Rego); must resolve in an ActionCapabilitySet.
        ring:
          allOf:
          - $ref: '#/components/schemas/Ring'
          description: Must not exceed the ringCeiling of capabilityRef's ActionCapability
            (Rego).
        idempotencyKey:
          type: string
          description: Required on a SERVICE step whose capability producesExternalEffect
            (Rego).
        opaEntrypoint:
          type: string
          pattern: ^[a-z][a-z0-9_.]*$
          description: 'Required on a GATEWAY step (Rego): the Rego rule the ProcessSpec
            compiler wires as the decision selecting this gateway''s outgoing branch.'
        terminalState:
          allOf:
          - $ref: '#/components/schemas/ProcessTerminalState'
          description: Required on END and forbidden elsewhere.
        signalType:
          type: string
          description: Required on USER and MESSAGE signals; resolves to a generated
            LinkML class.
        gatewayMode:
          $ref: '#/components/schemas/ProcessGatewayMode'
        gatewayRole:
          $ref: '#/components/schemas/ProcessGatewayRole'
        pairedGatewayRef:
          type: string
        loopMaximum:
          type: integer
          maximum: 100
          minimum: 1
        fallbackFlowRef:
          type: string
        subprocessReleaseRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The exact ProcessSpec release this SUBPROCESS step invokes
            (Rego required-on-SUBPROCESS check in execution.rego; must resolve, see
            references.rego).
        compensationForStepRef:
          type: string
      additionalProperties: false
      type: object
      required:
      - id
      - kind
      title: ProcessStep
      description: 'One node in the process graph. inputType/outputType/capabilityRef/opaEntrypoint
        are used selectively by kind: a GATEWAY step names opaEntrypoint (the OPA
        decision that selects its outgoing flow); a SERVICE step names capabilityRef
        and inputType/outputType; a TIMER START step carries the schedule fields Practice.processSpecRef
        (work.yaml) points at. Which fields apply to which kind is a Rego invariant,
        not encoded structurally here -- LinkML has no tagged-union/discriminated-class
        construct clean enough to justify one ProcessStep subclass per kind for what
        is otherwise one shape.'
    ProcessFlow:
      properties:
        id:
          type: string
        from:
          type: string
          description: A ProcessStep id in this same ProcessSpec.
        to:
          type: string
          description: A ProcessStep id in this same ProcessSpec.
        branchLabel:
          type: string
          description: Required when `from` names a GATEWAY step with more than one
            outgoing flow (Rego).
        payloadType:
          type: string
          description: A generated LinkML class name; every edge carries an explicit
            typed payload.
      additionalProperties: false
      type: object
      required:
      - id
      - from
      - to
      - payloadType
      title: ProcessFlow
