apiVersion: jumo.dev/v1
kind: AssistedJourney
metadata:
  id: import-skill
  namespace: dev.jumo.core
  name: Importer une competence (Kit)
spec:
  journeyId: import-skill
  name: Importer une competence (Kit)
  summaryI18nKey: importSkillSummary
  description: Importez un kit externe contenant des competences, parcours et artefacts complementaires.
  category: extension
  icon: package-variant-closed
  interruptible: true
  concurrencyPolicy: MULTIPLE_ACTIVE_RUNS
  requiredCapabilities: [journey.run.start, journey.run.read, journey.run.abandon, journey.step.select, journey.step.submit, journey.proposal.submit, contract.change.propose]
  policySetRefs: [{kind: PolicySet, namespace: dev.jumo.core, id: security-baseline}]
  emitsCapability: contract.change.propose
  emission:
    targetKind: KitBinding
    identifier: {fromField: alias}
    pathTemplate: .jumo/kit-bindings/${id}.yml
    documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: kit-binding}
    validations:
      - {field: alias, required: true}
      - {field: repository, required: true}
      - {field: commit, required: true, pattern: '^[0-9a-fA-F]{40}$'}
  steps:
    - id: declare-kit
      requiredObligations: []
      name: Declaration du kit
      description: Renseignez l'alias local, l'URL du depot Git et le commit SHA du kit.
      personaNarration: Indiquez la source Git du kit de competences a importer dans votre Realm.
      stepKind: COLLECT
      requiredFields:
        - {field: alias, i18nKey: journeySkillAliasField}
        - {field: repository, i18nKey: journeySkillRepositoryField}
        - {field: commit, i18nKey: journeySkillCommitField}
      projectionSpecRef:
        kind: ProjectionSpec
        namespace: dev.jumo.core
        id: import-skill
    - id: confirm-kit
      requiredObligations: []
      name: Confirmation
      description: Validez l'importation et l'enregistrement de la liaison du kit.
      personaNarration: Verifions la declaration du kit avant son emission declarative.
      stepKind: COLLECT
      requiredFields:
        - {field: confirmed, i18nKey: journeyConfirmField}
      projectionSpecRef:
        kind: ProjectionSpec
        namespace: dev.jumo.core
        id: summary-and-activate
  resourceBudgetRef:
    kind: ResourceBudget
    namespace: dev.jumo.core
    id: interactive
