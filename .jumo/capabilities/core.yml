apiVersion: jumo.dev/v1
kind: ActionCapabilitySet
metadata:
  id: core
  namespace: dev.jumo.core
  name: Pilot capability registry
spec:
  capabilities:
    - name: interface.manifest.read
      description: Read the authenticated Realm's declared pilot interface manifest.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: repository.content.read
      description: Read the release-pinned pilot corpus within the authenticated Realm.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: document.content.read
      description: Read governed Markdown without widening its declared audience.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: change.status.read
      description: Read Realm-scoped proposal and forge projection status.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: change.review
      description: Record an independent review result without approving, merging, or applying effects.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: model.document.draft
      description: Send one owner-approved, hash-bound governed document to a declared model provider for a draft.
      riskTier: MEDIUM
      reversible: false
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: conversation.turn.submit
      description: Submit one creator-private Nestor conversation turn without tools or external effects.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: journey.run.start
      description: Start one declared AssistedJourney run for the authenticated Realm principal.
      riskTier: LOW
      reversible: true
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: journey.run.read
      description: Read one owned AssistedJourney run and its sanitized execution state.
      riskTier: LOW
      reversible: true
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: journey.run.abandon
      description: Abandon one interruptible owned AssistedJourney run without applying its proposal.
      riskTier: MEDIUM
      reversible: false
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: journey.step.select
      description: Select one dependency-ready step in a declared free-navigation AssistedJourney.
      riskTier: LOW
      reversible: true
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: journey.step.submit
      description: Submit bounded fields or a conversational turn to the current declared journey step.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: journey.proposal.submit
      description: Admit a completed AssistedJourney run to its separately authorized proposal emission checkpoint.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: provider.account.observe
      description: Perform one bounded, credential-custodied model-catalog observation for a declared ProviderAccount without changing its routing contract.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: provider.account.qualify
      description: Perform one bounded, token-consuming live inference call per declared effort rung for a declared ProviderAccount, spending real provider quota.
      riskTier: MEDIUM
      reversible: true
      producesExternalEffect: true
      requiredObligations:
        - HUMAN_OWNER_APPROVAL
        - RETAIN_PROVENANCE
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: contract.change.propose
      description: Record a validated, hash-bound role-contract proposal for separate owner approval and forge projection.
      riskTier: MEDIUM
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - RETAIN_PROVENANCE
        - STEP_UP_AUTHENTICATION
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
      appliedBy: jumo.effect.ForgeProposalApplier
    - name: document.change.propose
      description: Record a hash-bound pilot document proposal for isolated forge projection.
      riskTier: MEDIUM
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - RETAIN_PROVENANCE
      minimumAssurance: OBSERVED
      appliedBy: jumo.effect.ForgeProposalApplier
    - name: capability.grant.acquire
      description: Acquire a run-bound, revocable five-minute capability grant with retained provenance.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: execution.cell.vm.provision
      description: Create a Realm-owned hosted-VM execution cell shell on an owner-unlocked encrypted volume, pending guest
        hardening and its certificate ceremony.
      riskTier: HIGH
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - STEP_UP_AUTHENTICATION
        - HUMAN_OWNER_APPROVAL
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
      appliedBy: jumo.effect.ExecutionCellProvisioningApplier
    - name: execution.cell.certificate.ceremony
      description: Perform one host or guest step of the three-party mTLS certificate ceremony that seals a hosted execution
        cell's local credential custody.
      riskTier: HIGH
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - STEP_UP_AUTHENTICATION
        - HUMAN_OWNER_APPROVAL
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
      appliedBy: jumo.effect.ExecutionCellProvisioningApplier
    - name: execution.cell.pair.confirm
      description: Confirm one pending Realm execution cell after fresh owner step-up and local pairing-code proof.
      riskTier: HIGH
      reversible: false
      requiredObligations:
        - STEP_UP_AUTHENTICATION
        - HUMAN_OWNER_APPROVAL
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: connector.appraisal.record
      description: Record a typed connector appraisal without admitting an unreviewed connector.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
    - name: attention.item.publish
      description: Publish a typed attention item to the owner without granting effect authority.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: attention.item.read
      description: Read the authenticated principal's Realm-scoped open attention routing items.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: notification.email.send
      description: Send one declared transactional or attention email to a Realm principal through the platform's SMTP transport, carrying no secret or conversation transcript.
      riskTier: MEDIUM
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - RETAIN_PROVENANCE
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: notification.push.send
      description: Send one declared Web Push notification to a Realm principal's subscribed browser via VAPID, carrying no secret or conversation transcript.
      riskTier: MEDIUM
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - RETAIN_PROVENANCE
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: project.create
      description: Record a validated, hash-bound project declaration proposal for separate owner approval and forge projection.
      riskTier: MEDIUM
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - RETAIN_PROVENANCE
        - STEP_UP_AUTHENTICATION
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
      appliedBy: jumo.effect.ForgeProposalApplier
    - name: account.profile.read
      description: Read the authenticated principal's own account profile (display name, avatar metadata).
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: account.profile.update
      description: Update the authenticated principal's own display name or avatar.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
    - name: account.delete
      description: Hard-delete the authenticated principal's own Postgres-resident data (profile, conversations, proposals,
        journey runs, model drafts) and sever their identity from the retained audit trail. Self-service by design -- unlike
        the other HIGH capabilities here, no HUMAN_OWNER_APPROVAL is required, since a principal deleting their own account
        needs no one else's sign-off.
      riskTier: HIGH
      reversible: false
      requiredObligations:
        - STEP_UP_AUTHENTICATION
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: account.theme.preference.propose
      description: Record a hash-bound proposal changing the authenticated principal's own declared
        theme preference (portable-theme-runtime-and-preference) for isolated forge projection.
      riskTier: LOW
      reversible: true
      producesExternalEffect: true
      requiredObligations:
        - RETAIN_PROVENANCE
      minimumAssurance: OBSERVED
      appliedBy: jumo.effect.ForgeProposalApplier
    - name: team.roster.read
      description: Read team composition, roles, and independence groups within the authenticated Realm.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: team.hub.read
      description: Read the atomic collective, advisor, coordination and sanitized grant projection for the authenticated Realm.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: conversation.turn.respond
      description: Record a response to an addressed conversation only from the role's bound human principal.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
    - name: conversation.coordinate.read
      description: Read a conversation transcript only for an explicitly authorized coordination invocation.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
    - name: capability.grant.read
      description: Read sanitized recognized capability grant lifecycle state without token, arguments, result or secret.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: work.order.read
      description: Read declared work orders, execution rings, and acceptance criteria within the authenticated Realm.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: work.order.propose
      description: Record a validated, hash-bound work order proposal for separate role assignment and forge execution.
      riskTier: MEDIUM
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - RETAIN_PROVENANCE
        - STEP_UP_AUTHENTICATION
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
      appliedBy: jumo.effect.ForgeProposalApplier
    - name: context.graph.read
      description: Read composed 2-hop contextual graph nodes, edges, and state overlays for any corpus entity.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: organization.governance.read
      description: Read an admitted Organization's governance contracts, composition, and retention policy without gaining
        access to any member Realm's data or effects.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: audit.history.read
      description: Read the sanitized, paginated audit history within an independently authorized Organization or Realm scope.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: organization.governance.propose
      description: Record an owner-authorized, typed Organization Git proposal draft for separate validation, approval, and
        application.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
    - name: organization.realm.provision.request
      description: Queue an admitted identity's nickname for a bounded trusted Realm provisioner; the request itself creates
        no Realm, federation, or effect authority.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
    - name: machine.read
      description: Read execution machines, observations, and runtime installations.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: machine.administer
      description: Dispatch signed Ansible admin playbook to a machine.
      riskTier: HIGH
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - STEP_UP_AUTHENTICATION
        - HUMAN_OWNER_APPROVAL
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
      appliedBy: jumo.effect.ExecutionCellProvisioningApplier
    - name: system.effect.execute
      description: Dispatch an ADR-0056 root script to an opted-in USER_PROVIDED machine's
        transient systemd unit.
      riskTier: HIGH
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - STEP_UP_AUTHENTICATION
        - HUMAN_OWNER_APPROVAL
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
      appliedBy: jumo.machineagent.workload.SystemEffectWorkloadDriver
    - name: cli.runtime.install
      description: Dispatch the signed Ansible install-cli playbook to install a qualified CLI runtime on a machine.
      riskTier: HIGH
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - STEP_UP_AUTHENTICATION
        - HUMAN_OWNER_APPROVAL
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
      appliedBy: jumo.effect.ExecutionCellProvisioningApplier
    - name: cli.session.pair
      description: Dispatch the signed Ansible pair-cli-session playbook to run a device-login ceremony inside the pinned CLI image on a machine.
      riskTier: HIGH
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - STEP_UP_AUTHENTICATION
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
      appliedBy: dev.jumo.controlplane.web.CliSessionService
    - name: cli.session.smoke
      description: Dispatch the signed Ansible smoke-cli-session playbook to run one minimal authenticated request using the machine-local CLI session state.
      riskTier: HIGH
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - STEP_UP_AUTHENTICATION
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
      appliedBy: dev.jumo.controlplane.web.CliSessionService
    - name: cli.session.pair.observe
      description: Confirm a previously-dispatched device-login ceremony was observed on the machine, without dispatching or re-authorizing the ceremony itself.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: cli.session.smoke.observe
      description: Confirm a previously-dispatched CLI smoke-test outcome was observed on the machine, without dispatching or re-authorizing the smoke test itself.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: machine.drain
      description: Drain execution machine for maintenance.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: machine.revoke
      description: Revoke execution machine certificate and access.
      riskTier: HIGH
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - STEP_UP_AUTHENTICATION
        - HUMAN_OWNER_APPROVAL
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: cli.read
      description: Read declared CLI tools and releases.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: quota.read
      description: Read provider quota observations.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: connector.read
      description: Read connector packages and integrations.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: connector.test
      description: Execute connector verification test plan on a machine.
      riskTier: MEDIUM
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - STEP_UP_AUTHENTICATION
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: mcp.catalog.read
      description: Read the platform MCP catalog projection without installing, executing, or granting anything.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: mcp.elicitation.consent.read
      description: Read pending and recently resolved MCP elicitation consent requests for a Realm-owned lease.
      riskTier: LOW
      reversible: true
      minimumAssurance: SELF_REPORTED
    - name: mcp.elicitation.consent.resolve
      description: Accept or decline one pending MCP elicitation consent request, unblocking the gateway's own blocking wait for it.
      riskTier: MEDIUM
      reversible: false
      requiredObligations:
        - HUMAN_OWNER_APPROVAL
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: mcp.oauth.initiate
      description: Build a discovery-validated, PKCE-bound authorization URL for one Realm-owned McpServerBinding's OAuth ceremony, without reaching the external authorization server.
      riskTier: LOW
      reversible: true
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: mcp.oauth.complete
      description: Exchange a single-use authorization code for OAuth tokens against a live external authorization server and land them in OpenBao, completing one McpServerBinding's ceremony.
      riskTier: MEDIUM
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - RETAIN_PROVENANCE
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: gmail.message.search
      description: Search the authenticated Realm principal's Gmail with a typed query and return only a bounded header projection, never a message body.
      riskTier: LOW
      reversible: true
      minimumAssurance: OBSERVED
    - name: gmail.message.read
      description: Read one Gmail message body, by an id previously returned to the same caller by gmail.message.search only.
      riskTier: LOW
      reversible: true
      minimumAssurance: OBSERVED
    - name: calendar.list.read
      description: List the authenticated Realm principal's own owner-owned Google Calendar calendars, excluding calendars merely shared with them.
      riskTier: LOW
      reversible: true
      minimumAssurance: OBSERVED
    - name: effect.batch.read
      description: Read one EffectBatch's canonical display projection, including its decrypted arguments until purged on terminal closure.
      riskTier: MEDIUM
      reversible: true
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: effect.batch.approve
      description: Bind one owner approval to an EffectBatch's exact recomputed canonical lines digest, without dispatching it.
      riskTier: MEDIUM
      reversible: false
      requiredObligations:
        - HUMAN_OWNER_APPROVAL
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
    - name: effect.batch.apply
      description: Dispatch every approved line of a previously owner-approved EffectBatch through its reconciled connector applier.
      riskTier: HIGH
      reversible: false
      producesExternalEffect: true
      requiredObligations:
        - STEP_UP_AUTHENTICATION
      minimumAssurance: OBSERVED
      ringCeiling: RING_1_CONTROL_PLANE
      appliedBy: dev.jumo.controlplane.capability.EffectBatchApplierService
