apiVersion: jumo.dev/v1
kind: ProjectionSpec
metadata:
  id: provider-credential-ingress
  namespace: dev.jumo.core
  name: Provider credential ingress
spec:
  ownerRealm: home
  payloadSchemaRef: configure-provider-keys
  projectionKind: FORM
  renderedBy: home
  sections:
    - id: ingress
      i18nKey: journeyProviderIngressSection
      columns: 1
      fields:
        - path: providerAccountRef
          representation: ENTITY_REFERENCE
          optionsFrom: ProviderAccount
          i18nKey: journeyProviderAccountField
          required: true
        - path: providerCredential
          representation: SECRET
          i18nKey: journeyProviderCredentialField
          helpI18nKey: journeyProviderCredentialHelp
