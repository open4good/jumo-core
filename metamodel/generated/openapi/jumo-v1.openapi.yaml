      additionalProperties: false
      type: object
      required:
      - minimumPayingCustomers
      - minimumCycles
      - minimumRenewals
      - minimumDirectMarginPercent
      - maximumMedianSupportMinutesPerCustomerMonth
      title: OfferingValidation
    RoleDefinition:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/RoleDefinitionSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: RoleDefinition
      description: A stable Realm-owned acting role carrying a mission. Its bearer
        is declared separately by RoleAssignment; neither declaration grants authority.
        Renamed from Operator.
    RoleDefinitionSpec:
      properties:
        ownerRealm:
          type: string
        mission:
          type: string
          pattern: ^.{10,}$
        roleKey:
          type: string
          pattern: ^[a-z][A-Za-z0-9]*$
          description: Optional decorative ThemePack lookup key. Never replaces metadata.id.
        isMetaRole:
          type: boolean
          description: When true, this role acts on behalf of a Jumo Control Plane
            or Child Realm.
        delegatedRealmRef:
          type: string
          description: Optional child or target Realm governed by this meta-role.
        independenceGroup:
          type: string
          description: A role's own separation-of-duties group. Two roles sharing
            one group may not jointly produce and verify the same WorkOrder (governance.rego
            distinct_independence_groups); absent for a meta-role (Nestor, Owner)
            that is never itself a team roster candidate.
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - mission
      title: RoleDefinitionSpec
    AgentDefinition:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/AgentDefinitionSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: AgentDefinition
      description: Reusable, portable agent behavior. Requests capabilities; never
        grants them. Renamed from AgentArchetype.
    AgentDefinitionSpec:
      properties:
        responsibilities:
          items:
            type: string
          type: array
          pattern: ^.{5,}$
        requestedCapabilities:
          items:
            type: string
          type: array
          description: A request, not a grant. Policy decides.
        prohibitedAuthority:
          items:
            $ref: '#/components/schemas/ProhibitedAuthority'
          type: array
        defaultAutonomy:
          $ref: '#/components/schemas/AutonomyLevel'
        modificationRing:
          $ref: '#/components/schemas/Ring'
      additionalProperties: false
      type: object
      required:
      - responsibilities
      - requestedCapabilities
      - prohibitedAuthority
      title: AgentDefinitionSpec
    RoleAssignment:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/RoleAssignmentSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: RoleAssignment
      description: Git-declared bearer of one stable role. Selects responsibility
        and provenance only; Membership, policy and grants remain required for every
        act. Renamed from OperatorAssignment.
    RoleAssignmentSpec:
      properties:
        ownerRealm:
          type: string
        roleDefinitionRef:
          $ref: '#/components/schemas/ContractReference'
        bearer:
          $ref: '#/components/schemas/RoleBearer'
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - roleDefinitionRef
      - bearer
      title: RoleAssignmentSpec
    RoleBearer:
      properties:
        kind:
          $ref: '#/components/schemas/BearerKind'
        principalRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: Required when kind is HUMAN.
        agentDefinitionRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: Required when kind is AGENT.
        defaultWorkerRequirementProfileRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: Optional, only meaningful when kind is AGENT.
        federatedPeerRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: Required when kind is FEDERATED_PEER. Names the FederatedPeer
            contract.
        remoteRoleKey:
          type: string
          description: Optional remote role identifier in the peer realm.
      additionalProperties: false
      type: object
      required:
      - kind
      title: RoleBearer
      description: Discriminated union (HUMAN | AGENT | FEDERATED_PEER) in the source
        schema. LinkML has no native discriminated union at the attribute level; modeled
        as one class with branch fields optional. Which fields are required for which
        `kind` moves to Rego, same disposition as every other conditional-requiredness
        invariant here.
    TeamSpec:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/TeamSpecBody'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: TeamSpec
      description: A Realm-owned composition of roles and nested teams. Coordinates
        eligible roles but grants no data access, capability or effect authority.
        Renamed from OperatorTeam.
    TeamSpecBody:
      properties:
        ownerRealm:
          type: string
        purpose:
          type: string
          pattern: ^.{10,}$
        roleKey:
          type: string
          pattern: ^[a-z][A-Za-z0-9]*$
        coordination:
          allOf:
          - $ref: '#/components/schemas/TeamCoordination'
          description: The managed dependency, not the team, is the unit of analysis
            (docs/concepts/positionnement-conceptuel.md#coordination-des-dependances).
            The source schema forced one `mode` for the whole team; this carries one
            or more CoordinationMechanismBinding entries instead, each scoped to the
            dependency it governs.
        members:
          items:
            $ref: '#/components/schemas/TeamMember'
          type: array
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - purpose
      - coordination
      - members
      title: TeamSpecBody
    TeamCoordination:
      properties:
        mechanisms:
          items:
            $ref: '#/components/schemas/CoordinationMechanismBinding'
          type: array
        leadRoleDefinitionRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: Required when any mechanism binding uses DIRECT_SUPERVISION;
            must resolve to a role leaf of this team. Conditional requiredness moves
            to Rego.
      additionalProperties: false
      type: object
      required:
      - mechanisms
      title: TeamCoordination
    CoordinationMechanismBinding:
      properties:
        mechanism:
          $ref: '#/components/schemas/CoordinationMechanism'
        dependencyKind:
          type: string
          description: 'Open vocabulary naming the managed dependency (e.g. resource-sharing,
            prerequisite, simultaneity, decomposition -- Malone & Crowston''s categories).
            Not an enum: the catalog of dependency kinds is expected to grow with
            experience, and closing it here would recreate the single-mode rigidity
            this redesign removes.'
        phase:
          type: string
          description: Open vocabulary naming the work phase this binding applies
            to.
        riskTier:
          type: string
          description: Open vocabulary; aligns with ActionCapabilitySet's riskTier
            where relevant.
      additionalProperties: false
      type: object
      required:
      - mechanism
      title: CoordinationMechanismBinding
      description: One coordination mechanism scoped to the dependency it actually
        governs, replacing a single team-wide mode (docs/concepts/positionnement-conceptuel.md#coordination-des-dependances).
        Shared by TeamSpec and CoordinationProfile so a team's inline coordination
        and a reusable named profile speak the same vocabulary.
    CoordinationProfile:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/CoordinationProfileSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: CoordinationProfile
      description: 'A named, reusable coordination profile: authorized mechanisms,
        target dependencies, rhythm, and preconditions for team coordination. Distinct
        from TeamSpec.coordination (inline, per-team) -- a CoordinationProfile is
        declared once and referenced by name from multiple teams or improvement-loop
        targets, while TeamSpec.coordination is that team''s own binding. Already
        used mechanisms[] in the source schema (unlike TeamSpec''s single `mode`),
        so this class''s mechanisms list was not itself the redesign target -- it
        gains the same CoordinationMechanismBinding shape as TeamSpec for vocabulary
        consistency, replacing what was a flat CoordinationMechanism list.'
    CoordinationProfileSpec:
      properties:
        ownerRealm:
          type: string
        profileName:
          $ref: '#/components/schemas/CoordinationProfileName'
        reversibility:
          $ref: '#/components/schemas/Reversibility'
        maxRing:
          $ref: '#/components/schemas/Ring'
        assuranceLevel:
          $ref: '#/components/schemas/AssuranceLevel'
        mechanisms:
          items:
            $ref: '#/components/schemas/CoordinationMechanismBinding'
          type: array
        rhythm:
          type: string
        preconditions:
          items:
            type: string
          type: array
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - profileName
      - reversibility
      - maxRing
      - assuranceLevel
      - mechanisms
      title: CoordinationProfileSpec
    TeamMember:
      properties:
        roleDefinitionRef:
          $ref: '#/components/schemas/ContractReference'
        teamSpecRef:
          $ref: '#/components/schemas/ContractReference'
        role:
          type: string
          pattern: ^.{3,}$
        independenceGroup:
          type: string
      additionalProperties: false
      type: object
      title: TeamMember
      description: Discriminated union (roleMember | teamMember) in the source schema.
        Modeled as one class; exactly one of roleDefinitionRef/teamSpecRef is expected
        (Rego).
    RoutingEligibility:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/RoutingEligibilitySpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: RoutingEligibility
      description: A desired routing eligibility relation between roles or teams and
        a Project. Teams flatten to their role leaves. Never grants data access, capabilities
        or effect authority. Renamed from OperatorBinding.
    RoutingEligibilitySpec:
      properties:
        ownerRealm:
          type: string
        projectRef:
          $ref: '#/components/schemas/ContractReference'
        eligibleRoleDefinitionRefs:
          items:
            $ref: '#/components/schemas/ContractReference'
          type: array
        eligibleTeamSpecRefs:
          items:
            $ref: '#/components/schemas/ContractReference'
          type: array
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - projectRef
      title: RoutingEligibilitySpec
    RoleLifecyclePolicy:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/RoleLifecyclePolicySpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: RoleLifecyclePolicy
      description: Onboarding policy and evaluation criteria for roles. Renamed from
        OperatorLifecyclePolicy -- kept as its own class, not absorbed into RoleDefinition.
    RoleLifecyclePolicySpec:
      properties:
        ownerRealm:
          type: string
        shadowEpisodesRequired:
          type: integer
          minimum: 0
        boundedTrialEpisodesRequired:
          type: integer
          minimum: 1
        maxTrialDurationDays:
          type: integer
          minimum: 1
        evaluationCriteria:
          items:
            type: string
          type: array
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - shadowEpisodesRequired
      - boundedTrialEpisodesRequired
      - maxTrialDurationDays
      - evaluationCriteria
      title: RoleLifecyclePolicySpec
    OrganizationTemplate:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/OrganizationTemplateSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: OrganizationTemplate
      description: Parametric package of roles, teams, profiles, and lifecycle. Contains
        no grant. Renamed from OrganizationBlueprint -- the name OrganizationSpec
        is reserved for the composite class in work.yaml.
    OrganizationTemplateSpec:
      properties:
        ownerRealm:
          type: string
        blueprintName:
          type: string
          pattern: ^.{3,}$
        roles:
          items:
            type: string
          type: array
        teams:
          items:
            type: string
          type: array
        profiles:
          items:
            type: string
          type: array
        roleLifecyclePolicyRef:
          $ref: '#/components/schemas/ContractReference'
        methodologySource:
          $ref: '#/components/schemas/MethodologySource'
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - blueprintName
      - methodologySource
      title: OrganizationTemplateSpec
    MethodologySource:
      properties:
        name:
          type: string
          pattern: ^.{2,}$
        complianceLevel:
          $ref: '#/components/schemas/MethodologyComplianceLevel'
      additionalProperties: false
      type: object
      required:
      - name
      - complianceLevel
      title: MethodologySource
    ChiefOfStaffProfile:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ChiefOfStaffProfileSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ChiefOfStaffProfile
      description: Configures a Chief-of-Staff role's attention loop and work disposition.
        Selects a responsible role and interaction timing; grants no authority.
    ChiefOfStaffProfileSpec:
      properties:
