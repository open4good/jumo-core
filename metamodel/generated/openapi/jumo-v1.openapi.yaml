            of this record, for a COMPLETED WorkOrder compacted into .jumo/work/ledger/.
            Set by scripts/migrate/compact-completed-work.py, never by hand.
        consumption:
          $ref: '#/components/schemas/ConsumptionReport'
        resourceBudgetRef:
          $ref: '#/components/schemas/ContractReference'
