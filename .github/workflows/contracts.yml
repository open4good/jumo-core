name: contracts

# jumo-core is the declarative PLATFORM corpus: no application beyond the one Java artifact its
# own metamodel generates. The `contracts` job wires metamodel-and-policy-to-core AC1's four
# checks -- LinkML semantic lint, opa check/test, the corpus budget and the metamodel/platform
# boundary -- so jumo-core validates its own contract authoring before jumo pins a revision of it.
# `metamodel` proves modules/jumo-model/src/main/java is reproducible from metamodel/jumo-v1.yaml,
# the same gate jumo's own corpus-validate.yml runs on itself. `publish-jumo-model` (AC2) is the
# one place this repository builds and ships code: dev.jumo:jumo-model to GitHub Packages, so jumo
# depends on it instead of generating it in-tree. Corpus-instance validation (WorkOrders,
# journeys, the composed negative fixtures) stays jumo's job in corpus-validate.yml, against its
# own tree.
#
# Every job runs on ubuntu-latest, not on the org's self-hosted runners as jumo's workflows do.
# jumo-core is the only one of the three repositories that is public, and the org's single runner
# group (Default) sets allows_public_repositories: false, so a public repository is assigned no
# self-hosted runner at all: jobs sit queued forever with a correct label set and an empty
# runner_name. Enabling public repositories on that group would be the other remedy, but this
# workflow declares `on: pull_request`, which would expose the owner's own machines to fork pull
# requests. GitHub-hosted minutes are free for a public repository, and every step here is
# portable: docker for the pinned opa image, pip for the LinkML toolchain, and mvn deploy to
# GitHub Packages under the job's own GITHUB_TOKEN.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Validate metamodel and policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install validation dependencies
        run: pip install --disable-pip-version-check pyyaml

      - name: LinkML semantic lint
        run: python3 scripts/generate/lint_linkml_semantics.py

      - name: Enforce the metamodel/platform boundary (canonical decision 15)
        run: python3 scripts/verify/check-boundary.py

      - name: Enforce the corpus budget
        run: python3 scripts/verify/check-corpus-budget.py

      - name: opa check --strict
        run: |
          docker run --rm -v "${PWD}/policy:/policy:ro" \
            openpolicyagent/opa:1.19.0@sha256:8523599954435a3659954ad51ee0304d22bd97576f16cdb02e5e39f38ff3962a \
            check --strict /policy

      - name: opa test
        run: |
          docker run --rm -v "${PWD}/policy:/policy:ro" \
            openpolicyagent/opa:1.19.0@sha256:8523599954435a3659954ad51ee0304d22bd97576f16cdb02e5e39f38ff3962a \
            test /policy -v

  metamodel:
    name: Metamodel generation reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install the pinned LinkML toolchain
        run: pip install --disable-pip-version-check -r metamodel/requirements.txt

      - name: Regenerate and diff against the committed tree
        run: bash scripts/generate/generate-metamodel.sh --check

  publish-jumo-model:
    name: Publish dev.jumo:jumo-model to GitHub Packages
    needs: [contracts, metamodel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # GitHub Packages refuses to overwrite an already-published release version with 409
      # Conflict, and both coordinates here are fixed: jumo-core-reactor:1 and the jumo-model
      # version in its POM. So every push to main after the first one that publishes a given
      # version fails the whole workflow, for no reason a reader would guess from the error.
      # Publishing is a version-bump event, not a per-commit one -- so decide first, and say which.
      - name: Decide whether this version still needs publishing
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          published() {
            local path="$1" status
            status="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://maven.pkg.github.com/open4good/jumo-core/${path}")"
            [ "$status" = "200" ]
          }
          parent="$(mvn -B -q -f pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          model="$(mvn -B -q -f modules/jumo-model/pom.xml help:evaluate \
            -Dexpression=project.version -DforceStdout)"
          echo "jumo-core-reactor:${parent}, jumo-model:${model}"
          if published "dev/jumo/jumo-model/${model}/jumo-model-${model}.pom"; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "dev.jumo:jumo-model:${model} is already published; nothing to deploy."
            echo "Bump the version in modules/jumo-model/pom.xml to publish a new one."
            exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          # -am rebuilds and redeploys the parent, which 409s if it is already there. Only ask for
          # it when the parent is genuinely missing.
          if published "dev/jumo/jumo-core-reactor/${parent}/jumo-core-reactor-${parent}.pom"; then
            echo "projects=-pl modules/jumo-model" >> "$GITHUB_OUTPUT"
            echo "Parent already published; deploying jumo-model alone."
          else
            echo "projects=-pl modules/jumo-model -am" >> "$GITHUB_OUTPUT"
            echo "Parent missing; deploying it alongside jumo-model."
          fi

      # modules/jumo-model/src/main/java is already the committed, reproducibility-checked output
      # of the metamodel job above -- this job builds and ships it, it does not regenerate it.
      - name: Build and publish jumo-model
        if: steps.decide.outputs.needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The parent POM must reach the registry too -- without it the published jumo-model POM
        # names a parent no consumer can resolve, and every jumo build fails with "Could not find
        # artifact dev.jumo:jumo-core-reactor:pom:1" after authenticating fine. The step above
        # decides whether it still needs sending.
        run: mvn -B -f pom.xml ${{ steps.decide.outputs.projects }} deploy -DskipTests
