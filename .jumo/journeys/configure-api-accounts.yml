apiVersion: jumo.dev/v1
kind: AssistedJourney
metadata:
  id: configure-api-accounts
  namespace: dev.jumo.core
  name: Configuration de vos API
spec:
  journeyId: configure-api-accounts
  name: Configuration de vos API
  description: Activation et qualification réelle des ProviderAccount déjà déclarés dans ce Realm.
  category: integrations
  icon: mdi-tune-variant
  interruptible: true
  concurrencyPolicy: SINGLE_ACTIVE_RUN
  completionMode: OBSERVATION
  steps:
    - id: select-api-accounts
      name: Qualifier vos comptes API
      description: Sélectionnez plusieurs comptes déclarés, activez chaque clé via l’ingress propriétaire, puis vérifiez réellement les modèles accessibles.
      stepKind: COLLECT
      requiredFields: [{field: providerAccountRefs, i18nKey: journeyProviderAccountsField}]
      projectionSpecRef: {kind: ProjectionSpec, namespace: dev.jumo.core, id: configure-api-accounts}
      verificationSpecRef: {kind: JourneyVerificationSpec, namespace: dev.jumo.core, id: provider-account-smoke}
  resourceBudgetRef: {kind: ResourceBudget, namespace: dev.jumo.core, id: interactive}
