apiVersion: jumo.dev/v1
kind: ProcessSpec
metadata:
  id: cli-runtime-installation--1-0-0
  namespace: dev.jumo.core
  name: CLI runtime installation 1.0.0
spec:
  ownerRealm: home
  projectRef:
    kind: ProjectContract
    namespace: dev.jumo.core
    id: jumo
  processId: cli-runtime-installation
  processVersion: 1.0.0
  inputType: ExecutionCellProvisioningRef
  outputType: ExecutionCellProvisioningRef
  startTrigger: MANUAL
  steps:
    - id: start
      kind: START
    - id: authz
      kind: GATEWAY
      semanticStage: POLICY_EVALUATION
      gatewayMode: EXCLUSIVE
      gatewayRole: SPLIT
      pairedGatewayRef: authz-join
      opaEntrypoint: jumo.authz.decision
    - id: grant
      kind: SERVICE
      semanticStage: CAPABILITY_ACQUISITION
      capabilityRef: capability.grant.acquire
      ring: RING_1_CONTROL_PLANE
    - id: install-runtime
      kind: SERVICE
      semanticStage: EFFECT_APPLICATION
      capabilityRef: machine.administer
      ring: RING_1_CONTROL_PLANE
      idempotencyKey: cli-runtime-installation-machine-and-release
    - id: authz-join
      kind: GATEWAY
      gatewayMode: EXCLUSIVE
      gatewayRole: JOIN
      pairedGatewayRef: authz
    - id: completed
      kind: END
      terminalState: COMPLETED
    - id: declined
      kind: END
      terminalState: DECLINED
  flows:
    - id: start-authz
      from: start
      to: authz
      payloadType: ExecutionCellProvisioningRef
    - id: authz-allow
      from: authz
      to: grant
      branchLabel: ALLOW
      payloadType: ExecutionCellProvisioningRef
    - id: authz-deny
      from: authz
      to: declined
      branchLabel: DENY
      payloadType: ExecutionCellProvisioningRef
    - id: grant-install
      from: grant
      to: install-runtime
      payloadType: ExecutionCellProvisioningRef
    - id: install-join
      from: install-runtime
      to: authz-join
      payloadType: ExecutionCellProvisioningRef
    - id: join-completed
      from: authz-join
      to: completed
      payloadType: ExecutionCellProvisioningRef
