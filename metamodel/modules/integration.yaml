    annotations:
      jumo.composition: REALM_ONLY
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion: {range: string, equals_string: jumo.dev/v1, required: true}
      kind: {range: string, equals_string: MonetaryRiskPolicy, required: true}
      metadata: {range: Metadata, required: true, inlined: true}
      spec: {range: MonetaryRiskPolicySpec, required: true, inlined: true}
  MonetaryRiskPolicySpec:
    attributes:
      ownerRealm: {range: Identifier, required: true}
      scope: {range: MonetaryRiskPolicyScope, required: true}
      currency: {range: string, required: true, pattern: '^[A-Z]{3}$'}
      window: {range: Duration, required: true}
      perEffectLimit: {range: float, required: true, minimum_value: 0}
      cumulativeLimit: {range: float, required: true, minimum_value: 0}
      lifecycle: {range: MonetaryRiskPolicyLifecycle, required: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  KnowledgeCorpus:
    description: Realm-owned, grant-governed set of retrievable sources. Its index is derived recognized state and grants no authority.
    annotations:
      jumo.composition: REALM_ONLY
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion: {range: string, equals_string: jumo.dev/v1, required: true}
      kind: {range: string, equals_string: KnowledgeCorpus, required: true}
      metadata: {range: Metadata, required: true, inlined: true}
      spec: {range: KnowledgeCorpusSpec, required: true, inlined: true}
  KnowledgeCorpusSpec:
    attributes:
      ownerRealm: {range: Identifier, required: true}
      scope: {range: KnowledgeCorpusScope, required: true}
      projectRef: {range: ContractReference, inlined: true}
      dataScopeCeiling: {range: DataScope, required: true}
      knowledgeSourceRefs: {range: ContractReference, multivalued: true, inlined_as_list: true, required: true, minimum_cardinality: 1}
      knowledgeIndexProfileRef: {range: ContractReference, required: true, inlined: true}
      maximumStaleness: {range: Duration, required: true}
      lifecycle: {range: KnowledgeCorpusLifecycle, required: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  KnowledgeSource:
    description: Realm-owned source binding. A connector transports a snapshot only; it never becomes retrieval authority.
    annotations:
      jumo.composition: REALM_ONLY
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion: {range: string, equals_string: jumo.dev/v1, required: true}
      kind: {range: string, equals_string: KnowledgeSource, required: true}
      metadata: {range: Metadata, required: true, inlined: true}
      spec: {range: KnowledgeSourceSpec, required: true, inlined: true}
  KnowledgeSourceSpec:
    attributes:
      ownerRealm: {range: Identifier, required: true}
      knowledgeCorpusRef: {range: ContractReference, required: true, inlined: true}
      sourceKind: {range: KnowledgeSourceKind, required: true}
      projectRef: {range: ContractReference, inlined: true}
      composedRealm: {range: Identifier}
      connectorDefinitionRef: {range: ContractReference, inlined: true}
      readOperationRefs: {range: Identifier, multivalued: true}
      roots: {range: string, multivalued: true, required: true, minimum_cardinality: 1}
      includePatterns: {range: string, multivalued: true}
      excludePatterns: {range: string, multivalued: true}
      allowedMimeTypes: {range: string, multivalued: true, required: true, minimum_cardinality: 1}
      maximumDocumentBytes: {range: integer, required: true, minimum_value: 1}
      syncMode: {range: KnowledgeSyncMode, required: true}
      reconciliationCadence: {range: Duration, required: true}
      withdrawalPolicy: {range: KnowledgeWithdrawalPolicy, required: true}
      audience: {range: DataScope, required: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  KnowledgeIndexProfile:
    description: Additive, non-authoritative local retrieval profile. It pins a model artifact and never permits runtime download or a remote embedding endpoint.
    annotations:
      jumo.composition: ADDITIVE
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion: {range: string, equals_string: jumo.dev/v1, required: true}
      kind: {range: string, equals_string: KnowledgeIndexProfile, required: true}
      metadata: {range: Metadata, required: true, inlined: true}
      spec: {range: KnowledgeIndexProfileSpec, required: true, inlined: true}
  KnowledgeIndexProfileSpec:
    attributes:
      mode: {range: KnowledgeIndexMode, required: true}
      chunkMaximumTokens: {range: integer, required: true, minimum_value: 1}
      chunkOverlapTokens: {range: integer, required: true, minimum_value: 0}
      maximumResults: {range: integer, required: true, minimum_value: 1}
      lexicalWeight: {range: float, required: true, minimum_value: 0}
      vectorWeight: {range: float, required: true, minimum_value: 0}
      # Not metamodel-required: a LEXICAL-mode profile has no embedding to pin, and inventing one
      # would fabricate a digest for a model the profile never loads. HYBRID requires it -- Rego
      # rule corpus.knowledge.index-embedding-required in knowledge-retrieval.rego, not this schema.
      embedding: {range: LocalEmbeddingArtifact, inlined: true}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  LocalEmbeddingArtifact:
    attributes:
      executionMode: {range: EmbeddingExecutionMode, required: true}
      modelName: {range: string, required: true}
      dimensions: {range: integer, required: true, minimum_value: 1}
      license: {range: string, required: true}
      buildUri: {range: string, required: true}
      modelDigest: {range: string, required: true, pattern: '^sha256:[a-f0-9]{64}$'}
      tokenizerDigest: {range: string, required: true, pattern: '^sha256:[a-f0-9]{64}$'}
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  KnowledgeDocument:
    description: Reconstructible recognized-state projection of one source document admitted into a
      KnowledgeCorpus (knowledge-retrieval-git-vertical AC1). Content is replaced atomically by the
      sync run that observes a new sourceRevision; a purge clears content and chunks in the same
      transaction and leaves this row as a content-free tombstone.
    attributes:
      realmId: {range: Identifier, required: true}
      projectId: {range: Identifier}
      corpusId: {range: Identifier, required: true}
      sourceId: {range: Identifier, required: true}
      sourceKind: {range: KnowledgeSourceKind, required: true}
      sourceDocumentId: {range: string, required: true}
      locator: {range: string, required: true}
      title: {range: string}
      mimeType: {range: string, required: true}
      language: {range: string}
      sourceOwners: {range: string, multivalued: true}
      sourceRevision: {range: string, required: true}
      contentHash: {range: string, required: true, pattern: '^sha256:[a-f0-9]{64}$'}
      sourceUpdatedAt: {range: string}
      observedAt: {range: string, required: true}
      indexedAt: {range: string}
      audience: {range: DataScope, required: true}
      classification: {range: InformationClassification, required: true}
      normative: {range: boolean, required: true}
      lifecycle: {range: string, required: true}
      exclusionReason: {range: string}
      content: {range: string}
      lastSyncRunId: {range: Identifier}
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: PROJECTION
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  KnowledgeChunk:
    description: One retrievable fragment of a KnowledgeDocument's normalized content, carrying the
      lexical and vector index terms scored by knowledge.search. Purged and replaced wholesale with
      its owning document; never partially updated.
    attributes:
      documentId: {range: Identifier, required: true}
      fragmentId: {range: string, required: true}
      chunkIndex: {range: integer, required: true, minimum_value: 0}
      fragmentText: {range: string, required: true}
      tokenCount: {range: integer, required: true, minimum_value: 0}
      contentHash: {range: string, required: true, pattern: '^sha256:[a-f0-9]{64}$'}
      normative: {range: boolean, required: true}
      embeddingModelDigest: {range: string, pattern: '^sha256:[a-f0-9]{64}$'}
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: PROJECTION
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  KnowledgeSyncCursor:
    description: Restart-safe watermark for one KnowledgeSource's incremental refresh -- the last Git
      revision or connector change token observed, without any credential.
    attributes:
      corpusId: {range: Identifier, required: true}
      sourceId: {range: Identifier, required: true}
      cursorKind: {range: string, required: true}
      cursorValue: {range: string, required: true}
      updatedAt: {range: string, required: true}
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: PROJECTION
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  KnowledgeSyncRun:
    description: Sanitized evidence of one incremental refresh or reconciliation pass over a
      KnowledgeSource -- counters, status and reason codes, never source text.
    attributes:
      corpusId: {range: Identifier, required: true}
      sourceId: {range: Identifier, required: true}
      trigger: {range: string, required: true}
      status: {range: string, required: true}
      startedAt: {range: string, required: true}
      completedAt: {range: string}
      documentsScanned: {range: integer, minimum_value: 0}
      documentsUpdated: {range: integer, minimum_value: 0}
      documentsDeleted: {range: integer, minimum_value: 0}
      documentsExcluded: {range: integer, minimum_value: 0}
      reasonCode: {range: string}
      errorSummary: {range: string}
    annotations:
      jumo.state_authority: POSTGRES
      jumo.model_role: EVENT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  EventIngress:
    description: Generic, Realm-owned Git contract declaring that an untrusted external event may
      start an exact ProcessSpec (event-ingress-contract-foundations). Carries a schema reference,
      a verification binding, a bounded replay window and a retention boundary. Names no provider,
      channel, Realm instance or use case -- the concrete transport (a webhook, an email inbox, a
      device signal) is declared only by an instance; this schema stays generic. Grants no
      connector authority, custodies no credential, and creates no grant, approval or connector
      activation by itself -- Rego (execution.rego) additionally requires the target ProcessSpec's
      own startTrigger to be EVENT and its first effect to be an observation or an attention
      publication.
    annotations:
      jumo.composition: REALM_ONLY
      jumo.state_authority: GIT
      jumo.model_role: CONTRACT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
    attributes:
      apiVersion:
        range: string
        equals_string: jumo.dev/v1
        required: true
      kind:
        range: string
        equals_string: EventIngress
        required: true
      metadata:
        range: Metadata
        required: true
        inlined: true
      spec:
        range: EventIngressSpec
        required: true
        inlined: true
  EventIngressSpec:
    attributes:
      ownerRealm:
        range: Identifier
        required: true
      active:
        range: boolean
        required: true
      schemaBinding:
        range: SchemaBinding
        required: true
        inlined: true
        description: Identifies the exact LinkML class and pinned schema digest the admitted event
          payload must validate against.
      verificationSecretBindingRef:
        range: ContractReference
        required: true
        inlined: true
        description: Same-Realm SecretBinding custodying the key material used to verify the
          event's authenticity; this contract names no verification method or transport.
      replayWindow:
        range: Duration
        required: true
        description: Bound on how long a deduplicated event ID must be recognized and a repeat
          refused as a replay.
      retentionBoundary:
        range: Duration
        required: true
        description: Bound on how long the admitted event's signed receipt is retained before
          purge.
      processSpecRef:
        range: ContractReference
        required: true
        inlined: true
        description: The exact ProcessSpec this ingress starts; must resolve to a same-Realm
          ProcessSpec whose own startTrigger is EVENT (Rego).
    annotations:
      jumo.state_authority: GIT
      jumo.model_role: VALUE_OBJECT
      jumo.audience: REALM_PRIVATE
      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
