apiVersion: jumo.dev/v1
kind: AssistedJourney
metadata:
  id: delegate-development-task
  namespace: dev.jumo.core
  name: Déléguer une tâche de développement
spec:
  journeyId: delegate-development-task
  name: Déléguer une tâche de développement
  description: Capturez, décomposez et spécifiez une tâche de développement logiciel sous forme de
    WorkOrder gouverné.
  category: teamsProjects
  icon: mdi-clipboard-arrow-right-outline
  interruptible: true
  concurrencyPolicy: MULTIPLE_ACTIVE_RUNS
  emitsCapability: contract.change.propose
  emission:
    targetKind: WorkOrder
    identifier: {fromField: taskSlug}
    pathTemplate: .jumo/work/${id}.yml
    documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: development-work-order}
    validations:
      - {field: taskSlug, required: true}
      - {field: purpose, required: true, minimumLength: 10}
      - {field: roleRef, required: true}
      - {field: teamRef, required: true}
    fieldDefaults:
      - {field: projectRef, value: jumo}
      - {field: roadmapRef, value: v0}
      - {field: ring, value: RING_2_AGENT_BEHAVIOR}
    routingEligibilityCheck: {projectField: projectRef, teamField: teamRef}
  steps:
    - id: capture-task-intent
      name: Description du besoin
      description: Décrivez l'objectif fonctionnel ou technique à réaliser par un jumeau développeur.
      personaNarration: Expliquez ce que vous souhaitez développer ou corriger. Je vais cadrer le périmètre et la décomposition.
      requiredFields:
        - taskSlug
        - purpose
    - id: specify-work-order
      name: Spécification du lot
      description: Définissez le rôle responsable, l'équipe et les critères d'acceptation.
      personaNarration: Associons ce lot à un rôle d'implémentation et à un vérificateur indépendant.
      requiredFields:
        - roleRef
        - teamRef
    - id: confirm-work-order
      name: Confirmation de la tâche
      description: Vérifiez la proposition de contrat WorkOrder avant son émission.
      personaNarration: Le contrat de travail est prêt. Validez pour enregistrer la proposition de tâche.
      requiredFields:
        - confirmed
  resourceBudgetRef:
    kind: ResourceBudget
    namespace: dev.jumo.core
    id: interactive
