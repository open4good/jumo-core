      - basePath
      title: ApiSurfaceSpec
      description: Specification of an ApiSurface contract.
    ApiProblem:
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        realmId:
