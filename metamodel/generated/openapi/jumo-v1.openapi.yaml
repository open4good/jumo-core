        trustClass:
          $ref: '#/components/schemas/McpBundleTrustClass'
        connectorPackageRef:
          $ref: '#/components/schemas/ContractReference'
        artifact:
          $ref: '#/components/schemas/McpBundleArtifact'
        runtime:
          $ref: '#/components/schemas/McpBundleRuntime'
        semanticProfile:
