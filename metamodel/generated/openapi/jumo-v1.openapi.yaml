        semanticTools:
          items:
            type: string
          type: array
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - remoteMcpServiceRef
      - verdict
      - inventoryDigest
      - observedAt
      - validUntil
      - verifiedByRoleDefinitionRef
      - evidenceRefs
      title: RemoteMcpAppraisalSpec
    ExecutionCell:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ExecutionCellSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ExecutionCell
      description: A Realm-bound execution cell boundary that manages compute placement,
        local credential custody, and outbound mTLS execution leases.
    ExecutionCellSpec:
      properties:
        ownerRealm:
          type: string
        placement:
          $ref: '#/components/schemas/ExecutionCellPlacement'
        lifecycle:
          $ref: '#/components/schemas/ExecutionCellLifecycle'
        identity:
          $ref: '#/components/schemas/ExecutionCellIdentity'
        transport:
          $ref: '#/components/schemas/ExecutionCellTransport'
        connectorDefinitionRefs:
          items:
            $ref: '#/components/schemas/ContractReference'
          type: array
        localProtocol:
          $ref: '#/components/schemas/ExecutionCellLocalProtocol'
        credentialCustody:
          allOf:
          - $ref: '#/components/schemas/ExecutionCellCredentialCustody'
          description: Must equal LOCAL_CELL_SEALED (Rego, corpus.cell.credential-custody).
        mountedPersonalSpaceRefs:
          items:
            $ref: '#/components/schemas/ContractReference'
          type: array
          description: PersonalSpace documents mounted into this cell's private workspace
            filesystem. Each referenced PersonalSpace must belong to the same Realm
            as this cell (Rego, corpus.cell.workspace-realm-scoped) -- private documents
            never mount into another tenant's dedicated Execution Cell.
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - placement
      - lifecycle
      - identity
      - transport
      - connectorDefinitionRefs
      - credentialCustody
      title: ExecutionCellSpec
    ExecutionCellIdentity:
      properties:
        deviceId:
          type: string
        pairingMethod:
          $ref: '#/components/schemas/ExecutionCellPairingMethod'
      additionalProperties: false
      type: object
      required:
      - deviceId
      - pairingMethod
      title: ExecutionCellIdentity
    ExecutionCellTransport:
      properties:
        mode:
          type: string
        endpointRef:
          type: string
          pattern: ^.{3,}$
      additionalProperties: false
      type: object
      required:
      - mode
      - endpointRef
      title: ExecutionCellTransport
    ProviderSessionBinding:
      properties:
        id:
          type: string
        ownerRealm:
          type: string
        executionMachineRef:
          type: string
        adapter:
          $ref: '#/components/schemas/ModelAccessAdapter'
        providerAccountRef:
          type: string
        sessionFingerprint:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        status:
          type: string
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
      type: object
      required:
      - id
      - ownerRealm
      - executionMachineRef
      - adapter
      - providerAccountRef
      - sessionFingerprint
      - status
      - expiresAt
      title: ProviderSessionBinding
      description: Recognized opaque binding between a holder provider session and
        one ExecutionMachine. It never contains a bearer token, refresh token, or
        provider credential.
    RoutingDecision:
      properties:
        id:
          type: string
        ownerRealm:
          type: string
        conversationTurnRef:
          type: string
        executionCellRef:
          type: string
        adapter:
          $ref: '#/components/schemas/ModelAccessAdapter'
        policyRevision:
          type: string
        reasonCode:
          type: string
        inputSha256:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        evaluatedAt:
          type: string
          format: date-time
      additionalProperties: false
      type: object
      required:
      - id
      - ownerRealm
      - conversationTurnRef
      - executionCellRef
      - adapter
      - policyRevision
      - reasonCode
      - inputSha256
      - evaluatedAt
      title: RoutingDecision
      description: Immutable policy-authorized adapter and cell selection for one
        recognized turn.
    WorkerInvocation:
      properties:
        id:
          type: string
        ownerRealm:
          type: string
        routingDecisionRef:
          type: string
        executionCellRef:
          type: string
        capabilityGrantRef:
          type: string
        status:
          type: string
        contextSha256:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        startedAt:
          type: string
          format: date-time
      additionalProperties: false
      type: object
      required:
      - id
      - ownerRealm
      - routingDecisionRef
      - executionCellRef
      - capabilityGrantRef
      - status
      - contextSha256
      - startedAt
      title: WorkerInvocation
      description: Ephemeral recognized binding of a turn, route, cell, grant and
        execution evidence.
    EvidenceRecord:
      properties:
        id:
          type: string
        ownerRealm:
          type: string
        workerInvocationRef:
          type: string
        eventKind:
          type: string
        eventSha256:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        contentSanitized:
          type: boolean
        capturedAt:
          type: string
          format: date-time
      additionalProperties: false
      type: object
      required:
      - id
      - ownerRealm
      - workerInvocationRef
      - eventKind
      - eventSha256
      - contentSanitized
      - capturedAt
      title: EvidenceRecord
      description: Append-only sanitized execution observation linked to one WorkerInvocation.
    InvocationAuthorizationReceipt:
      properties:
        invocationId:
          type: string
        executionCellLeaseRef:
          type: string
        ownerRealm:
          type: string
        operationRef:
          type: string
        argumentDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        toolsDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        expiresAt:
          type: string
          format: date-time
        signature:
          type: string
          pattern: ^.{16,}$
      additionalProperties: false
      type: object
      required:
      - invocationId
      - executionCellLeaseRef
      - ownerRealm
      - operationRef
      - argumentDigest
      - toolsDigest
      - expiresAt
      - signature
      title: InvocationAuthorizationReceipt
      description: Signed, single-use MCP invocation authorization (ADR-0055). Bound
        to exactly one invocation id, lease, Realm, operation, argument digest and
        tools digest; carries no session or renewal field and therefore cannot represent
        renewable session authority. A lease gateway without this receipt cannot contact
        the upstream.
    SecretBinding:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/SecretBindingSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: SecretBinding
      description: A Git-declared reference to runtime secret material. Values are
        deliberately not representable here.
    SecretBindingSpec:
      properties:
        ownerRealm:
          type: string
        lifecycle:
          $ref: '#/components/schemas/SecretBindingLifecycle'
        runtimeRef:
          type: string
          description: Account- or connector-scoped OpenBao KV-v2 reference resolved
            by the per-Realm SecretBroker; not a secret value.
        allowedMcpBundleRefs:
          items:
            $ref: '#/components/schemas/ContractReference'
          type: array
        allowedRemoteMcpServiceRefs:
          items:
            $ref: '#/components/schemas/ContractReference'
          type: array
        allowedConnectorDefinitionRefs:
          items:
            $ref: '#/components/schemas/ContractReference'
          type: array
        allowedOperationRefs:
          items:
            type: string
          type: array
        allowedWorkerSubstrateRefs:
          items:
            $ref: '#/components/schemas/ContractReference'
          type: array
        injection:
          $ref: '#/components/schemas/SecretInjection'
        rotation:
          $ref: '#/components/schemas/SecretRotation'
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - lifecycle
      - runtimeRef
      - injection
      title: SecretBindingSpec
      description: anyOf(allowedBundleRefs, allowedRemoteServiceRefs, allowedConnectorRefs,
        allowedWorkerSubstrateRefs) moves to Rego.
    SecretInjection:
      properties:
        target:
          $ref: '#/components/schemas/SecretInjectionTarget'
        environmentVariable:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,127}$
        fileName:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
      additionalProperties: false
      type: object
      required:
      - target
      title: SecretInjection
    SecretRotation:
      properties:
        required:
          type: boolean
        maximumAge:
          type: string
      additionalProperties: false
      type: object
      title: SecretRotation
    FederatedPeer:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/FederatedPeerSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: FederatedPeer
      description: Desired bilateral Jumo peer configuration. Unavailable until recognized
        pairing evidence confirms both sides.
    FederatedPeerSpec:
      properties:
        ownerRealm:
          type: string
        peerRealm:
          type: string
        endpoint:
          type: string
          pattern: ^https://
        transport:
          type: string
        mtls:
          $ref: '#/components/schemas/FederatedPeerMtls'
        signing:
          $ref: '#/components/schemas/FederatedPeerSigning'
        federationProfileRefs:
          items:
            $ref: '#/components/schemas/ContractReference'
          type: array
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - peerRealm
      - endpoint
      - transport
      - mtls
      - signing
      - federationProfileRefs
      title: FederatedPeerSpec
    FederatedPeerMtls:
      properties:
        peerCertificateSha256:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        nextCertificateSha256:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      additionalProperties: false
      type: object
      required:
      - peerCertificateSha256
      title: FederatedPeerMtls
    FederatedPeerSigning:
      properties:
        peerKeyId:
          type: string
          pattern: ^.{3,}$
        peerPublicKeySha256:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      additionalProperties: false
      type: object
      required:
      - peerKeyId
      - peerPublicKeySha256
      title: FederatedPeerSigning
    FederationProfile:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/FederationProfileSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: FederationProfile
      description: A negotiated, namespaced protocol profile. Describes messages only
        and cannot grant authority.
    FederationProfileSpec:
      properties:
        ownerRealm:
          type: string
        namespace:
          type: string
          pattern: ^[a-z][a-z0-9.-]{2,63}$
        version:
          type: string
          pattern: ^\d+\.\d+\.\d+$
        handlerModuleRef:
          type: string
        messages:
          items:
            $ref: '#/components/schemas/FederationMessage'
          type: array
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - namespace
      - version
      - messages
      title: FederationProfileSpec
    FederationMessage:
      properties:
        type:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9.:-]+$
        direction:
          $ref: '#/components/schemas/FederationMessageDirection'
        schemaRef:
          type: string
          pattern: ^.{3,}$
      additionalProperties: false
      type: object
      required:
      - type
      - direction
      - schemaRef
      title: FederationMessage
    ProviderAccount:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ProviderAccountSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ProviderAccount
      description: One model or CLI account and the window its quota renews in. ResourceBudget
        bounds a single Episode; this bounds the account across Episodes (ADR-0013).
    ProviderAccountSpec:
      properties:
        provider:
          type: string
          pattern: ^.{2,}$
          description: Vendor and access path, such as anthropic-cli or openai-api.
            Two accounts on the same vendor are not independent of each other.
        routing:
          $ref: '#/components/schemas/ProviderRouting'
        secretBindingRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The sole OpenBao binding that may hold this named account's
            credential; the value is never contractual state.
        quotaWindow:
          $ref: '#/components/schemas/ProviderQuotaWindow'
        observationProvenance:
          $ref: '#/components/schemas/ProviderObservationProvenance'
        onExhaustion:
          $ref: '#/components/schemas/ProviderOnExhaustion'
        independenceGroup:
          type: string
          description: Accounts sharing a group are not independent. Falling back
            within the same group would let one account both produce and verify (docs/concepts/positionnement-conceptuel.md#diversite-des-pannes)
            -- a declared separation, not a proof of independence; a fault-diversity
            vector (provider, model, prompt, sources, tools, framing) would be the
            finer-grained signal, not yet modeled as its own field. Inherited from
            the referenced ProviderPlatform's independenceGroup when absent.
        entitlement:
          $ref: '#/components/schemas/ProviderEntitlement'
        alternativeProviderAccountRefs:
          items:
            $ref: '#/components/schemas/ContractReference'
          type: array
      additionalProperties: false
      type: object
      required:
      - provider
      - routing
      - quotaWindow
      - observationProvenance
      - onExhaustion
      - entitlement
      title: ProviderAccountSpec
    ProviderRouting:
      properties:
        priority:
          type: integer
          minimum: 1
          description: Deterministic account selection order for a compatible worker
            requirement profile. Lower values are selected first.
        mode:
          $ref: '#/components/schemas/AccessMode'
        gatewayRef:
          type: string
          description: Required when mode is GATEWAY_ROUTED; forbidden when PLAN_DIRECT
            (Rego).
        platformRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: The ProviderPlatform catalog entry this account was opened
            against. Required when mode is GATEWAY_ROUTED; forbidden when PLAN_DIRECT,
            which has no upstream provider-egress traffic (Rego).
        upstreamHost:
          type: string
          description: Required exactly when the referenced ProviderPlatform declares
            hostDeclaredByAccount true (a generic platform such as an OpenAI-compatible
            aggregator); forbidden otherwise (Rego).
        effortLadder:
          items:
            $ref: '#/components/schemas/EffortRungSpec'
          type: array
          description: Overrides the platform's defaultEffortLadder rung for rung
            when declared. Absent by default, so a newly declared account inherits
            the platform's ladder and is routable immediately -- the fix for the N-times-M
            dead account problem a per-account requirementAliases list produced.
      additionalProperties: false
      type: object
      required:
      - mode
      title: ProviderRouting
    ProviderPlatform:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ProviderPlatformSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ProviderPlatform
      description: The declared catalog entry a ProviderAccount is opened against
        -- wire protocol, upstream host, credential header style, egress route, and
        the default effort ladder new accounts inherit. Adding an aggregator or OpenAI-compatible
        endpoint is a contract change against this catalog and a provider-egress regeneration,
        never a value typed directly into a ProviderAccount (ADR-0002 -- the worker
        cannot select a host).
    ProviderPlatformSpec:
      properties:
        wireProtocol:
          $ref: '#/components/schemas/WireProtocol'
        egressRouteId:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,30}$
          description: Names the generated provider-egress nginx location this platform's
            traffic proxies through. Never a raw URL; the worker builds only /{egressRouteId}/...
            and cannot select an upstream itself.
        upstreamHost:
          type: string
          description: Fixed TLS upstream for an integrated platform. Forbidden when
            hostDeclaredByAccount is true (Rego); a generic platform's host is named
            per-account instead.
        completionPath:
          type: string
        modelCatalogPath:
          type: string
        credentialHeader:
          $ref: '#/components/schemas/CredentialHeaderStyle'
        independenceGroup:
          type: string
          description: Default independenceGroup for an account opened against this
            platform when the account does not declare its own.
        hostDeclaredByAccount:
          type: boolean
          description: True only for a generic platform (e.g. an OpenAI-compatible
            aggregator such as OpenRouter) whose upstream host is named per-account
            instead of fixed by this catalog entry.
        defaultEffortLadder:
          items:
            $ref: '#/components/schemas/EffortRungSpec'
          type: array
          description: The rung-by-rung ladder every account opened against this platform
            inherits unless it declares its own ProviderRouting.effortLadder.
      additionalProperties: false
      type: object
      required:
      - wireProtocol
      - egressRouteId
      - completionPath
      - modelCatalogPath
      - credentialHeader
      - independenceGroup
      - hostDeclaredByAccount
      - defaultEffortLadder
      title: ProviderPlatformSpec
    EffortRungSpec:
      properties:
        rung:
          allOf:
          - $ref: '#/components/schemas/ReasoningEffort'
          description: Matches a WorkerRequirementProfile.spec.quality.reasoningEffort
            value one for one; the resolver picks the account's rung with the same
            name instead of a per-profile alias.
        modelAlias:
          type: string
        nativeEffort:
          $ref: '#/components/schemas/ProviderNativeEffort'
      additionalProperties: false
      type: object
      required:
      - rung
      - modelAlias
      title: EffortRungSpec
    ProviderNativeEffort:
      properties:
        reasoningEffort:
          type: string
          description: Provider-native effort token passed through verbatim (e.g.
            OpenAI's 'medium' or 'high').
        maxOutputTokens:
          type: integer
          minimum: 1
        thinkingBudgetTokens:
          type: integer
          minimum: 1
          description: Native thinking-token budget for a protocol that exposes one
            (Anthropic extended thinking, Google thinkingConfig).
      additionalProperties: false
      type: object
      title: ProviderNativeEffort
      description: Provider-native reasoning-effort parameters, applied verbatim by
        RequestShape for the rung's protocol -- OpenAI reasoning_effort, Anthropic
        thinking budget and max_tokens, Google thinkingConfig.
    ProviderQuotaWindow:
      properties:
        kind:
          $ref: '#/components/schemas/ProviderQuotaWindowKind'
        duration:
          type: string
          description: Required when kind is ROLLING or CALENDAR; forbidden when METERED
            (Rego).
      additionalProperties: false
      type: object
      required:
      - kind
      title: ProviderQuotaWindow
    ProviderEntitlement:
      properties:
        holder:
          $ref: '#/components/schemas/EntitlementHolder'
        holderRef:
          type: string
          pattern: ^.{2,}$
        usePermissions:
          $ref: '#/components/schemas/EntitlementUsePermissions'
      additionalProperties: false
      type: object
      required:
      - holder
      - holderRef
      - usePermissions
      title: ProviderEntitlement
    EntitlementUsePermissions:
      properties:
        holderOperated:
          $ref: '#/components/schemas/EntitlementUseContext'
        jumoManaged:
          $ref: '#/components/schemas/EntitlementUseContext'
      additionalProperties: false
      type: object
      required:
      - holderOperated
      - jumoManaged
      title: EntitlementUsePermissions
    EntitlementUseContext:
      properties:
        verdict:
          $ref: '#/components/schemas/EntitlementVerdict'
        termsReview:
          $ref: '#/components/schemas/TermsReview'
      additionalProperties: false
      type: object
      required:
      - verdict
      - termsReview
      title: EntitlementUseContext
    TermsReview:
      properties:
        sourceRef:
          type: string
          pattern: ^.{3,}$
        reviewedAt:
          type: string
          format: date
        validUntil:
          type: string
          format: date
          description: The review's validity deadline; the window between reviewedAt
            and validUntil may not exceed 90 days (Rego).
      additionalProperties: false
      type: object
      required:
      - sourceRef
      - reviewedAt
      - validUntil
      title: TermsReview
    WorkerSubstrate:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/WorkerSubstrateSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: WorkerSubstrate
      description: 'Realm-owned declaration of a constrained worker runtime. A Git-reviewed
        security boundary: native CLI homes, repository mounts, database reach, open
        egress, container runtime sockets and built-in connector authority are absent
        so Jumo policy remains the only authority path.'
    WorkerSubstrateSpec:
      properties:
        ownerRealm:
          type: string
        executionMachineRef:
          allOf:
          - $ref: '#/components/schemas/ContractReference'
          description: Durable execution machine selected for this CLI substrate;
            an ExecutionCellLease remains invocation-scoped.
        lifecycle:
          $ref: '#/components/schemas/ConnectorLifecycle'
        substrate:
          $ref: '#/components/schemas/WorkerSubstrateKind'
        cli:
          $ref: '#/components/schemas/WorkerCli'
        image:
          $ref: '#/components/schemas/WorkerImage'
        isolation:
          $ref: '#/components/schemas/WorkerIsolation'
        homeState:
          type: string
          description: A mounted CLI home carries native connectors, consent history
            and trusted folders; isolated per-invocation state removes that duplicated
            authority.
        modelAccess:
          $ref: '#/components/schemas/WorkerModelAccess'
        grantedOperationRefs:
          items:
            $ref: '#/components/schemas/WorkerGrantedOperation'
          type: array
          description: The only external reach available to the substrate.
        nativeToolAuthority:
          type: string
          description: CLI-native connectors and MCP servers are disabled so the fact
            is reviewable rather than hidden in an image. Unaffected by AGENTS.md's
            development-agent MCP directives -- those govern a human's own terminal
            session, not a dispatched worker.
        ambientToolAuthority:
          type: string
          description: No CLI home, image, plugin, repository file, or provider default
            silently grants tool access.
        projectedToolAuthority:
          type: string
          description: Tool capabilities are dynamically projected by the Jumo capability
            gateway via an invocation-scoped Streamable HTTP MCP endpoint based on
            explicit InvocationCapabilityGrants.
        usageContext:
          allOf:
          - $ref: '#/components/schemas/WorkerUsageContext'
          description: Licensing and entitlement fact only. Not a security boundary
            and not a sphere.
        accountUse:
          allOf:
          - $ref: '#/components/schemas/WorkerAccountUse'
          description: Which ProviderAccount use context this substrate is authorized
            to consume, explicit so a declared substrate never silently upgrades from
            holder-operated to Jumo-managed use.
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - lifecycle
      - substrate
      - image
      - isolation
      - homeState
      - modelAccess
      - grantedOperationRefs
      - nativeToolAuthority
      - ambientToolAuthority
      - projectedToolAuthority
      - usageContext
      - accountUse
      title: WorkerSubstrateSpec
    WorkerImage:
      properties:
        reference:
          type: string
          pattern: ^.{3,}$
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          description: A tag is a moving target; evidence names the bytes that ran.
      additionalProperties: false
      type: object
      required:
      - reference
      - digest
      title: WorkerImage
    WorkerIsolation:
      properties:
        network:
          allOf:
          - $ref: '#/components/schemas/WorkerNetworkIsolation'
          description: Open egress is absent because it would let a CLI re-acquire
            authority outside Jumo's grant.
        rootFilesystem:
          type: string
        linuxCapabilities:
          type: string
        privilegeEscalation:
          type: string
        containerRuntimeSocket:
          type: string
          description: A runtime socket mount hands the container authority over its
            own sandbox.
        workspace:
          $ref: '#/components/schemas/WorkerWorkspaceMode'
        limits:
          $ref: '#/components/schemas/WorkerIsolationLimits'
      additionalProperties: false
      type: object
      required:
      - network
      - rootFilesystem
      - linuxCapabilities
      - privilegeEscalation
      - containerRuntimeSocket
      - workspace
      - limits
      title: WorkerIsolation
    WorkerIsolationLimits:
      properties:
        memory:
          type: string
          pattern: ^[1-9][0-9]*(Mi|Gi)$
        cpus:
          type: number
          format: float
