apiVersion: jumo.dev/v1
kind: WorkerRequirementProfile
metadata:
  id: nestor-dialogue
  namespace: dev.jumo.core
  name: Nestor dialogue fast worker
spec:
  ownerRealm: home
  taskClasses:
    - REALTIME_DIALOGUE
    - NARRATION
  modalities:
    - TEXT
  dataScopeCeiling: REALM_PRIVATE
  context:
    minimumTokens: 8192
  interaction:
    toolUse: NONE
    structuredOutput: REQUIRED
  quality:
    minimumAssurance: OBSERVED
    minimumReliability: 0.7
    minimumTaskHorizon: PT10S
    maximumEvaluationAge: P30D
    reasoningEffort: LOW
  limits:
    # PT1M, not PT10S: since nestor-dialogue-maximum-latency-enforcement this declaration is
    # the bound ConversationService.dispatchToWorker actually races the call against, and the
    # route it bounds is a reasoning-family model at LOW effort whose measured dev-local turns
    # succeed between 5.7s and 8.1s but tail past 18s -- a 10s budget failed live turns for
    # being slow rather than wrong. Stays under the generic model-worker read timeout (PT4M since
    # conversation-turn-deadline-coherence raised it above every declared budget), so this remains
    # the tighter of the two bounds (nestor-dialogue-latency-budget-realistic). Since that same
    # order this number bounds the whole TURN, not each leg: a bounded escalation spends what the
    # first leg left of it, so two legs can no longer add up to twice what is declared here.
    maximumLatency: PT1M
    # MEDIUM, not LOW: ConversationService.attemptBoundedEscalation reads this ceiling against the
    # same LOW/MEDIUM/HIGH vocabulary as reasoningEffort to bound AUTO_BOUNDED's retry rung (ADR-0019
    # -- "no higher than the profile ceiling"). A LOW ceiling on a LOW-effort profile would make the
    # onInsufficiency below permanently unreachable: every escalation attempt would be refused by its
    # own declared cost limit before ever checking budget. MEDIUM keeps a real ceiling below the
    # ladder's own HIGH top while letting the one bounded retry actually occur.
    maximumCostClass: MEDIUM
  onInsufficiency: AUTO_BOUNDED
