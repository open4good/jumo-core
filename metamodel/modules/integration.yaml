      jumo.sensitivity: INTERNAL
      jumo.boundary_eligible: true
      jumo.schema_profiles: draft-2020-12,native-json-schema,prompted-json-validated
  SessionPlan:
    description: Signed MCP gateway session plan scoped to one ExecutionCellLease
      (mcp-gateway-session-plan-signing AC2) -- carries the planSignature envelope
      dev.jumo.mcpgateway.plan.SessionPlan's javadoc names but does not yet have a field for.
