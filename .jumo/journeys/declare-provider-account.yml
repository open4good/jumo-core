apiVersion: jumo.dev/v1
kind: AssistedJourney
metadata:
  id: declare-provider-account
  namespace: dev.jumo.core
  name: Déclarer un compte fournisseur
spec:
  journeyId: declare-provider-account
  name: Déclarer un compte fournisseur
  description: Déclarez un compte fournisseur externe de modèle ou de CLI, configurez les alias de
    routage, et établissez les bornes d'habilitation sans jamais accepter de jeton secret en clair.
  category: integrations
  icon: mdi-cloud-outline
  interruptible: true
  concurrencyPolicy: MULTIPLE_ACTIVE_RUNS
  emitsCapability: contract.change.propose
  emission:
    targetKind: ProviderAccount
    identifier: {fromField: providerId}
    pathTemplate: .jumo/providers/${id}.yml
    documentTemplateRef: {kind: DocumentTemplate, namespace: dev.jumo.core, id: provider-account}
    validations:
      - {field: providerId, required: true}
    fieldDefaults:
      - {field: independenceGroup, value: '${provider}'}
    fieldConditions:
      - {field: gatewayRef, whenField: routingMode, equalsValue: GATEWAY_ROUTED}
    booleanFields: [permitted]
  steps:
    - id: define-provider
      name: Provider identity
      description: Specify the provider ID, name, and provider family (e.g. anthropic, openai, google).
      personaNarration: Let's name and categorize the provider account.
      requiredFields:
        - providerId
        - providerName
        - provider
    - id: configure-routing
      name: Routing configuration
      description: Configure routing mode, gateway reference, and requirement aliases.
      personaNarration: Define how model traffic is routed to this provider.
      requiredFields:
        - routingMode
        - gatewayRef
    - id: configure-entitlement
      name: Entitlements and quotas
      description: Specify entitlement status and quota window bounds.
      personaNarration: Set up the usage permissions and budget thresholds.
      requiredFields:
        - permitted
    - id: confirm-declaration
      name: Confirmation
      description: Review the structured ProviderAccount declaration before proposing the change.
      personaNarration: Let's review the provider contract before submission.
      requiredFields:
        - confirmed
  resourceBudgetRef:
    kind: ResourceBudget
    namespace: dev.jumo.core
    id: interactive
