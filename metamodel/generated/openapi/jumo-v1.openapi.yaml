      - workerRequirementProfileRef
      - intent
      title: CapabilityProfileSpec
    WorkerRequirementProfile:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/WorkerRequirementProfileSpec'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: WorkerRequirementProfile
      description: A multi-dimensional task requirement vector used to select an eligible
        runtime Worker. Names neither provider nor model and defines no aggregate
        power score.
    WorkerRequirementProfileSpec:
      properties:
        ownerRealm:
          type: string
        taskClasses:
          items:
            $ref: '#/components/schemas/TaskClass'
          type: array
        modalities:
          items:
            $ref: '#/components/schemas/Modality'
          type: array
        dataScopeCeiling:
