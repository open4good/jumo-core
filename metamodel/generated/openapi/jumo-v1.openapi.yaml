      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: SolicitationContract
      description: 'The only way one Project or Realm may solicit another (canonical
        decision 25). Exposes a typed interface, never internal Project data. Renamed
        from DelegationContract: the word "delegation" is reserved for authority delegation,
        explicitly excluded from V1, and this schema never modeled that -- it models
        a typed cross-Project request contract.'
    SolicitationContractSpec:
      properties:
        callerProject:
