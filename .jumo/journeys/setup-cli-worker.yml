apiVersion: jumo.dev/v1
kind: AssistedJourney
metadata:
  id: setup-cli-worker
  namespace: dev.jumo.core
  name: Setup CLI worker
spec:
  journeyId: setup-cli-worker
  name: Setup & appairage d'une CLI
  description: Configurez un worker CLI isolé (Claude Code, Codex, Copilot, Gemini), liez une clé API si compatible et validez
    son appairage sécurisé sur votre cellule d'exécution hôte.
  category: integrations
  icon: mdi-console-line
  interruptible: true
  concurrencyPolicy: MULTIPLE_ACTIVE_RUNS
  emitsCapability: contract.change.propose
  steps:
    - id: select-cli-engine
      name: Choix du moteur CLI
      description: Sélectionnez le substrat CLI à initialiser (Codex, Claude Code, Copilot, Gemini).
      personaNarration: Choisissons quel outil CLI vous souhaitez mettre à disposition de vos agents.
      requiredFields:
        - cliEngine
        - workerName
    - id: configure-api-link
      name: Authentification & Clé API
      description: Liez une clé API déclarée (OpenRouter / OpenAI / Anthropic / Google) ou activez l'authentification par
        session locale.
      personaNarration: Associons maintenant les identifiants ou la session d'exécution requise.
      requiredFields:
        - authSource
    - id: verify-execution-cell
      name: Vérification cellule d'exécution
      description: Validation de l'isolation du conteneur et vérification de l'accès mTLS sur la cellule hôte.
      personaNarration: Assurons-nous que la machine virtuelle d'exécution est prête à accueillir ce conteneur.
      stepKind: AWAIT
      requiredFields: []
      processSpecRef:
        kind: ProcessSpec
        namespace: dev.jumo.core
        id: execution-cell-provisioning--1-0-0
    - id: confirm-cli-setup
      name: Bilan et activation
      description: Vérifiez la déclaration du WorkerSubstrate avant enregistrement dans le Grand Registre.
      personaNarration: Récapitulons les paramètres avant d'enregistrer la proposition.
      requiredFields:
        - confirmed
  resourceBudgetRef:
    kind: ResourceBudget
    namespace: dev.jumo.core
    id: interactive
