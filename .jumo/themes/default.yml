apiVersion: jumo.dev/v1
kind: ThemePack
metadata:
  id: default
  namespace: dev.jumo.core
  name: Jumo default vocabulary
spec:
  terminology:
    - roleKey: chiefOfStaff
      displayName: Nestor
    - roleKey: projectSteward
      displayName: Majordome
    - roleKey: deliveryLead
      displayName: Maitre d'oeuvre
    - roleKey: releaseSteward
      displayName: Intendant
    - roleKey: producingSpecialist
      displayName: Artisan
    - roleKey: securityAgent
      displayName: Vigie
    - roleKey: independentVerifier
      displayName: Auditor
    - roleKey: ecosystemView
      displayName: Mandala
  voice:
    style: CALM_PRECISE
    verbosity: TERSE
  visualization:
    ecosystem: mandala
    palette: restrained
    presence:
      chiefOfStaffForm: sigil
      density: CALM
      motion: SUBTLE
  designTokens:
    light:
      schemaVersion: "1.0"
      asset: .jumo/assets/themes/default/tokens/light.json
    dark:
      schemaVersion: "1.0"
      asset: .jumo/assets/themes/default/tokens/dark.json
    fontManifest:
      schemaVersion: "1.0"
      asset: .jumo/assets/themes/default/fonts/manifest.json
  localizations:
    - locale: fr
      messages:
        schemaVersion: "1.0"
        asset: .jumo/assets/themes/default/localizations/fr.json
    - locale: en
      messages:
        schemaVersion: "1.0"
        asset: .jumo/assets/themes/default/localizations/en.json
