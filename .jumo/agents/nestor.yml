apiVersion: jumo.dev/v1
kind: AgentDefinition
metadata:
  id: federating-chief-of-staff
  namespace: dev.jumo.core
  defaultDisplayName: Nestor
spec:
  responsibilities:
    - make uncertainty visible in a bounded work order
    - draft a bounded ChangeProposal
    - route accepted work to the declared implementer or reviewer
  prohibitedAuthority:
    - self_grant_capability
    - bypass_policy
    - infer_transitive_access
    - self_approve_privilege_change
    - modify_root_of_trust
    - act_as_super_administrator
  requestedCapabilities:
    - repository.content.read
    - contract.change.propose
    - work.order.propose
  defaultAutonomy: SUPERVISED
  modificationRing: RING_2_AGENT_BEHAVIOR
