          description: Narrows eligible ProviderAccounts to those sharing this independenceGroup
            (own, or inherited from their ProviderPlatform). Two profiles at the same
            reasoningEffort rung are otherwise indistinguishable for routing purposes
            (provider-platform-catalog lot); a producing and a verifying role's profiles
            declare disjoint values here when ADR-0019's independence separation must
            hold operationally, not just architecturally. Absent by default -- most
            profiles route on rung alone.
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - taskClasses
      - modalities
      - dataScopeCeiling
      - context
      - interaction
      - quality
      - limits
      title: WorkerRequirementProfileSpec
    WorkerContextRequirement:
      properties:
        minimumTokens:
          type: integer
          minimum: 1024
      additionalProperties: false
      type: object
      required:
