      - principal
      - realmId
      - resource
      title: PolicyInput
      description: Typed input structure evaluated by OPA policies.
    ChangeSetFile:
      properties:
        path:
          type: string
          pattern: ^.{1,}$
        contentDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      additionalProperties: false
      type: object
      required:
      - path
      - contentDigest
      title: ChangeSetFile
      description: One ordered file within a ChangeSetProposal. Path traversal and
        duplicate paths within a proposal are rejected by ChangeSetProposalService,
        not by this shape.
    ChangeSetProposal:
      properties:
        changeSetProposalId:
          type: string
        repository:
          type: string
        baseCommitSha:
          type: string
          pattern: ^[0-9a-f]{40}$
        files:
          items:
            $ref: '#/components/schemas/ChangeSetFile'
          type: array
        expectedTreeDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        ownerApproved:
          type: boolean
      additionalProperties: false
      type: object
      required:
      - changeSetProposalId
      - repository
      - baseCommitSha
      - expectedTreeDigest
      - ownerApproved
      title: ChangeSetProposal
      description: Ordered multi-file changeset proposed against one repository, the
        unit ForgeApplier opens as one repository PR within a multi-repository saga
        (multi-repository-change-set-saga AC1). Owner approval and phase progression
        are tracked separately, not on this shape.
    ChangeSetProjection:
      properties:
        changeSetProposalId:
          type: string
        realmId:
          type: string
        provider:
          type: string
        externalId:
          type: string
        url:
          type: string
        state:
          type: string
        branchSha:
          type: string
          pattern: ^[0-9a-f]{40}$
        changesetSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        observedAt:
          type: string
      additionalProperties: false
      type: object
      required:
      - changeSetProposalId
      - realmId
      - provider
      - externalId
      - url
      - state
      - observedAt
      title: ChangeSetProjection
      description: Observed record of the single atomic PR ForgeApplier opened for
        a ChangeSetProposal (multi-repository-change-set-saga AC2/AC5). Existence
        is idempotency evidence -- a second saga execution against the same changeSetProposalId
        returns this record instead of re-opening a PR.
    ProjectionSpec:
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        spec:
          $ref: '#/components/schemas/ProjectionSpecBody'
      additionalProperties: false
      type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      title: ProjectionSpec
      description: A named view of one generated LinkML class. `of:` follows the same
        "generated LinkML class name" pattern as ProcessFlow.payloadType and ProcessStep.signalType
        (execution.yaml) rather than introducing a second typed-payload vocabulary.
    ProjectionSpecBody:
      properties:
        ownerRealm:
          type: string
        of:
          type: string
          description: A generated LinkML class name (metamodel/generated/manifest.json),
            the same pattern ProcessFlow.payloadType and ProcessStep.signalType use.
            Must name a declared class (Rego). Mutually exclusive with payloadSchemaRef;
            exactly one of the two is required (Rego) -- a payload either has a generated
            class or it does not, never both.
        payloadSchemaRef:
          type: string
          description: A JSON Schema 2020-12 document declared under a corpus schemas
            directory (e.g. jumo-core:.jumo/schemas), for a step payload with no generated
            LinkML class of its own -- the metamodel names no such instance-specific
            class (canonical decision 15). Must resolve to a declared schema file
            (Rego). Mutually exclusive with of.
        projectionKind:
          $ref: '#/components/schemas/ProjectionKind'
        renderedBy:
          type: string
          description: The id of an InterfaceSurface `Surface` this projection is
            scoped to. Required and checked against every declared surface (Rego),
            rather than optional, so a projection nobody lists is never silently unconstrained
            -- the same fail-closed shape as every other reference in this metamodel.
        sections:
          items:
            $ref: '#/components/schemas/ProjectionSection'
          type: array
        actions:
          items:
            type: string
          type: array
          description: Every named action must resolve against a declared ActionCapability
            (Rego, same check as every other capability reference in this metamodel)
            and must also be among `renderedBy`'s surface's `proposes` list (Rego)
            -- a projection can never claim an action its rendering surface does not
            offer.
      additionalProperties: false
      type: object
      required:
      - ownerRealm
      - projectionKind
      - renderedBy
      - sections
      title: ProjectionSpecBody
    ProjectionSection:
      properties:
        id:
          type: string
        i18nKey:
          type: string
          pattern: ^[a-z][a-zA-Z0-9]*$
        columns:
          type: integer
          maximum: 12
          minimum: 1
        fields:
          items:
            $ref: '#/components/schemas/ProjectionField'
          type: array
      additionalProperties: false
      type: object
      required:
      - id
      - i18nKey
      - fields
      title: ProjectionSection
    ProjectionOptionCondition:
      properties:
        path:
          type: string
          description: A dotted path into the candidate contract document, e.g. `spec.desiredState`.
        equalsValue:
          type: string
          description: The value at `path` must equal this string. Exactly one of
            equalsValue and present is required (Rego).
        present:
          type: boolean
          description: The value at `path` must be present and non-empty. Exactly
            one of equalsValue and present is required (Rego).
      additionalProperties: false
      type: object
      required:
      - path
      title: ProjectionOptionCondition
      description: One condition a candidate instance must satisfy to be offered as
        a field's option.
    ProjectionField:
      properties:
        path:
          type: string
          description: A slot of the ProjectionSpecBody.of class this field projects
            (Rego).
        representation:
          $ref: '#/components/schemas/FieldRepresentation'
        span:
          type: integer
          maximum: 12
          minimum: 1
        order:
          type: integer
        i18nKey:
          type: string
          pattern: ^[a-z][a-zA-Z0-9]*$
        helpI18nKey:
          type: string
          pattern: ^[a-z][a-zA-Z0-9]*$
        optionsFrom:
          type: string
          description: A contract kind whose declared instances populate this field's
            options, replacing a hardcoded roster lookup with a projection over real
            Git contracts. Must name a declared kind (Rego). An instance is offered
            as its `metadata.id` labelled by its `metadata.name`; a projection selects
            which instances are offered, never how one is addressed. Mutually exclusive
            with optionsFromEnum (Rego).
        optionsFromEnum:
          type: string
          description: 'A generated LinkML enumeration whose permissible values populate
            this field''s options, for a field whose domain is a closed vocabulary
            rather than a contract kind. Mutually exclusive with optionsFrom (Rego).
            Rego checks that an ENUMERATION field declares one of the two, not that
            this names an enumeration rather than a class: the repository facts carry
            per-class slots, not permissible values, so the narrower check waits on
            a fact this module does not produce.'
        optionsEligibility:
          items:
            $ref: '#/components/schemas/ProjectionOptionCondition'
          type: array
          description: Conditions every instance of `optionsFrom` must satisfy to
            be offered. The eligibility a selection applies is part of what the contract
            says the field means, so it is declared here rather than left to whichever
            surface happens to render the field. Conditions read the candidate's Git
            document only -- desired and contractual state; recognized runtime state
            (a machine's observed health) is a different authority and is not reachable
            from a projection.
        required:
          type: boolean
          description: When an AssistedJourneyStep declares both projectionRef and
            requiredFields (work.yaml), requiredFields must name exactly the fields
            marked required here (Rego) -- the two lists describe the same gate and
            must not be allowed to drift.
      additionalProperties: false
      type: object
      required:
      - path
      - representation
      title: ProjectionField
    Effect:
      type: string
      enum:
      - ALLOW
      - DENY
      - ALLOW_WITH_OBLIGATIONS
      - REQUIRE_APPROVAL
      title: Effect
      description: Policy outcome. Only policies authorize; principles never do (ADR-0005).
    Obligation:
      type: string
      enum:
      - STEP_UP_AUTHENTICATION
      - HUMAN_OWNER_APPROVAL
      - INDEPENDENT_VERIFICATION
      - DISCLOSE_AGENT_IDENTITY
      - RETAIN_PROVENANCE
      - REDACT_SECRETS
      - PREVIEW_BEFORE_SEND
      title: Obligation
    AssuranceLevel:
      type: string
      enum:
      - NONE
      - SELF_REPORTED
      - OBSERVED
      - INDEPENDENTLY_VERIFIED
      title: AssuranceLevel
    AutonomyLevel:
      type: string
      enum:
      - OBSERVE
      - DRAFT
      - SUPERVISED
      - BOUNDED_AUTONOMOUS
      title: AutonomyLevel
      description: Progressive autonomy ladder. Configured per action class, channel,
        audience, risk and Realm -- never as one global agent level.
    DataScope:
      type: string
      enum:
      - PUBLISHED_SUMMARY
      - TYPED_ATTENTION_ONLY
      - PROJECT_SCOPED
      - REALM_PRIVATE
      - ORGANIZATION_ONLY
      title: DataScope
      description: 'Widest audience a document or capability''s data may be served
        to. Kept as one enum for audience/publication checks: see InformationClassification
        and the classification/compartment/release-transformation split below for
        the narrower declassification-transformation concept. DataScope itself is
        not retired, since dozens of existing schemas key off it for a single publication-boundary
        check, and splitting it everywhere at once would be overreach for that one
        check.'
    InformationClassification:
      type: string
      enum:
      - PUBLIC
      - INTERNAL
      - REALM_CONFIDENTIAL
      - SECRET
      title: InformationClassification
      description: 'Confidentiality dimension, split out from the single DataScope
        enum: classification, ownership, and declassification are distinct concerns
        (docs/concepts/positionnement-conceptuel.md#flux-dinformation). Used where
        an explicit cross-Realm release transformation is modeled, alongside ReleaseTransformation
        and ReleaseCompartment below -- not a replacement for DataScope''s simpler
        publication-boundary role.'
    ReleaseCompartment:
      type: string
      enum:
      - ATTENTION_SURFACE
      - PARTNER_REALM
      - PUBLIC_DOCUMENTATION
      title: ReleaseCompartment
      description: The audience/purpose compartment a declassified value is released
        into.
    ReleaseTransformation:
      type: string
      enum:
      - VERBATIM
      - SUMMARIZED
      - REDACTED
      - SANITIZED_REASON_CODE
      title: ReleaseTransformation
      description: How a value crossed from its classification into its compartment.
    DeliveryMode:
      type: string
      enum:
      - LIVE
      - DIGEST
      - ESCALATION_ONLY
      - DELEGATED
      - MUTED_UNTIL
      - QUIET_HOURS
      title: DeliveryMode
      description: How a result or an AttentionItem reaches the human. Shared by Practice
        and AttentionItem so a rhythm and the items it carries cannot describe delivery
        in two vocabularies. Pausing delivery never deletes the canonical event.
    WorkerCli:
      type: string
      enum:
      - CLAUDE_CODE
      - CODEX
      - GEMINI_CLI
      - COPILOT_CLI
      title: WorkerCli
      description: The CLI a worker substrate runs. Shared vocabulary -- a WorkerSubstrate
        declares which one it runs (integration) and a CliToolDefinition declares
        which one it implements (execution), so neither module has to import the other
        and no naming convention links a tool to a value.
    Ring:
      type: string
      enum:
      - RING_0_ROOT_OF_TRUST
      - RING_1_CONTROL_PLANE
      - RING_2_AGENT_BEHAVIOR
      - RING_3_GOVERNED_PROJECT
      title: Ring
      description: Self-modification ring (ADR-0008). Ring 0 is never an ordinary
        change target.
    EffectRecoveryKind:
      type: string
      enum:
      - RETRY
      - DEDUPLICATION
      - COMPENSATION
      - CORRECTION
      - RECONCILIATION
      - EXPIRY_WINDOW
      - RESIDUAL_HARM
      title: EffectRecoveryKind
      description: 'Replaces the source schemas'' `reversible: boolean`: compensation
        is application-specific and can itself fail, so a single boolean does not
        say which of these applies (docs/concepts/positionnement-conceptuel.md#sagas-et-recuperation).'
    DocumentRetrieval:
      type: string
      enum:
      - SEMANTIC_SECTIONS
      - WHOLE_DOCUMENT
      - EXCLUDED
      title: DocumentRetrieval
    PrincipalKind:
      type: string
      enum:
      - OWNER
      - MEMBER
      - CONTACT
      title: PrincipalKind
    ConsentState:
      type: string
      enum:
      - NOT_APPLICABLE
      - UNKNOWN
      - REQUESTED
      - GRANTED
      - DECLINED
      - WITHDRAWN
      title: ConsentState
    ProjectLifecycle:
      type: string
      enum:
      - IDEATION
      - BOOTSTRAP
      - ACTIVE
      - MAINTENANCE
      - ARCHIVED
      title: ProjectLifecycle
    ProjectVisibility:
      type: string
      enum:
      - PRIVATE
      - PRIVATE_UNTIL_LICENSED
      - CLIENT_SCOPED
      - PUBLIC
      title: ProjectVisibility
    ForgeProvider:
      type: string
      enum:
      - github
      - gitlab
      title: ForgeProvider
      description: GitHub is the only implemented Forge in V0, behind a Forge-neutral
        abstraction (canonical decision 55).
    RealmSphere:
      type: string
      enum:
      - PERSONAL
      - PROFESSIONAL
      - MOBILITY
      - HOUSEHOLD
      - CLIENT
      title: RealmSphere
      description: Organizational grouping only. A sphere never constitutes a security
        boundary.
    BranchProtectionState:
      type: string
      enum:
      - ADVISORY
      - ENFORCED
      title: BranchProtectionState
      description: ADVISORY means the Forge does not prevent a direct push, a force-push
        or a self-approved merge. A declaration is not a control -- it is a claim
        the owner makes.
    IndependentVerificationState:
      type: string
      enum:
      - ADVISORY
      - ENFORCED
      title: IndependentVerificationState
      description: ADVISORY means no automated check confirms a WorkOrder's producer
        and verifier are distinct actors in this realm. A declaration is not a control
        -- it is a claim the owner makes, and ENFORCED costs an observation and a
        reference to it, same as BranchProtectionState.
    RealmExposureMode:
      type: string
      enum:
      - PRIVATE_STEALTH
      - CLUSTER_SHARED
      - PUBLIC_DISCOVERABLE
      title: RealmExposureMode
      description: Exposure and federation posture of the Realm. Defaults to PRIVATE_STEALTH.
        PRIVATE_STEALTH isolates the Realm from unauthenticated external discovery
        and intra-cluster visibility. CLUSTER_SHARED allows peer discovery and role
        sharing within the same hosted cluster. PUBLIC_DISCOVERABLE exposes public
        agent cards and external federation endpoints.
    KitBindingValueType:
      type: string
      enum:
      - STRING
      - NUMBER
      - BOOLEAN
      - REALM_ID
      - PROJECT_ID
      - ENDPOINT_URL
      - CONFIGURATION_REF
      - SECRET_SLOT
      title: KitBindingValueType
    KitModuleType:
      type: string
      enum:
      - ROLE
      - CONNECTOR
      - FEDERATION_HANDLER
      title: KitModuleType
    OfferingState:
      type: string
      enum:
      - HYPOTHESIS
      - VALIDATED
      - RETIRED
      title: OfferingState
    BillingCadence:
      type: string
      enum:
      - MONTHLY
      - ANNUAL
      title: BillingCadence
    VatTreatment:
      type: string
      enum:
      - EX_VAT
      - INC_VAT
      title: VatTreatment
    SharedRepositoryApprovalPolicy:
      type: string
      enum:
      - OWNER_ONLY
      - MUTUAL_CONSENT
      title: SharedRepositoryApprovalPolicy
      description: Who must approve a forge-write against a shared repository binding.
        OWNER_ONLY applies when a single Realm owns the binding. MUTUAL_CONSENT blocks
        merge until all co-owner Realms have acknowledged.
    TopologyPlacement:
      type: string
      enum:
      - DEDICATED
      - SHARED
      title: TopologyPlacement
    HostnameInclusion:
      type: string
      enum:
      - INCLUDED
      - UNASSIGNED
      title: HostnameInclusion
    RepositoryOwnership:
      type: string
      enum:
      - CLIENT_OWNED
      - JUMO_OWNED
      title: RepositoryOwnership
    RepositoryVisibility:
      type: string
      enum:
      - PRIVATE
      - PUBLIC
      title: RepositoryVisibility
    ConsumerIdentityRouting:
      type: string
      enum:
      - FORBIDDEN
      - ALLOWED
      title: ConsumerIdentityRouting
    SlaTier:
      type: string
      enum:
      - NONE
      - BEST_EFFORT
      - GUARANTEED
      title: SlaTier
    SourceVisibility:
      type: string
      enum:
      - SOURCE_VISIBLE
      - SOURCE_HIDDEN
      title: SourceVisibility
    RedistributionTerms:
      type: string
      enum:
      - FORBIDDEN
      - ALLOWED
      title: RedistributionTerms
    ProhibitedAuthority:
      type: string
      enum:
